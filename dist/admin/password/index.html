<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Sunrise PDF Editor · 관리자 비밀번호 변경</title>
<style>
:root{font:14px/1.5 system-ui,'Malgun Gothic',sans-serif;background:#f2f7fb;color:#15384f}*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}
main{width:min(450px,100%);background:white;border:1px solid #d3e2ed;border-radius:14px;padding:26px;box-shadow:0 14px 45px #163a541a}
h1{font-size:19px;margin:0 0 5px}.sub{color:#658096;font-size:12px;margin:0 0 18px}
form{display:grid;gap:14px}label{display:grid;gap:5px;font-weight:650;font-size:13px}
input{border:1px solid #b5cad8;border-radius:8px;padding:11px;font:inherit;width:100%}
button{background:#246d9b;color:#fff;border:0;border-radius:8px;padding:12px;cursor:pointer;font:inherit;font-weight:700}
button:disabled{opacity:.6}#state{color:#7b4b10;background:#fff7e7;padding:10px;border-radius:8px;min-height:36px;font-size:12px}
a{font-weight:600;color:#246d9b;text-decoration:none}.detail{font-size:12px;color:#5c7384}
</style></head><body><main><h1>SUNRISE PDF EDITOR</h1><p class="sub">관리자 비밀번호 변경</p>
<form id="passwordChangeForm">
<label>현재 비밀번호<input name="oldPassword" type="password" autocomplete="current-password" minlength="16" maxlength="128" required></label>
<label>새 비밀번호<input name="newPassword" type="password" autocomplete="new-password" minlength="16" maxlength="128" required></label>
<label>새 비밀번호 확인<input name="confirmPassword" type="password" autocomplete="new-password" minlength="16" maxlength="128" required></label>
<button id="submitButton" type="submit">비밀번호 변경</button>
</form><p id="state" role="status" aria-live="polite">변경 후 현재 기기를 포함한 모든 관리자 로그인 세션이 종료됩니다.</p>
<p class="detail">비밀번호 원문은 서버로 전송하지 않습니다. 암호화된 브라우저 파생값을 전송하며 서버는 검증값만 보관합니다.</p>
<p><a href="/admin/">관리자 대시보드로 돌아가기</a></p>
</main><script defer src="/assets/sunrise-admin-password.js"></script></body></html>
