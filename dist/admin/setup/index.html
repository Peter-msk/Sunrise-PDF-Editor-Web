<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Sunrise PDF Editor · 최초 관리자 등록</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#15384f;background:#f2f7fb}*{box-sizing:border-box}body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100dvh;padding:20px}
main{width:min(440px,100%);background:white;border:1px solid #d3e2ed;border-radius:16px;box-shadow:0 18px 55px #163a541c;padding:28px}
h1{font-size:21px;margin:0 0 4px}.sub{color:#658096;font-size:13px;margin:0 0 20px}
form{display:grid;gap:14px}label{display:grid;gap:5px;font-size:13px;font-weight:700}
input{padding:12px;border:1px solid #b5cad8;border-radius:8px;font:inherit;font-size:14px;min-width:0}
button{border:0;border-radius:9px;padding:12px;font:inherit;font-weight:750;cursor:pointer;background:#246d9b;color:white}
button:disabled{opacity:.6}#status{color:#7b4b10;background:#fff7e7;border-radius:8px;padding:9px;font-size:12px;min-height:30px}
a{color:#246d9b;font-size:12px;text-decoration:none}.fine{font-size:12px;color:#6a8190;line-height:1.6}
</style></head><body data-mode="setup"><main>
<h1>SUNRISE PDF EDITOR</h1><p class="sub">최초 관리자 계정 등록</p>
<form id="authForm" autocomplete="off">
<label>초기 설정 토큰<input name="bootstrapToken" type="password" minlength="32" maxlength="256" autocomplete="off" required></label>
<label>관리자 아이디<input name="username" type="text" pattern="[a-z][a-z0-9._-]{3,31}" minlength="4" maxlength="32" autocomplete="username" spellcheck="false" required></label>
<label>비밀번호<input name="password" type="password" minlength="16" maxlength="128" autocomplete="new-password" required></label>
<label>비밀번호 확인<input name="confirm" type="password" minlength="16" maxlength="128" autocomplete="new-password" required></label>
<button type="submit" id="submit">계정 등록</button></form>
<p id="status" role="status" aria-live="polite">설정 토큰은 관리자 Cloudflare 계정에서 직접 지정해야 합니다.</p>
<p class="fine">계정 등록 후 초기 설정 토큰을 Cloudflare에서 제거하세요. 비밀번호는 암호학적 해시만 저장합니다.</p>
<p><a href="/">메인 화면으로</a> · <a href="/admin/login/">관리자 로그인</a></p>
</main><script defer src="/assets/sunrise-admin-login.js"></script></body></html>
