<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Sunrise PDF Editor — Web Edition (Chrome / Edge / Mobile)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="/assets/pdf-lib/pdf-lib.min.js"></script>
  <script src="/assets/korean-font.js"></script>
  <script src="/assets/sunrise-edit-state.js"></script>
  <script type="module">
    try {
      window.pdfjsLib = await import("/assets/pdfjs/pdf.min.mjs");
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "/assets/pdfjs/pdf.worker.min.mjs";
    } catch (error) {
      console.error("PDF renderer failed to load", error);
    }
  </script>
  <style>
    :root, html[data-theme="light"] {
      --workspace-bg: #F2F5F8;
      --surface: #FFFFFF;
      --surface-alt: #EAF0F5;
      --surface-soft: #F7F9FB;
      --group-alt: #FBFCFD;
      --border: #C7D1DA;
      --border-soft: #DCE3E9;
      --text: #263746;
      --text-muted: #647687;
      --primary: #1F6F9F;
      --primary-hover: #2B7FAF;
      --primary-soft: #DCEAF5;
      --primary-selected: #CFE3F2;
      --brand: #E58A18;
      --brand-soft: #FFF2DF;
      --success: #2F7D5A;
      --success-soft: #E7F5EE;
      --warning: #C97820;
      --danger: #C94B48;
      --danger-soft: #FDEDEC;
      --disabled: #9AA6B2;
      --canvas-bg: #D9E0E6;
      --shadow-sm: 0 2px 6px rgba(23, 61, 90, 0.08);
      --shadow-lg: 0 14px 36px rgba(15, 35, 52, 0.22);
      --modal-backdrop: rgba(15, 28, 40, 0.45);
      --info-box-bg: #EAF2F8;
      --info-box-border: #C5D7E5;
      --info-box-text: #234156;
    }

    html[data-theme="dark"] {
      --workspace-bg: #141C24;
      --surface: #1B2631;
      --surface-alt: #212F3D;
      --surface-soft: #17212B;
      --group-alt: #1E2936;
      --border: #314355;
      --border-soft: #283747;
      --text: #E6EEF6;
      --text-muted: #9FB0C2;
      --primary: #4BA8DF;
      --primary-hover: #62B8EB;
      --primary-soft: #1E3A52;
      --primary-selected: #244763;
      --brand: #F09B2D;
      --brand-soft: #3B2B16;
      --success: #48B884;
      --success-soft: #19382B;
      --warning: #E69938;
      --danger: #E56B67;
      --danger-soft: #3F1F21;
      --disabled: #5A6B7C;
      --canvas-bg: #0F151C;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 42px rgba(0, 0, 0, 0.58);
      --modal-backdrop: rgba(5, 10, 15, 0.68);
      --info-box-bg: #1C2B3A;
      --info-box-border: #324C63;
      --info-box-text: #D4E6F5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", "Noto Sans KR", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--workspace-bg);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    /* App Shell */
    #appShell {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--workspace-bg);
      overflow: hidden;
    }

    /* Top Command Bar */
    #workspaceCommandBar {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 44px;
      padding: 0 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #workspaceCommandBar::-webkit-scrollbar {
      display: none;
    }

    .brand-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 8px;
      line-height: 1.05;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--primary);
    }

    .brand-sub {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: 0.5px;
    }

    .cmd-divider {
      width: 1px;
      height: 22px;
      background: var(--border-soft);
      margin: 0 3px;
      flex-shrink: 0;
    }

    .quick-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background 0.14s, border-color 0.14s, color 0.14s;
      flex-shrink: 0;
    }

    .quick-icon-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .quick-icon-btn:disabled {
      color: var(--disabled);
      cursor: not-allowed;
      opacity: 0.55;
    }

    .doc-title-area {
      flex: 1;
      min-width: 160px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      overflow: hidden;
    }

    #workspaceDocumentTitle {
      font-weight: 600;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    #workspaceDocumentMeta {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid var(--border-soft);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .top-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .top-pill-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Ribbon Bar */
    #mainRibbon {
      display: flex;
      flex-direction: column;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #mainRibbon.hidden {
      display: none;
    }

    .ribbon-tabs {
      display: flex;
      align-items: stretch;
      height: 32px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      padding-left: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .ribbon-tabs::-webkit-scrollbar {
      display: none;
    }

    .ribbon-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 14px;
      border: none;
      border-right: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      font-size: 12.2px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s;
      flex-shrink: 0;
    }

    .ribbon-tab-btn:hover {
      background: var(--surface-soft);
      color: var(--primary);
    }

    .ribbon-tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      border-top: 2px solid var(--primary);
      font-weight: 700;
    }

    .ribbon-surface {
      display: flex;
      align-items: stretch;
      gap: 5px;
      padding: 5px 8px;
      min-height: 98px;
      background: var(--surface-soft);
      overflow-x: auto;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .ribbon-group {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 3px 4px 0 4px;
      flex-shrink: 0;
    }

    .ribbon-group:nth-child(even) {
      background: var(--group-alt);
    }

    .ribbon-group-body {
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 1px 2px;
      min-height: 66px;
    }

    .ribbon-group-title {
      height: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.8px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-alt);
      border-top: 1px solid var(--border-soft);
      margin: 2px -4px 0 -4px;
      border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;
      padding: 0 6px;
      white-space: nowrap;
    }

    .cmd-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 88px;
      min-width: 84px;
      max-width: 105px;
      min-height: 64px;
      height: auto;
      padding: 5px 3px 3px 3px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.13s;
      text-align: center;
      position: relative;
      flex-shrink: 0;
    }

    .cmd-btn i {
      font-size: 16px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      margin-bottom: 3px;
      transition: transform 0.12s;
    }

    .cmd-btn span {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      word-break: keep-all;
      overflow-wrap: break-word;
      display: block;
      overflow: visible;
    }

    .cmd-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .cmd-btn:hover:not(:disabled) i {
      transform: translateY(-1px);
    }

    .cmd-btn.active {
      background: var(--primary-selected);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    .cmd-btn.active::after {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 10px;
      right: 10px;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
    }

    .cmd-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .cmd-btn:disabled i {
      color: var(--disabled);
    }

    /* Main Workspace Flex Layout with Collapsible Left & Right Panels */
    #mainWorkspace {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      background: var(--workspace-bg);
      position: relative;
      overflow: hidden;
    }

    /* Left & Right Side Panels */
    .side-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      transition: width 0.18s ease, min-width 0.18s ease, transform 0.22s ease;
      flex-shrink: 0;
      position: relative;
      z-index: 20;
    }

    #leftNavigationPane {
      width: 245px;
      min-width: 245px;
    }

    #leftNavigationPane.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      border-right: none;
      overflow: hidden;
    }

    #rightInspectorPane {
      width: 280px;
      min-width: 280px;
      border-right: none;
      border-left: 1px solid var(--border);
    }

    #rightInspectorPane.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      border-left: none;
      overflow: hidden;
    }

    /* Center Edge Handle Toggle Buttons (Left & Right Vertical Middle Handles) */
    .panel-edge-handle {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 35;
      width: 18px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      color: var(--primary);
      border: 1px solid var(--border);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 0.15s, color 0.15s, width 0.15s, border-color 0.15s;
    }

    .panel-edge-handle:hover {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
      width: 22px;
    }

    #leftPanelEdgeToggle {
      left: 0;
      border-left: none;
      border-radius: 0 7px 7px 0;
    }

    #rightPanelEdgeToggle {
      right: 0;
      border-right: none;
      border-radius: 7px 0 0 7px;
    }

    /* Customizable Pane Tab Bar with Close (x) & Add (+) */
    .pane-tab-bar {
      display: flex;
      align-items: center;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      min-height: 33px;
    }

    .pane-tab-bar::-webkit-scrollbar {
      display: none;
    }

    .pane-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 8px 6px 10px;
      border: none;
      border-right: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s;
      flex-shrink: 0;
    }

    .pane-tab-btn:hover {
      background: var(--surface-soft);
      color: var(--primary);
    }

    .pane-tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      border-top: 2px solid var(--primary);
      font-weight: 700;
    }

    .pane-tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      font-size: 9.5px;
      color: var(--text-muted);
      transition: background 0.12s, color 0.12s;
    }

    .pane-tab-close:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .pane-tab-add-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 0 3px;
      border-radius: 4px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--primary);
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.14s;
    }

    .pane-tab-add-btn:hover {
      background: var(--primary-soft);
      border-style: solid;
      border-color: var(--primary);
    }

    .pane-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      -webkit-overflow-scrolling: touch;
    }

    /* Thumbnail List */
    #thumbnailContainer {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .thumb-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      border-radius: 6px;
      border: 1.5px solid var(--border-soft);
      background: var(--surface-soft);
      cursor: pointer;
      transition: all 0.14s;
      position: relative;
    }

    .thumb-card:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .thumb-card.selected {
      border-color: var(--primary);
      background: var(--primary-selected);
      box-shadow: var(--shadow-sm);
    }

    .thumb-canvas-wrap {
      background: #FFFFFF;
      border: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      overflow: hidden;
    }

    .thumb-canvas-wrap canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .thumb-label {
      margin-top: 5px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
    }

    /* Page Nav Control Card (bottom of left panel) */
    #pageNavControlCard {
      padding: 8px 10px;
      background: var(--surface-soft);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    #pageStatusBanner {
      text-align: center;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 4px 6px;
      border-radius: 4px;
    }

    .nav-grid-row {
      display: grid;
      grid-template-columns: 46px 1fr 48px;
      align-items: center;
      gap: 5px;
    }

    .nav-grid-row label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .compact-input {
      width: 100%;
      height: 26px;
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
    }

    .compact-btn {
      height: 26px;
      padding: 0 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .compact-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Center Viewer Column */
    #centerViewerColumn {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--canvas-bg);
      position: relative;
    }

    /* Document Tab Bar */
    #docTabBar {
      display: flex;
      align-items: center;
      height: 34px;
      padding: 0 8px;
      gap: 4px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }

    #docTabBar::-webkit-scrollbar {
      display: none;
    }

    .doc-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 10px;
      border-radius: 5px 5px 0 0;
      border: 1px solid var(--border-soft);
      border-bottom: none;
      background: var(--surface-soft);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      margin-top: 5px;
      transition: all 0.14s;
      flex-shrink: 0;
    }

    .doc-tab.active {
      background: var(--surface);
      color: var(--primary);
      font-weight: 700;
      border-top: 2px solid var(--primary);
    }

    .doc-tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
    }

    .doc-tab-close:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* Context Tool Palette (Floating bar when an insert item is selected) */
    #contextToolPalette {
      position: absolute;
      top: 44px;
      right: 24px;
      z-index: 30;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1.5px solid var(--primary);
      border-radius: 7px;
      box-shadow: var(--shadow-lg);
      flex-wrap: wrap;
    }

    #contextToolPalette.visible {
      display: flex;
    }

    /* Canvas Viewport */
    #canvasViewport {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 26px;
      position: relative;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    #swipePageIndicator {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 38;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--primary);
      border: 1.5px solid var(--primary);
      box-shadow: var(--shadow-lg);
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    #swipePageIndicator.visible {
      opacity: 0.96;
      transform: translateX(-50%) translateY(-4px);
    }

    #pagesFlow { display: grid; gap: 16px; align-items: start; flex: none; padding-bottom: 20px; }
    .page-slot { position: relative; background: white; box-shadow: 0 6px 24px rgba(0,0,0,.18); flex: none; }
    .page-slot > canvas { display: block; width: 100%; height: 100%; }
    .page-preview-overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .page-preview-overlay * { pointer-events: none !important; }
    #pageViewMode { max-width: 112px; font-size: 11px; padding: 4px; border: 1px solid var(--border-soft); border-radius: 4px; background: var(--surface); color: var(--text); }
    #pageStage {
      position: relative;
      background: #FFFFFF;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
      border: 1px solid var(--border);
      transition: width 0.1s, height 0.1s;
    }

    #pdfRenderCanvas {
      display: block;
    }
    #pageStage[data-loading="true"]::after {
      content: "페이지 표시 중…"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: #687582; font-size: 12px; pointer-events: none;
    }

    #searchIndicator { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
    .search-hit-box { position:absolute; background:rgba(255,210,0,.46); outline:1px solid rgba(180,120,0,.7); }
    .search-text-layer { position:absolute; left:0; top:0; line-height:1; opacity:0; pointer-events:none;
      transform-origin:0 0; --scale-round-x:1px; --scale-round-y:1px;
      --text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size)); --min-font-size-inv:calc(1 / var(--min-font-size)); }
    .search-text-layer span { position:absolute; white-space:pre; transform-origin:0 0;
      font-size:calc(var(--text-scale-factor) * var(--font-height)); transform:rotate(var(--rotate, 0deg)) scaleX(var(--scale-x, 1)) scale(var(--min-font-size-inv)); }
    .search-text-layer[data-main-rotation="90"] { transform:rotate(90deg) translateY(-100%); }
    .search-text-layer[data-main-rotation="180"] { transform:rotate(180deg) translate(-100%, -100%); }
    .search-text-layer[data-main-rotation="270"] { transform:rotate(270deg) translateX(-100%); }
    #annotationOverlay {
      position: absolute;
      inset: 0;
      pointer-events: auto;
      overflow: hidden;
    }

    @font-face {
      font-family: "Sunrise Korean";
      src: url("/assets/fonts/DroidSansFallback.ttf") format("truetype");
      font-display: swap;
    }

    .overlay-item {
      font-family: "Sunrise Korean", "Noto Sans KR", sans-serif;
      position: absolute;
      cursor: pointer;
      padding: 4px 7px;
      border: 1.5px dashed transparent;
      border-radius: 3px;
      transition: border-color 0.12s, box-shadow 0.12s;
      user-select: none;
      white-space: pre-wrap;
      line-height: 1.3;
      touch-action: none;
    }

    .overlay-item:hover {
      border-color: var(--primary);
    }

    .overlay-item.selected {
      border: 2px solid var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 159, 0.22);
    }

    .overlay-item.move-mode {
      cursor: move;
    }

    .overlay-resize-handle {
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 11px;
      height: 11px;
      border-radius: 2px;
      background: var(--primary);
      border: 1.5px solid #FFFFFF;
      cursor: nwse-resize;
      display: none;
      z-index: 5;
    }

    .overlay-item.selected .overlay-resize-handle {
      display: block;
    }

    .inline-search-box {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 30px;
      padding: 0 6px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      flex-shrink: 0;
    }

    .inline-search-box:focus-within {
      border-color: var(--primary);
      background: var(--surface);
    }

    .inline-search-input {
      width: 115px;
      border: none;
      background: transparent;
      font-size: 12px;
      color: var(--text);
      outline: none;
    }

    .inline-search-count {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 32px;
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      .inline-search-box {
        display: none;
      }
    }

    .overlay-table {
      border-collapse: collapse;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.92);
    }

    .overlay-table td, .overlay-table th {
      border: 1px solid #263746;
      padding: 3px 6px;
      font-size: 11px;
      color: #1B2631;
    }

    /* Empty Workspace Dropzone */
    #emptyDropState {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 480px;
      margin: auto;
      padding: 32px 24px;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    /* Right Inspector Cards */
    .inspector-card {
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .inspector-card-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .quick-action-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      margin-bottom: 5px;
      border-radius: 5px;
      border: 1px solid var(--border-soft);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.14s;
      text-align: left;
    }

    .quick-action-btn i {
      width: 18px;
      text-align: center;
      color: var(--primary);
    }

    .quick-action-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .list-row-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 8px;
      border-radius: 5px;
      border: 1px solid var(--border-soft);
      background: var(--surface);
      margin-bottom: 5px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.12s;
    }

    .list-row-item:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    /* Bottom Operational Bar */
    #bottomOperationalBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 30px;
      padding: 0 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-muted);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    /* Mobile Bottom Navigation Bar (Shown on Mobile/Tablet <= 820px) */
    #mobileBottomNav {
      display: none;
      align-items: stretch;
      justify-content: space-around;
      height: 52px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 45;
      padding: 2px 4px;
    }

    .mobile-nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 10.5px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .mobile-nav-btn i {
      font-size: 15px;
      color: var(--primary);
    }

    .mobile-nav-btn.active, .mobile-nav-btn:active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .mobile-page-stepper {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      margin: 4px 2px;
    }

    #mobileDrawerBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 30, 0.45);
      z-index: 48;
      backdrop-filter: blur(1px);
    }

    #mobileDrawerBackdrop.open {
      display: block;
    }

    /* Unified Sunrise Modal System */
    #modalBackdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--modal-backdrop);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      backdrop-filter: blur(2px);
    }

    #modalBackdrop.open {
      display: flex;
    }

    .sunrise-modal {
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      background: var(--workspace-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: modalFadeIn 0.15s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .modal-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .dialog-info-box {
      padding: 9px 12px;
      border-radius: 6px;
      background: var(--info-box-bg);
      border: 1px solid var(--info-box-border);
      color: var(--info-box-text);
      font-size: 12px;
      line-height: 1.45;
    }

    .dialog-form-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      align-items: center;
      gap: 8px 10px;
    }

    .dialog-form-grid label {
      font-weight: 600;
      font-size: 12px;
      color: var(--text);
    }

    .dialog-input, .dialog-select, .dialog-textarea {
      width: 100%;
      padding: 6px 9px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12.5px;
    }

    .dialog-input:focus, .dialog-select:focus, .dialog-textarea:focus {
      outline: none;
      border: 2px solid var(--primary);
      padding: 5px 8px;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 11px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .modal-footer-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .dialog-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 32px;
      min-width: 74px;
      padding: 5px 14px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s;
    }

    .dialog-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .dialog-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .dialog-btn.primary:hover:not(:disabled) {
      background: var(--primary-hover);
      color: #FFFFFF;
    }

    .dialog-btn.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #FFFFFF;
    }

    /* Merge List Box inside Merge Modal */
    .merge-layout {
      display: grid;
      grid-template-columns: 1fr 140px;
      gap: 10px;
      min-height: 230px;
    }

    .merge-file-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      overflow-y: auto;
      max-height: 260px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .merge-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 5px;
      border: 1px solid var(--border-soft);
      background: var(--surface-soft);
      font-size: 12px;
      cursor: grab;
      transition: all 0.12s;
    }

    .merge-item.selected {
      background: var(--primary-selected);
      border-color: var(--primary);
      font-weight: 600;
    }

    .merge-item.drag-over {
      border-top: 2px solid var(--brand);
    }

    /* Toast Banner */
    #toastContainer {
      position: fixed;
      bottom: 58px;
      right: 16px;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      max-width: calc(100vw - 32px);
    }

    .sunrise-toast {
      padding: 9px 14px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      border-left: 4px solid var(--primary);
      box-shadow: var(--shadow-lg);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 1280px) {
      #workspacePanelMgrBtn span, #themeToggleLabel, #ribbonToggleLabel { display: none; }
      .top-pill-btn { padding: 0 8px; }
    }
    #placementHint { display: none; padding: 6px 10px; background: var(--primary-soft); color: var(--text); font-size: 12px; }
    #pageStage.placement-mode, #pageStage.placement-mode * { cursor: crosshair !important; }
    #zoomSlider { width: 90px; accent-color: var(--primary); }

    /* =====================================================================
       Mobile & Tablet Responsive Adjustments (<= 820px)
       ===================================================================== */
    @media (max-width: 820px) {
      #backendStatusBadge {
        display: none;
      }

      #themeToggleLabel, #ribbonToggleLabel {
        display: none;
      }

      .top-pill-btn {
        padding: 0 8px;
      }

      /* Side panes turn into slide-over drawers on mobile so the PDF canvas has 100% width */
      #leftNavigationPane, #rightInspectorPane {
        position: fixed;
        top: 44px;
        bottom: 52px;
        z-index: 60;
        width: min(84vw, 310px) !important;
        min-width: min(84vw, 310px) !important;
        box-shadow: var(--shadow-lg);
      }

      #leftNavigationPane {
        left: 0;
        transform: translateX(0);
      }

      #leftNavigationPane.collapsed {
        transform: translateX(-105%);
      }

      #rightInspectorPane {
        right: 0;
        transform: translateX(0);
      }

      #rightInspectorPane.collapsed {
        transform: translateX(105%);
      }

      #canvasViewport {
        padding: 10px 14px;
      }

      .panel-edge-handle {
        width: 20px;
        height: 58px;
        opacity: 0.92;
      }

      #bottomOperationalBar {
        display: none;
      }

      #mobileBottomNav {
        display: flex;
      }

      .ribbon-surface {
        min-height: 86px;
        padding: 4px 6px;
      }

      .cmd-btn {
        width: 80px;
        min-width: 80px;
        height: auto;
        min-height: 60px;
      }

      .dialog-form-grid {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .merge-layout {
        grid-template-columns: 1fr;
      }

      .merge-btn-col {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px !important;
      }

      #contextToolPalette {
        top: 40px;
        left: 10px;
        right: 10px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="appShell">
    <input type="file" id="openPdfInput" accept=".pdf,application/pdf" multiple style="display:none" />
    <input type="file" id="mergePdfInput" accept=".pdf,application/pdf" multiple style="display:none" />
    <input type="file" id="insertPdfInput" accept=".pdf,application/pdf" style="display:none" />
    <input type="file" id="imageToPdfInput" accept="image/png,image/jpeg" multiple style="display:none" />
    <input type="file" id="attachmentInput" multiple style="display:none" />

    <header id="workspaceCommandBar">
      <div class="brand-box">
        <span class="brand-title">SUNRISE</span>
        <span class="brand-sub">PDF EDITOR WEB</span>
      </div>

      <button type="button" class="quick-icon-btn" id="quickOpenBtn" title="PDF 열기 (Ctrl+O)">
        <i class="fa-solid fa-folder-open"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickSaveBtn" title="다른 이름으로 저장 (Ctrl+Shift+S)">
        <i class="fa-solid fa-floppy-disk"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickUndoBtn" title="실행 취소 (Ctrl+Z)">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickRedoBtn" title="다시 실행 (Ctrl+Y)">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickPrevBtn" title="이전 페이지 (PgUp)">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickNextBtn" title="다음 페이지 (PgDown)">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickZoomOutBtn" title="축소 (Ctrl+-)">
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickZoomInBtn" title="확대 (Ctrl+=)">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickFitWidthBtn" title="폭맞춤 (Ctrl+0)">
        <i class="fa-solid fa-arrows-left-right"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickFitPageBtn" title="쪽맞춤 (Ctrl+1)">
        <i class="fa-solid fa-expand"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickSearchBtn" title="문서 검색 대화상자 (Ctrl+F)">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <div class="inline-search-box" title="빠른 본문/주석 검색 (Enter: 다음 결과)">
        <input type="text" id="inlineSearchInput" class="inline-search-input" placeholder="빠른 검색 (Ctrl+F)" />
        <span id="inlineSearchCount" class="inline-search-count">-</span>
        <button type="button" class="quick-icon-btn" id="inlineSearchPrevBtn" style="width:22px;height:22px" title="이전 검색 결과">
          <i class="fa-solid fa-chevron-up" style="font-size:10px"></i>
        </button>
        <button type="button" class="quick-icon-btn" id="inlineSearchNextBtn" style="width:22px;height:22px" title="다음 검색 결과">
          <i class="fa-solid fa-chevron-down" style="font-size:10px"></i>
        </button>
        <button type="button" class="quick-icon-btn" id="highlightSearchBtn" style="width:24px;height:22px" title="현재 검색 결과에 PDF 형광펜 추가" aria-label="현재 검색 결과에 PDF 형광펜 추가">
          <i class="fa-solid fa-highlighter" style="font-size:11px"></i>
        </button>
      </div>

      <div class="doc-title-area">
        <span id="workspaceDocumentTitle">문서를 불러오는 중...</span>
        <span id="workspaceDocumentMeta"></span>
      </div>


      <button type="button" class="top-pill-btn" id="workspacePanelMgrBtn" title="좌/우측 패널 추가 및 삭제 관리">
        <i class="fa-solid fa-table-columns"></i>
        <span>패널 관리</span>
      </button>

      <button type="button" class="top-pill-btn" id="workspaceThemeToggle" title="라이트/다크 모드 전환 (Ctrl+Shift+L)">
        <i class="fa-solid fa-sun" id="themeToggleIcon"></i>
        <span id="themeToggleLabel">라이트 모드</span>
      </button>

      <button type="button" class="top-pill-btn" id="workspaceRibbonToggle" title="상단 리본 표시/숨기기 (Ctrl+F1)">
        <i class="fa-solid fa-chevron-up" id="ribbonToggleIcon"></i>
        <span id="ribbonToggleLabel">리본 숨기기</span>
      </button>
    </header>

    <nav id="mainRibbon" aria-label="주 기능 리본">
      <div class="ribbon-tabs" id="ribbonTabHeader"></div>
      <div class="ribbon-surface" id="ribbonCommandSurface"></div>
    </nav>

    <div id="mobileDrawerBackdrop"></div>

    <main id="mainWorkspace">
      <aside class="side-pane" id="leftNavigationPane">
        <div class="pane-tab-bar" id="leftTabBar">
          <button type="button" class="pane-tab-btn active" data-left-tab="pages">페이지</button>
        </div>

        <div class="pane-body">
          <div class="pane-scroll" id="leftPaneContent">
            <div id="thumbnailContainer"></div>
          </div>
