    // =========================================================================
    // Page & Content Operation Implementations
    // =========================================================================
    // Each entry maps a resulting page to its original page, or null for a new page.
    function remapPageItems(doc, newToOld) {
      const overlays = doc.overlays;
      const bookmarks = doc.bookmarks;
      const seen = new Set();
      const newOverlays = [];
      const newBookmarks = [];
      newToOld.forEach((oldIndex, pageIndex) => {
        if (oldIndex === null) return;
        const duplicate = seen.has(oldIndex);
        seen.add(oldIndex);
        overlays.filter((item) => item.pageIndex === oldIndex).forEach((item) => {
          const copy = JSON.parse(JSON.stringify(item));
          copy.pageIndex = pageIndex;
          if (duplicate) copy.id = `ov_${overlayIdCounter++}`;
          newOverlays.push(copy);
        });
        bookmarks.filter((item) => item.page === oldIndex).forEach((item) => {
          newBookmarks.push({ ...item, page: pageIndex,
            id: duplicate ? `bm_${Date.now()}_${pageIndex}_${newBookmarks.length}` : item.id });
        });
      });
      doc.overlays = newOverlays;
      doc.bookmarks = newBookmarks;
    }

    function insertedPageMap(pageCount, insertAt, count) {
      const original = Array.from({ length: pageCount }, (_, index) => index);
      original.splice(insertAt, 0, ...Array(count).fill(null));
      return original;
    }
    // Capture the editable state so an asynchronous save cannot mix document versions.
    function captureSaveState(doc) {
      return {
        originalBytes: doc.bytes, reader: doc.pdfJsDoc,
        data: JSON.stringify({overlays:doc.overlays, bookmarks:doc.bookmarks, metadata:doc.metadata,
          attachments:doc.attachments.map(({bytes, ...item}) => ({...item, size:bytes.byteLength}))}),
        attachmentBytes: doc.attachments.map(item => item.bytes),
        snapshot: {...doc, bytes:doc.bytes.slice(), overlays:JSON.parse(JSON.stringify(doc.overlays)),
          bookmarks:JSON.parse(JSON.stringify(doc.bookmarks)), metadata:JSON.parse(JSON.stringify(doc.metadata)),
          attachments:doc.attachments.map(item => ({...item, bytes:item.bytes.slice()}))},
      };
    }

    function saveStateIsCurrent(doc, captured) {
      return doc.bytes === captured.originalBytes && doc.pdfJsDoc === captured.reader &&
        doc.attachments.length === captured.attachmentBytes.length &&
        doc.attachments.every((item,i) => item.bytes === captured.attachmentBytes[i]) &&
        JSON.stringify({overlays:doc.overlays, bookmarks:doc.bookmarks, metadata:doc.metadata,
          attachments:doc.attachments.map(({bytes, ...item}) => ({...item, size:bytes.byteLength}))}) === captured.data;
    }

    function pdfCompressionSettings(strength) {
      if (!Number.isInteger(strength) || strength < 0 || strength > 100) throw new Error("압축 강도는 0~100 정수여야 합니다.");
      return {strength, quality: Math.round(100 - strength * 0.6), maxEdge: strength ? Math.round(5200 - strength * 40) : 0};
    }

    async function readPdfImageSamples(object, width, height, colors) {
      const {PDFName, PDFDict} = window.PDFLib, n = PDFName.of;
      const rowBytes = width * colors, expected = rowBytes * height;
      let bytes = object.getContents();
      if (object.dict.get(n('Filter')) === n('FlateDecode')) {
        const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate')).getReader();
        const chunks = []; let size = 0;
        try {
          while (true) {
            const {value, done} = await reader.read(); if (done) break;
            size += value.length;
            if (size > expected + height) { await reader.cancel(); throw new Error('이미지 데이터 크기가 올바르지 않습니다.'); }
            chunks.push(value);
          }
        } finally { reader.releaseLock(); }
        bytes = new Uint8Array(size); let offset = 0;
        for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.length; }
      }
      const parms = object.dict.lookup(n('DecodeParms'));
      if (parms && !(parms instanceof PDFDict)) throw new Error('지원하지 않는 이미지 예측 형식입니다.');
      const number = (key, fallback) => parms?.lookup(n(key))?.asNumber() ?? fallback;
      const predictor = number('Predictor', 1);
      if (predictor === 1) { if (bytes.length !== expected) throw new Error('이미지 크기 불일치'); return bytes; }
      if (number('Columns', 1) !== width || number('Colors', 1) !== colors || number('BitsPerComponent', 8) !== 8)
        throw new Error('지원하지 않는 이미지 예측 매개변수입니다.');
      if (predictor === 2) {
        if (bytes.length !== expected) throw new Error('이미지 크기 불일치');
        bytes = bytes.slice();
        for (let row = 0; row < height; row++) for (let x = colors; x < rowBytes; x++) {
          const i = row * rowBytes + x; bytes[i] = (bytes[i] + bytes[i - colors]) & 255;
        }
        return bytes;
      }
      if (predictor < 10 || predictor > 15 || bytes.length !== expected + height) throw new Error('지원하지 않는 이미지 예측 형식입니다.');
      const output = new Uint8Array(expected);
      for (let row = 0; row < height; row++) {
        const filter = bytes[row * (rowBytes + 1)]; if (filter > 4) throw new Error('이미지 PNG 필터 오류');
        for (let x = 0; x < rowBytes; x++) {
          const i = row * rowBytes + x, left = x >= colors ? output[i - colors] : 0;
          const up = row ? output[i - rowBytes] : 0, corner = row && x >= colors ? output[i - rowBytes - colors] : 0;
          let value = 0;
          if (filter === 1) value = left;
          if (filter === 2) value = up;
          if (filter === 3) value = Math.floor((left + up) / 2);
          if (filter === 4) {
            const p = left + up - corner, a = Math.abs(p - left), b = Math.abs(p - up), c = Math.abs(p - corner);
            value = a <= b && a <= c ? left : b <= c ? up : corner;
          }
          output[i] = (bytes[row * (rowBytes + 1) + x + 1] + value) & 255;
        }
      }
      return output;
    }

    async function compressPdfImages(bytes, settings, onProgress = () => {}) {
      const {PDFDocument, PDFRawStream, PDFName, PDFNumber} = window.PDFLib, n = PDFName.of;
      pdfCompressionSettings(settings.strength);
      if (!Number.isInteger(settings.quality) || settings.quality < 1 || settings.quality > 100 ||
          !Number.isInteger(settings.maxEdge) || settings.maxEdge < 0 || settings.maxEdge > 10000) throw new Error('이미지 압축 설정이 올바르지 않습니다.');
      if (!settings.strength) return {...await compressPdfLossless(bytes), images:0, skipped:0};
      const pdf = await PDFDocument.load(bytes, {updateMetadata:false});
      const images = pdf.context.enumerateIndirectObjects().filter(([,o]) => o instanceof PDFRawStream && o.dict.get(n('Subtype')) === n('Image'));
      // Mask images can be referenced from another image; never JPEG-encode them.
      const masks = new Set();
      for (const [,image] of images) for (const key of ['Mask','SMask']) {
        const value = image.dict.get(n(key)); if (value) masks.add(value.toString());
      }
      let changed = 0, skipped = 0, pixels = 0;
      for (let index = 0; index < images.length; index++) {
        const [ref, object] = images[index], dict = object.dict;
        onProgress(index + 1, images.length);
        const w = dict.lookup(n('Width'))?.asNumber(), h = dict.lookup(n('Height'))?.asNumber();
        const cs = dict.lookup(n('ColorSpace')), filter = dict.get(n('Filter'));
        const softMask = dict.lookup(n('SMask'));
        // Keep the alpha stream and both dimensions unchanged. Matte images require
        // unblending, so leave those parents untouched rather than alter edge colors.
        const supportedMask = !softMask || (softMask instanceof PDFRawStream &&
          softMask.dict.get(n('Subtype')) === n('Image') && softMask.dict.lookup(n('ColorSpace')) === n('DeviceGray') &&
          softMask.dict.lookup(n('BitsPerComponent'))?.asNumber() === 8 &&
          softMask.dict.lookup(n('Width'))?.asNumber() === w && softMask.dict.lookup(n('Height'))?.asNumber() === h &&
          !softMask.dict.get(n('Matte')) && !softMask.dict.get(n('SMask')) && !softMask.dict.get(n('Mask')));
        const supported = (cs === n('DeviceRGB') || cs === n('DeviceGray')) &&
          dict.lookup(n('BitsPerComponent'))?.asNumber() === 8 && !dict.get(n('Decode')) &&
          !dict.get(n('Mask')) && supportedMask && !dict.get(n('ImageMask')) &&
          !dict.get(n('F')) && !dict.get(n('Alternates')) && !dict.get(n('SMaskInData')) && !masks.has(ref.toString());
        if (!supported || !Number.isSafeInteger(w) || !Number.isSafeInteger(h) || w < 128 || h < 128 ||
            w * h > 16000000 || pixels + w * h > 64000000 ||
            (filter && filter !== n('DCTDecode') && filter !== n('FlateDecode'))) { skipped++; continue; }
        pixels += w * h;
        const canvas = document.createElement('canvas'); let bitmap = null;
        try {
          let source;
          if (filter === n('DCTDecode')) {
            if (dict.get(n('DecodeParms'))) { skipped++; continue; }
            const header = await window.PDFLib.JpegEmbedder.for(object.getContents());
            if (header.width !== w || header.height !== h || (header.colorSpace !== 'DeviceRGB' && header.colorSpace !== 'DeviceGray'))
              throw new Error('JPEG 이미지 크기 또는 색상이 PDF와 다릅니다.');
            bitmap = await createImageBitmap(new Blob([object.getContents()], {type:'image/jpeg'}), {imageOrientation:'none'});
            if (bitmap.width !== w || bitmap.height !== h) throw new Error('JPEG 이미지 크기가 PDF와 다릅니다.');
            source = bitmap;
          } else {
            const colors = cs === n('DeviceRGB') ? 3 : 1;
            const samples = await readPdfImageSamples(object, w, h, colors);
            canvas.width = w; canvas.height = h;
            const context = canvas.getContext('2d'), image = context.createImageData(w, h);
            for (let i = 0; i < w * h; i++) {
              image.data[i*4] = samples[i*colors]; image.data[i*4+1] = samples[i*colors + (colors === 3 ? 1 : 0)];
              image.data[i*4+2] = samples[i*colors + (colors === 3 ? 2 : 0)]; image.data[i*4+3] = 255;
            }
            context.putImageData(image, 0, 0);
            bitmap = await createImageBitmap(canvas); source = bitmap;
          }
          const scale = !softMask && settings.maxEdge ? Math.min(1, settings.maxEdge / Math.max(w,h)) : 1;
          canvas.width = Math.max(1, Math.round(w * scale)); canvas.height = Math.max(1, Math.round(h * scale));
          const context = canvas.getContext('2d'); context.imageSmoothingEnabled = true; context.imageSmoothingQuality = 'high';
          context.drawImage(source, 0, 0, canvas.width, canvas.height);
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', settings.quality / 100));
          if (!blob || blob.type !== 'image/jpeg') throw new Error('JPEG 인코딩을 지원하지 않습니다.');
          const jpeg = new Uint8Array(await blob.arrayBuffer());
          if (jpeg.length + 64 >= object.getContents().length) { skipped++; continue; }
          const updated = dict.clone(); updated.set(n('Filter'), n('DCTDecode')); updated.delete(n('DecodeParms'));
          updated.set(n('ColorSpace'), n('DeviceRGB')); updated.set(n('BitsPerComponent'), PDFNumber.of(8));
          updated.set(n('Width'), PDFNumber.of(canvas.width)); updated.set(n('Height'), PDFNumber.of(canvas.height));
          pdf.context.assign(ref, PDFRawStream.of(updated, jpeg)); changed++;
        } finally { bitmap?.close(); canvas.width = canvas.height = 1; }
      }
      let output = changed ? await pdf.save({useObjectStreams:true}) : bytes;
      if (output.length >= bytes.length) { output = bytes; changed = 0; }
      const result = await compressPdfLossless(output);
      const verified = await PDFDocument.load(result.bytes, {updateMetadata:false});
      if (verified.getPageCount() !== pdf.getPageCount()) throw new Error('압축 후 페이지 수가 다릅니다.');
      return {...result, originalSize:bytes.length, changed:result.changed + changed, images:changed, skipped};
    }

    // Losslessly optimize eligible streams; never return a larger PDF.
    async function compressPdfLossless(bytes) {
      if (typeof CompressionStream !== "function") throw new Error("이 브라우저는 PDF 압축을 지원하지 않습니다. 최신 Chrome 또는 Edge를 이용해 주세요.");
      const {PDFDocument, PDFRawStream, PDFName} = window.PDFLib;
      const n = PDFName.of, pdf = await PDFDocument.load(bytes, {updateMetadata:false});
      let total = 0, changed = 0;
      for (const [ref, object] of pdf.context.enumerateIndirectObjects()) {
        if (!(object instanceof PDFRawStream)) continue;
        const dict = object.dict, type = dict.get(n("Type"));
        const filter = dict.get(n("Filter"));
        if ((filter && filter !== n("FlateDecode")) || dict.get(n("DecodeParms")) || dict.get(n("F")) || dict.get(n("FFilter")) || dict.get(n("FDecodeParms")) ||
            type === n("XRef") || type === n("ObjStm") || type === n("Metadata")) continue;
        let content = object.getContents();
        if (filter) {
          if (typeof DecompressionStream !== "function" || content.length > 16 * 1024 * 1024) continue;
          const reader = new Blob([content]).stream().pipeThrough(new DecompressionStream("deflate")).getReader();
          const chunks = []; let size = 0, tooLarge = false;
          try {
            while (true) {
              const {value, done} = await reader.read();
              if (done) break;
              size += value.length;
              if (size > 16 * 1024 * 1024 || total + size > 50 * 1024 * 1024) { tooLarge = true; await reader.cancel(); break; }
              chunks.push(value);
            }
          } catch (error) { throw new Error(`PDF 압축 데이터 해제 실패: ${error.message || error}`); }
          if (tooLarge) continue;
          content = new Uint8Array(size); let offset = 0;
          for (const chunk of chunks) { content.set(chunk, offset); offset += chunk.length; }
        }
        if (content.length < 128 || content.length > 16 * 1024 * 1024 || total + content.length > 50 * 1024 * 1024) continue;
        total += content.length;
        const stream = new Blob([content]).stream().pipeThrough(new CompressionStream("deflate"));
        const compressed = new Uint8Array(await new Response(stream).arrayBuffer());
        if (compressed.length + 32 >= object.getContents().length) continue;
        const updated = dict.clone(); updated.set(n("Filter"), n("FlateDecode"));
        pdf.context.assign(ref, PDFRawStream.of(updated, compressed)); changed++;
      }
      if (!changed) return {bytes, originalSize:bytes.length, changed:0};
      const output = await pdf.save({useObjectStreams:true});
      if (output.length >= bytes.length) return {bytes, originalSize:bytes.length, changed:0};
      const verified = await PDFDocument.load(output, {updateMetadata:false});
      if (verified.getPageCount() !== pdf.getPageCount()) throw new Error("압축 결과의 페이지 수가 일치하지 않습니다.");
      return {bytes:output, originalSize:bytes.length, changed};
    }

    // Do not call pdf.getForm() for an ordinary PDF: pdf-lib creates an
    // AcroForm dictionary on inspection, causing a false data-loss finding.
    function guardBatchSource(pdf) {
      const {PDFName}=window.PDFLib;
      if(pdf.catalog.get(PDFName.of('Perms')) || pdf.catalog.get(PDFName.of('AcroForm')))
        editablePdfForm(pdf);
    }

    // Batch output must preserve structural and form invariants. This is
    // intentionally not a visual/pixel comparison; image quality is controlled
    // separately by the explicit compression strength.
    function verifyBatchPdfStructure(original, output) {
      const {PDFName,PDFTextField,PDFCheckBox,PDFRadioGroup,PDFDropdown,PDFOptionList,PDFButton} = window.PDFLib;
      const n = PDFName.of;
      const originalPages = original.getPages(), resultPages = output.getPages();
      if (originalPages.length !== resultPages.length) throw new Error('압축 후 페이지 수가 일치하지 않습니다.');
      const near=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<0.01;
      for (let i=0;i<originalPages.length;i++){
        const first=originalPages[i],last=resultPages[i];
        if(first.getRotation().angle!==last.getRotation().angle)throw new Error(`${i+1}쪽 회전 정보가 변경되었습니다.`);
        for (const getBox of ['getMediaBox','getCropBox']){
          const a=first[getBox](),b=last[getBox]();
          if(!['x','y','width','height'].every(key=>near(a[key],b[key])))throw new Error(`${i+1}쪽 페이지 크기·좌표가 변경되었습니다.`);
        }
      }
      for(const key of ['AcroForm','Outlines','Names']){
        if(Boolean(original.catalog.get(n(key))) !== Boolean(output.catalog.get(n(key))))
          throw new Error('압축 후 문서 구조가 변경되었습니다: '+key);
      }
      const snapshot=pdf=>pdf.getForm().getFields().map(field=>{
        let kind,value;
        if(field instanceof PDFTextField){kind='text';value=field.getText()??'';}
        else if(field instanceof PDFCheckBox){kind='checkbox';value=field.isChecked();}
        else if(field instanceof PDFRadioGroup){kind='radio';value=field.getSelected()??'';}
        else if(field instanceof PDFDropdown){kind='dropdown';value=field.getSelected();}
        else if(field instanceof PDFOptionList){kind='option-list';value=field.getSelected();}
        else if(field instanceof PDFButton){kind='button';value=null;}
        else throw new Error('압축 후 보존을 검사할 수 없는 양식 필드가 있습니다.');
        return {name:field.getName(),kind,value,readOnly:field.isReadOnly(),required:field.isRequired(),exported:field.isExported()};
      }).sort((a,b)=>a.name.localeCompare(b.name));
      if(JSON.stringify(snapshot(original))!==JSON.stringify(snapshot(output)))
        throw new Error('압축 후 양식 필드 종류·값·설정이 변경되었습니다.');
    }

    async function batchCompressPdfs(files, settings, handlers) {
      if (!files.length || files.length>5 || files.some(file=>!Number.isSafeInteger(file.size)||file.size<0) || files.reduce((sum,file)=>sum+file.size,0)>100*1024*1024)
        throw new Error('PDF는 최대 5개, 합계 100 MiB 이하로 선택해 주세요.');
      for(let index=0;index<files.length;index++){
        if(handlers.cancelled())break;
        const file=files[index]; handlers.progress(index,files.length,file.name);
        try {
          const bytes=await readPdfInputFile(file);
          const original=await window.PDFLib.PDFDocument.load(bytes,{updateMetadata:false});
          guardBatchSource(original);
          if(!original.getPageCount())throw new Error('페이지가 없는 PDF입니다.');
          const result=await compressPdfImages(bytes,settings);
          if(!ArrayBuffer.isView(result.bytes) || result.bytes.BYTES_PER_ELEMENT!==1 || result.bytes.byteLength>bytes.byteLength)
            throw new Error('압축 결과의 파일 크기가 유효하지 않습니다.');
          const check=await window.PDFLib.PDFDocument.load(result.bytes,{updateMetadata:false});
          verifyBatchPdfStructure(original,check);
          if(handlers.cancelled())break;
          handlers.result({index,name:file.name,bytes:result.bytes,originalSize:bytes.byteLength});
        }catch(error){if(handlers.cancelled())break;handlers.error({index,name:file.name,message:error.message||'처리에 실패했습니다.'});}
      }
    }

    // Apply one safe stamping operation per source PDF without changing the source.
    // Unsupported rotated/signed/XFA documents fail individually rather than
    // producing a visually misplaced or structurally damaged document.
    async function batchMarkPdfs(files, settings, handlers) {
      if(!files.length || files.length>5 || files.some(f=>!Number.isSafeInteger(f.size)||f.size<0) ||
          files.reduce((sum,f)=>sum+f.size,0)>100*1024*1024)
        throw new Error('PDF는 최대 5개, 합계 100 MiB 이하로 선택해 주세요.');
      if(!['watermark','page-number'].includes(settings.kind))
        throw new Error('일괄 작업 종류가 올바르지 않습니다.');
      const label=String(settings.text||'').trim().normalize('NFC');
      if(settings.kind==='watermark' && (!label || label.length>40 || /[\x00-\x1f\x7f]/.test(label)))
        throw new Error('워터마크 문구는 1~40자로 입력해 주세요.');
      for(let index=0;index<files.length;index++){
        if(handlers.cancelled())break;
        const file=files[index];
        handlers.progress(index,files.length,file.name);
        try{
          const bytes=await readPdfInputFile(file);
          const original=await window.PDFLib.PDFDocument.load(bytes,{updateMetadata:false});
          guardBatchSource(original);
          if(!original.getPageCount())throw new Error('페이지가 없는 PDF입니다.');
          if(original.getPages().some(page=>((page.getRotation().angle%360)+360)%360!==0))
            throw new Error('회전된 페이지가 포함된 PDF는 위치가 잘못될 수 있어 일괄 표시를 지원하지 않습니다.');
          const {PDFDocument,StandardFonts,rgb,degrees}=window.PDFLib;
          const next=await PDFDocument.load(bytes,{updateMetadata:false});
          const font=settings.kind==='watermark'
            ? await window.SunriseKoreanFont.embed(next,[label])
            : await next.embedFont(StandardFonts.Helvetica);
          const pages=next.getPages(),total=pages.length;
          for(let pageIndex=0;pageIndex<total;pageIndex++){
            if(handlers.cancelled())break;
            const page=pages[pageIndex],box=page.getCropBox();
            if(![box.x,box.y,box.width,box.height].every(Number.isFinite)||box.width<100||box.height<100)
              throw new Error('표시할 수 없는 페이지 크기입니다.');
            if(settings.kind==='watermark'){
              const size=Math.min(40,Math.max(12,box.width/15)),width=font.widthOfTextAtSize(label,size);
              // Position the center of the diagonal text along the crop-box center.
              const angle=Math.PI/4;
              const x=box.x+box.width/2-Math.cos(angle)*width/2;
              const y=box.y+box.height/2-Math.sin(angle)*width/2;
              page.drawText(label,{x,y,size,font,rotate:degrees(45),color:rgb(.45,.45,.45),opacity:.18});
            }else{
              const labelText=(pageIndex+1)+' / '+total,size=10;
              page.drawText(labelText,{x:box.x+box.width-24-font.widthOfTextAtSize(labelText,size),
                y:box.y+17,size,font,color:rgb(.3,.3,.3),opacity:1});
            }
          }
          if(handlers.cancelled())break;
          const output=await next.save({updateFieldAppearances:false});
          validatePdfByteLength(output.byteLength);
          if(!ArrayBuffer.isView(output)||output.BYTES_PER_ELEMENT!==1)
            throw new Error('저장 결과 바이트를 확인하지 못했습니다.');
          const reopened=await PDFDocument.load(output,{updateMetadata:false});
          verifyBatchPdfStructure(original,reopened);
          if(handlers.cancelled())break;
          handlers.result({index,name:file.name,bytes:output,originalSize:bytes.byteLength});
        }catch(error){
          if(handlers.cancelled())break;
          handlers.error({index,name:file.name,message:error.message||'처리에 실패했습니다.'});
        }
      }
    }

                result:({name,bytes,originalSize})=>{const row=document.createElement('p'),button=document.createElement('button');button.type='button';button.textContent=`${name} 내려받기 (${(originalSize/1048576).toFixed(2)} → ${(bytes.byteLength/1048576).toFixed(2)} MiB)`;button.addEventListener('click',()=>downloadBytes(bytes,name.replace(/\.pdf$/i,'')+'_compressed.pdf'));row.append(button);results.append(row)},
                error:({name,message})=>{const row=document.createElement('p');row.textContent=`${name}: ${message}`;results.append(row)}});

          });
        }});
    }

              <option value="end">문서 맨 끝</option>
              <option value="start">문서 맨 앞</option>
            </select>

            <select id="blankSizeSelect" class="dialog-select">

          <div></div>
          <div class="modal-footer-right">
            <button type="button" class="dialog-btn primary" id="blankInsertConfirmBtn">삽입</button>

          </div>
        `,
        onMount: () => {
          document.getElementById("blankInsertCancelBtn").addEventListener("click", closeModal);
          document.getElementById("blankInsertConfirmBtn").addEventListener("click", async () => {
            const posMode = document.getElementById("blankPosSelect").value;
            const sizeMode = document.getElementById("blankSizeSelect").value;
            const count = Math.max(1, Math.min(20, Number(document.getElementById("blankCountInput").value) || 1));
            const { PDFDocument } = window.PDFLib;
            const originalBytes = doc.bytes;
            const pdfDoc = await PDFDocument.load(originalBytes);
            if (doc.bytes !== originalBytes || !allowPageStructureChange(pdfDoc)) return;
            saveUndoSnapshot(doc, `빈 페이지 ${count}장 삽입`);
            const dims = sizeMode === "a4l" ? [841.89, 595.28] : [595.28, 841.89];
            let targetIdx = doc.currentPage + 1;
            if (posMode === "before") targetIdx = doc.currentPage;
            else if (posMode === "start") targetIdx = 0;
            else if (posMode === "end") targetIdx = doc.pageCount;

            for (let c = 0; c < count; c++) {
              pdfDoc.insertPage(targetIdx + c, dims);
            }
            doc.overlays.forEach((ov) => {
              if (ov.pageIndex >= targetIdx) ov.pageIndex += count;
            });
            doc.bookmarks.forEach((bm) => {
              if (bm.page >= targetIdx) bm.page += count;
            });
            doc.bytes = await pdfDoc.save();
            await reloadDocPdfJs(doc);
            doc.currentPage = Math.min(targetIdx, doc.pageCount - 1);
            doc.selectedPages = new Set([doc.currentPage]);
            closeModal();
            await refreshAllViews();
            showToast(`빈 페이지 ${count}장을 삽입했습니다.`, "fa-file-circle-plus");
          });
        },
      });
    }

    async function duplicateSelectedPages(doc) {
      const indices = Array.from(doc.selectedPages).sort((a, b) => a - b);
      if (indices.length === 0) indices.push(doc.currentPage);
      const { PDFDocument } = window.PDFLib;
      const originalBytes = doc.bytes;
      const pdfDoc = await PDFDocument.load(originalBytes);
      if (doc.bytes !== originalBytes || !allowPageStructureChange(pdfDoc)) return;
      saveUndoSnapshot(doc, `선택 페이지 ${indices.length}장 복제`);
      const copied = await pdfDoc.copyPages(pdfDoc, indices);
      const insertAt = Math.max(...indices) + 1;
      copied.forEach((p, offset) => pdfDoc.insertPage(insertAt + offset, p));
      const updatedBytes = await pdfDoc.save();
      const pageMap = Array.from({ length: doc.pageCount }, (_, index) => index);
      pageMap.splice(insertAt, 0, ...indices);
      remapPageItems(doc, pageMap);
      doc.bytes = updatedBytes;
      await reloadDocPdfJs(doc);
      doc.currentPage = Math.min(insertAt, doc.pageCount - 1);
      doc.selectedPages = new Set([doc.currentPage]);
      await refreshAllViews();
      showToast(`선택한 ${indices.length}개 페이지를 복제했습니다.`, "fa-clone");
    }

    // Resolve supported local destinations to stable page references. Refuse
    // unsupported actions, broken trees and deleted targets.
    function allowPageStructureChange(pdfDoc, removedPages = []) {
      if (!allowPageFormStructure(pdfDoc)) return false;
      const {PDFName, PDFDict, PDFRef, PDFArray, PDFString, PDFHexString, PDFNumber} = window.PDFLib;
      const n = PDFName.of, ctx = pdfDoc.context, rootRef = pdfDoc.catalog.get(n("Outlines"));
      if (!rootRef) return true;
      const blocked = message => { showToast(message, "fa-circle-exclamation"); return false; };
      try {
        if (!(rootRef instanceof PDFRef)) throw new Error("unsupported root");
        const root = ctx.lookup(rootRef);
        if (!(root instanceof PDFDict)) throw new Error("invalid root");
        const pages = pdfDoc.getPages(), pageRefs = new Set(pages.map(page => page.ref.toString()));
        const removedRefs = new Set(removedPages.map(index => pages[index]?.ref.toString()));
        if (removedRefs.has(undefined)) throw new Error("invalid page selection");
        const nameText = obj => {
          if (obj instanceof PDFName || obj instanceof PDFString || obj instanceof PDFHexString) return obj.decodeText();
          throw new Error("invalid destination name");
        };
        let namedDestinations;
        const resolveNamed = target => {
          const key = nameText(target);
          if (namedDestinations) {
            const matches = namedDestinations.get(key) || [];
            if (matches.length !== 1) throw new Error("missing or ambiguous destination");
            return matches[0];
          }
          const collected = new Map(); let entriesCount = 0;
          const add = (name, value) => {
            if (++entriesCount > 10000) throw new Error("too many named destinations");
            const matches = collected.get(name) || []; matches.push(value); collected.set(name, matches);
          };
          const legacyRef = pdfDoc.catalog.get(n("Dests"));
          if (legacyRef) {
            const legacy = ctx.lookup(legacyRef);
            if (!(legacy instanceof PDFDict)) throw new Error("invalid destination dictionary");
            for (const [name, value] of legacy.entries()) add(nameText(name), value);
          }
          const namesRef = pdfDoc.catalog.get(n("Names"));
          if (namesRef) {
            const names = ctx.lookup(namesRef);
            if (!(names instanceof PDFDict)) throw new Error("invalid names dictionary");
            const treeRef = names.get(n("Dests"));
            if (treeRef) {
              const queue = [treeRef], visited = new Set(); let traversed = 0;
              while (queue.length) {
                const next = queue.pop();
                if (next instanceof PDFRef) { if (visited.has(next.toString())) throw new Error("cyclic names tree"); visited.add(next.toString()); }
                if (++traversed > 10000) throw new Error("names tree too large");
                const tree = ctx.lookup(next);
                if (!(tree instanceof PDFDict)) throw new Error("invalid names tree");
                const entriesRef = tree.get(n("Names")), kidsRef = tree.get(n("Kids"));
                if (entriesRef && kidsRef) throw new Error("invalid names tree");
                if (entriesRef) {
                  const entries = ctx.lookup(entriesRef);
                  if (!(entries instanceof PDFArray) || entries.size() % 2 || entries.size() > 20000) throw new Error("invalid name entries");
                  for (let i = 0; i < entries.size(); i += 2)
                    add(nameText(ctx.lookup(entries.get(i))), entries.get(i + 1));
                } else if (kidsRef) {
                  const kids = ctx.lookup(kidsRef);
                  if (!(kids instanceof PDFArray) || !kids.size() || kids.size() > 10000) throw new Error("invalid names children");
                  for (let i = 0; i < kids.size(); i++) queue.push(kids.get(i));
                } else throw new Error("empty names tree node");
              }
            }
          }
          namedDestinations = collected;
          const matches = collected.get(key) || [];
          if (matches.length !== 1) throw new Error("missing or ambiguous destination");
          return matches[0];
        };
        const numericUpdates = new Map();
        const destinationPage = value => {
          let destination = ctx.lookup(value);
          if (destination instanceof PDFName || destination instanceof PDFString || destination instanceof PDFHexString)
            destination = ctx.lookup(resolveNamed(destination));
          if (destination instanceof PDFDict) destination = ctx.lookup(destination.get(n("D")));
          if (!(destination instanceof PDFArray) || destination.size() < 2) throw new Error("unsupported destination");
          const target = destination.get(0);
          let ref = target;
          if (target instanceof PDFNumber) {
            const index = target.asNumber();
            if (!Number.isSafeInteger(index) || index < 0 || index >= pages.length) throw new Error("invalid numeric destination");
            ref = pages[index].ref;
            numericUpdates.set(destination, ref);
          }
          if (!(ref instanceof PDFRef)) throw new Error("unsupported destination");
          const pageRef = ref.toString();
          if (!pageRefs.has(pageRef)) throw new Error("unknown page");
          return pageRef;
        };
        // Validate every action in a GoTo-only chain, including /Next arrays.
        // Shared actions are allowed; cycles and other action types are rejected.
        const verifiedActions = new WeakSet(), activeActions = new WeakSet();
        let actionCount = 0;
        const checkActions = initial => {
          const stack = [{value:initial, exit:false}];
          while (stack.length) {
            const entry = stack.pop();
            const action = ctx.lookup(entry.value);
            if (!(action instanceof PDFDict)) throw new Error("invalid action");
            if (entry.exit) { activeActions.delete(action); verifiedActions.add(action); continue; }
            if (activeActions.has(action)) throw new Error("cyclic action chain");
            if (verifiedActions.has(action)) continue;
            if (++actionCount > 10000 || action.get(n("S")) !== n("GoTo") || !action.get(n("D")))
              throw new Error("unsupported action");
            if (removedRefs.has(destinationPage(action.get(n("D"))))) {
              const error = new Error("bookmark target removed"); error.bookmarkTargetRemoved = true; throw error;
            }
            activeActions.add(action);
            stack.push({value:action, exit:true});
            const nextRef = action.get(n("Next"));
            if (nextRef) {
              const next = ctx.lookup(nextRef);
              if (next instanceof PDFArray) {
                if (!next.size() || next.size() > 10000) throw new Error("invalid action chain");
                for (let i = next.size() - 1; i >= 0; i--) stack.push({value:next.get(i), exit:false});
              } else stack.push({value:nextRef, exit:false});
            }
          }
        };
        const pending = [{parent:root, parentRef:rootRef}], seen = new Set();
        while (pending.length) {
          const {parent, parentRef} = pending.pop();
          let ref = parent.get(n("First")), prev = null;
          const last = parent.get(n("Last"));
          if (Boolean(ref) !== Boolean(last)) throw new Error("incomplete siblings");
          while (ref) {
            if (!(ref instanceof PDFRef) || seen.has(ref.toString()) || seen.size >= 10000) throw new Error("invalid outline");
            seen.add(ref.toString());
            const item = ctx.lookup(ref);
            if (!(item instanceof PDFDict) || String(item.get(n("Parent"))) !== String(parentRef) ||
                (prev ? String(item.get(n("Prev"))) !== String(prev) : Boolean(item.get(n("Prev"))))) throw new Error("invalid links");
            let dest = item.get(n("Dest"));
            const actionRef = item.get(n("A"));
            if (actionRef) {
              if (dest) throw new Error("ambiguous action and destination");
              checkActions(actionRef);
            }
            if (dest) {
              const pageRef = destinationPage(dest);
              if (removedRefs.has(pageRef)) return blocked("선택한 페이지를 가리키는 기존 북마크가 있어 삭제·잘라내기를 중단했습니다. 해당 북마크의 페이지를 변경하거나 북마크를 먼저 삭제해 주세요.");
            }
            const child = item.get(n("First")), childLast = item.get(n("Last"));
            if (Boolean(child) !== Boolean(childLast)) throw new Error("invalid children");
            if (child) pending.push({parent:item, parentRef:ref});
            const next = item.get(n("Next"));
            if (!next && String(last) !== String(ref)) throw new Error("invalid last");
            prev = ref; ref = next;
          }
        }
        // Apply only after the whole outline and all target pages have been checked.
        for (const [destination, ref] of numericUpdates) destination.set(0, ref);
        return true;
      } catch (error) {
        if (error.bookmarkTargetRemoved) return blocked("선택한 페이지가 북마크 동작의 목적지여서 삭제·잘라내기를 중단했습니다. 관련 북마크와 동작을 확인해 주세요.");
        console.warn("Unable to verify outline destinations", error);
        return blocked("기존 PDF 북마크 보호를 위해 이 문서의 페이지 변경을 중단했습니다. 지원하지 않는 목차 구조입니다.");
      }
    }

    // pdf-lib copies page widgets but not the document-level form tree. Avoid
    // producing a PDF that looks filled in while its interactive fields are lost.
    function allowPageFormStructure(pdfDoc) {
      const {PDFName, PDFDict, PDFArray} = window.PDFLib;
      const n = PDFName.of, ctx = pdfDoc.context;
      try {
        const formRef = pdfDoc.catalog.get(n("AcroForm"));
        if (formRef) {
          const form = ctx.lookup(formRef);
          if (!(form instanceof PDFDict) || form.get(n("XFA"))) throw new Error("unsupported form");
          const fieldsRef = form.get(n("Fields"));
          if (fieldsRef) {
            const fields = ctx.lookup(fieldsRef);
            if (!(fields instanceof PDFArray) || fields.size()) throw new Error("interactive form fields");
          }
        }
        let seen = 0;
        for (const page of pdfDoc.getPages()) {
          const ref = page.node.get(n("Annots"));
          if (!ref) continue;
          const annotations = ctx.lookup(ref);
          if (!(annotations instanceof PDFArray)) throw new Error("invalid annotations");
          seen += annotations.size();
          if (seen > 100000) throw new Error("too many annotations");
          for (let i = 0; i < annotations.size(); i++) {
            const annotation = ctx.lookup(annotations.get(i));
            if (!(annotation instanceof PDFDict) || annotation.get(n("Subtype")) === n("Widget"))
              throw new Error("widget or invalid annotation");
          }
        }
        return true;
      } catch (error) {
        console.warn("Page operation blocked to protect form data", error?.message || "unknown");
        showToast("양식 입력칸·서명 필드 또는 확인할 수 없는 주석이 있어 페이지 작업을 중단했습니다. 원본은 그대로 유지됩니다.", "fa-circle-exclamation");
        return false;
      }
    }

    async function copySelectedPagesToClipboard(doc, isCut = false) {
      const indices = Array.from(doc.selectedPages).sort((a, b) => a - b);
      if (indices.length === 0) indices.push(doc.currentPage);
      if (isCut && indices.length >= doc.pageCount) {
        showToast("문서의 모든 페이지를 잘라낼 수 없습니다 (최소 1쪽 유지).", "fa-triangle-exclamation");
        return;
      }

      const { PDFDocument } = window.PDFLib;
      const originalBytes = doc.bytes;
      const srcDoc = await PDFDocument.load(originalBytes);
      if (doc.bytes !== originalBytes) { showToast("문서가 변경되어 페이지 작업을 취소했습니다.", "fa-circle-exclamation"); return; }
      if (isCut ? !allowPageStructureChange(srcDoc, indices) : !allowPageFormStructure(srcDoc)) return;
      const clipDoc = await PDFDocument.create();
      const copied = await clipDoc.copyPages(srcDoc, indices);
      copied.forEach((p) => clipDoc.addPage(p));
      const clipBytes = await clipDoc.save();
      if (doc.bytes !== originalBytes) { showToast("문서가 변경되어 페이지 작업을 취소했습니다.", "fa-circle-exclamation"); return; }

      state.pageClipboard = {
        sourceName: doc.name,
        count: indices.length,
        bytes: clipBytes,
        overlays: doc.overlays.filter((item) => indices.includes(item.pageIndex)).map((item) => ({
          ...JSON.parse(JSON.stringify(item)), pageIndex: indices.indexOf(item.pageIndex),
        })),
      };

      if (isCut) {
        saveUndoSnapshot(doc, `페이지 잘라내기 (${indices.length}쪽)`);
        for (const pageIdx of indices.slice().reverse()) {
          srcDoc.removePage(pageIdx);
        }
        const updatedBytes = await srcDoc.save();
        remapPageItems(doc, Array.from({ length: doc.pageCount }, (_, index) => index).filter((index) => !indices.includes(index)));
        doc.bytes = updatedBytes;
        await reloadDocPdfJs(doc);
        await refreshAllViews();
        showToast(`${indices.length}개 페이지를 클립보드로 잘라냈습니다.`, "fa-scissors");
      } else {
        showToast(`${indices.length}개 페이지를 클립보드에 복사했습니다.`, "fa-copy");
      }
    }

    function formatSelectedPages(selection) {
      const sorted = [...selection].sort((a,b) => a-b);
      const groups = [];
      for (const index of sorted) {
        const page = index + 1, last = groups[groups.length - 1];
        if (last && page === last[1] + 1) last[1] = page;
        else groups.push([page,page]);
      }
      return groups.map(([a,b]) => a === b ? String(a) : `${a}-${b}`).join(", ");
    }

    function parseRangeInput(str, maxPages) {
      const input = String(str || "").trim();
      if (!input || input.length > 4096 || !Number.isSafeInteger(maxPages) || maxPages < 1) return [];
      const intervals = [];
      for (const segment of input.split(",")) {
        const match = segment.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);
        if (!match) return [];
        const a = Number(match[1]), b = Number(match[2] || match[1]);
        if (!Number.isSafeInteger(a) || !Number.isSafeInteger(b) || a < 1 || b < 1 || a > maxPages || b > maxPages) return [];
        intervals.push([Math.min(a,b), Math.max(a,b)]);
      }
      intervals.sort((a,b) => a[0] - b[0] || a[1] - b[1]);
      const merged = [];
      for (const interval of intervals) {
        const last = merged[merged.length - 1];
        if (last && interval[0] <= last[1] + 1) last[1] = Math.max(last[1], interval[1]);
        else merged.push(interval);
      }
      const result = [];
      for (const [a,b] of merged) for (let page = a; page <= b; page++) result.push(page - 1);
      return result;
    }

      for (let i = 0; i < doc.pageCount; i++) {

        const [copied] = await single.copyPages(srcDoc, [i]);
        single.addPage(copied);

        downloadBytes(bytes, `${stem}_page_${String(i + 1).padStart(2, "0")}.pdf`);

    async function deleteSelectedPagesFromDoc(doc) {
      const indices = Array.from(doc.selectedPages).sort((a, b) => a - b);
      if (indices.length === 0) indices.push(doc.currentPage);
      if (indices.length >= doc.pageCount) {
        showToast("문서의 모든 페이지를 삭제할 수 없습니다 (최소 1쪽 유지).", "fa-triangle-exclamation");
        return;

      const { PDFDocument } = window.PDFLib;
      const originalBytes = doc.bytes;
      const pdfDoc = await PDFDocument.load(originalBytes);
      if (doc.bytes !== originalBytes) { showToast("문서가 변경되어 페이지 작업을 취소했습니다.", "fa-circle-exclamation"); return; }
      if (!allowPageStructureChange(pdfDoc, indices)) return;
      saveUndoSnapshot(doc, `선택 페이지 ${indices.length}장 삭제`);
      const delSet = new Set(indices);
      for (const idx of indices.slice().reverse()) {
        pdfDoc.removePage(idx);
      }
      doc.overlays = doc.overlays
        .filter((ov) => !delSet.has(ov.pageIndex))
        .map((ov) => {
          const shift = indices.filter((dIdx) => dIdx < ov.pageIndex).length;
          return { ...ov, pageIndex: ov.pageIndex - shift };
        });
      doc.bookmarks = doc.bookmarks
        .filter((bm) => !delSet.has(bm.page))
        .map((bm) => {
          const shift = indices.filter((dIdx) => dIdx < bm.page).length;
          return { ...bm, page: bm.page - shift };
        });
      doc.bytes = await pdfDoc.save();
      await reloadDocPdfJs(doc);
      await refreshAllViews();
      showToast(`선택한 ${indices.length}개 페이지를 삭제했습니다.`, "fa-trash-can");

    async function rotateSelectedPages(doc, deltaDegrees) {
      if (doc.operationBusy) return;
      const indices = Array.from(doc.selectedPages).sort((a, b) => a - b);
      if (indices.length === 0) indices.push(doc.currentPage);
      const supportedTypes = new Set(["Text","Header","Footer","PageNumber","Note","Highlight","Stamp","Table","Watermark"]);
      const affected = doc.overlays.filter(item => indices.includes(item.pageIndex));
      if (![90,-90].includes(deltaDegrees) || affected.some(item => !supportedTypes.has(item.type) ||
          !Number.isFinite(item.x) || !Number.isFinite(item.y) ||
          ![0,90,180,270].includes(item.rotation || 0) ||
          !Number.isFinite(doc.pageSizes?.[item.pageIndex]?.width) || !Number.isFinite(doc.pageSizes?.[item.pageIndex]?.height))) {
        showToast("삽입 항목의 위치 또는 방향을 확인할 수 없어 회전을 중단했습니다.", "fa-triangle-exclamation"); return;
      }
      doc.operationBusy = true;
      const anchorPage = doc.currentPage, oldBytes = doc.bytes, oldReader = doc.pdfJsDoc;
      const overlayState = JSON.stringify(doc.overlays);
      const nextOverlays = doc.overlays.map(item => {
        if (!indices.includes(item.pageIndex)) return item;
        const size = doc.pageSizes[item.pageIndex];
        return {...item, x: deltaDegrees > 0 ? size.height-item.y : item.y,
          y: deltaDegrees > 0 ? item.x : size.width-item.x,
          rotation: ((item.rotation || 0)+deltaDegrees+360)%360};
      });
      try {
        const { PDFDocument, degrees } = window.PDFLib;
        const pdfDoc = await PDFDocument.load(doc.bytes);
        indices.forEach(idx => {
          const page = pdfDoc.getPage(idx);
          page.setRotation(degrees(((page.getRotation().angle || 0) + deltaDegrees + 360) % 360));
        });
        const nextBytes = await pdfDoc.save();
        const info = await parsePageCountAndMeta(nextBytes);
        if (doc.bytes !== oldBytes || doc.pdfJsDoc !== oldReader || activeDoc() !== doc || JSON.stringify(doc.overlays) !== overlayState) {
          await info.pdfJsDoc.destroy(); throw new Error("문서가 변경되어 회전을 취소했습니다.");
        }
        saveUndoSnapshot(doc, `페이지 회전 (${deltaDegrees > 0 ? "시계" : "반시계"} 90°)`);
        doc.bytes = nextBytes;
        doc.overlays = nextOverlays;
        await reloadDocPdfJs(doc, {info, selection: indices});
        doc.currentPage = anchorPage;
        doc.scrollSyncSuspended = true;
        await refreshAllViews();
        if (activeDoc() === doc) {
          const slot = document.querySelector(`#pagesFlow [data-page-index="${anchorPage}"]`);
          slot?.scrollIntoView({block: "start", inline: "nearest"});
          updateCommandStates(); syncThumbnailSelection(doc);
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }
        showToast(`${indices.length}개 페이지를 회전했습니다.`, deltaDegrees > 0 ? "fa-rotate-right" : "fa-rotate-left");
      } catch (error) {
        console.error("페이지 회전 실패", error);
        showToast(`페이지 회전에 실패했습니다: ${error.message || error}`, "fa-circle-exclamation");
      } finally { doc.scrollSyncSuspended = false; doc.operationBusy = false; }
    }

    // =========================================================================
    // Content & Annotation Modals
    // =========================================================================
    function editablePdfForm(pdf) {
      const {PDFName, PDFDict, PDFSignature}=window.PDFLib;
      const n=PDFName.of, acroRef=pdf.catalog.get(n('AcroForm'));
      if (pdf.catalog.get(n('Perms'))) throw new Error("서명 또는 문서 권한이 있는 PDF는 양식을 변경할 수 없습니다.");
      if (acroRef) {
        const acro=pdf.context.lookup(acroRef);
        if (!(acro instanceof PDFDict) || acro.get(n('XFA')) || acro.get(n('SigFlags'))) throw new Error("XFA 또는 서명 관련 양식은 지원하지 않습니다.");
      }
      const form=pdf.getForm();
      if (form.getFields().some(field=>field instanceof PDFSignature)) throw new Error("서명 필드가 있는 PDF는 변경할 수 없습니다.");
      return form;
    }

    async function createPdfFormField(bytes, spec) {
      const {PDFDocument} = window.PDFLib;
      if (!/^[^\.\x00-\x1f]{1,80}$/.test(spec.name) || !spec.name.trim() || spec.name !== spec.name.trim()) throw new Error("필드 이름은 1~80자이며 앞뒤 공백과 마침표를 사용할 수 없습니다.");
      if (!['text','date','checkbox'].includes(spec.kind) || !Number.isSafeInteger(spec.page)) throw new Error("필드 종류 또는 페이지가 올바르지 않습니다.");
      if (typeof spec.value !== 'string' || spec.value.length > 1000 || /[\x00-\x08\x0b\x0c\x0e-\x1f]/.test(spec.value)) throw new Error("초기 입력값이 올바르지 않습니다.");
      if (spec.kind === 'date' && spec.value && (!/^\d{4}-\d{2}-\d{2}$/.test(spec.value) || Number.isNaN(Date.parse(spec.value+'T00:00:00Z')) || new Date(spec.value+'T00:00:00Z').toISOString().slice(0,10) !== spec.value)) throw new Error("날짜는 YYYY-MM-DD 형식의 실제 날짜로 입력하세요.");
      const pdf = await PDFDocument.load(bytes);
      const form=editablePdfForm(pdf), existing=form.getFields();
      if (existing.some(field=>field.getName()===spec.name)) throw new Error("같은 이름의 양식 필드가 이미 있습니다.");
      if (spec.page < 0 || spec.page >= pdf.getPageCount()) throw new Error("페이지 번호를 확인해 주세요.");
      const page=pdf.getPage(spec.page), box=page.getCropBox(), rotation=((page.getRotation().angle%360)+360)%360;
      if(rotation!==0) throw new Error("회전된 페이지에는 입력칸을 만들 수 없습니다. 회전을 해제한 후 다시 시도해 주세요.");
      const {x,y,width,height}=spec;
      if (![x,y,width,height].every(Number.isFinite) || x<0 || y<0 || width<10 || height<10 || x+width>box.width || y+height>box.height) throw new Error("위치와 크기가 페이지 범위에 맞지 않습니다.");
      const options={x:box.x+x,y:box.y+y,width,height,borderWidth:1};
      if(spec.kind==='checkbox') {
        const field=form.createCheckBox(spec.name); field.addToPage(page,options);
        if(spec.checked)field.check(); else field.uncheck();
        if(spec.readOnly)field.enableReadOnly();
        field.updateAppearances();
      } else {
        const field=form.createTextField(spec.name); field.addToPage(page,options);
        field.setText(spec.value); if(spec.readOnly)field.enableReadOnly();
        const font=await window.SunriseKoreanFont.embed(pdf,[spec.value || ' ']);
        field.updateAppearances(font);
      }
      return pdf.save({updateFieldAppearances:false});
    }

    async function updatePdfFormField(bytes, name, value) {
      const {PDFDocument,PDFTextField,PDFCheckBox}=window.PDFLib;
      if(typeof name!=='string' || name.length>512)throw new Error('필드 이름이 올바르지 않습니다.');
      const pdf=await PDFDocument.load(bytes), form=editablePdfForm(pdf);
      const field=form.getFields().find(item=>item.getName()===name);
      if(!field)throw new Error('필드를 찾을 수 없습니다.');
      if(field.isReadOnly())throw new Error('읽기 전용 필드는 수정할 수 없습니다.');
      if(field instanceof PDFTextField){
        if(field.isRichFormatted() || field.isPassword() || field.isFileSelector())throw new Error('서식 있는 텍스트, 비밀번호 및 파일 선택 필드는 지원하지 않습니다.');
        if(typeof value!=='string' || value.length>1000 || /[\x00-\x08\x0b\x0c\x0e-\x1f]/.test(value))throw new Error('입력값을 확인해 주세요.');
        field.setText(value);
        const font=await window.SunriseKoreanFont.embed(pdf,[value||' ']);
        field.updateAppearances(font);
      }else if(field instanceof PDFCheckBox){
        if(typeof value!=='boolean')throw new Error('체크박스 상태를 확인해 주세요.');
        if(value)field.check();else field.uncheck();field.updateAppearances();
      }else throw new Error('이 종류의 양식 필드는 아직 수정할 수 없습니다.');
      return pdf.save({updateFieldAppearances:false});
    }

    async function openFillFormFieldModal(doc) {
      if(doc.operationBusy)return;
      const captured=captureSaveState(doc),{PDFDocument,PDFTextField,PDFCheckBox}=window.PDFLib;
      let fields;
      try{
        const pdf=await PDFDocument.load(captured.snapshot.bytes),form=editablePdfForm(pdf);
        fields=form.getFields().filter(field=>(field instanceof PDFTextField && !field.isRichFormatted() && !field.isPassword() && !field.isFileSelector()) || field instanceof PDFCheckBox).map(field=>({name:field.getName(),kind:field instanceof PDFTextField?'text':'checkbox',readOnly:field.isReadOnly(),value:field instanceof PDFTextField?(field.getText()||''):field.isChecked()}));
        if(activeDoc()!==doc || !saveStateIsCurrent(doc,captured))throw new Error('문서가 변경되어 작업을 취소했습니다.');
      }catch(error){showToast(error.message||'양식 필드를 읽지 못했습니다.','fa-circle-exclamation');return;}
      if(!fields.length){showToast('수정 가능한 텍스트 또는 체크박스 필드가 없습니다.','fa-circle-info');return;}
      openModal({title:'PDF 양식 입력값 수정',icon:'fa-pen-to-square',width:'540px',
        bodyHtml:`<p>텍스트 입력칸과 체크박스를 수정할 수 있습니다. 읽기 전용 항목은 수정할 수 없습니다.</p><div class="dialog-form-grid">
        <label for="fillFieldSelect">양식 필드</label><select id="fillFieldSelect" class="dialog-select"></select>
        <label for="fillFieldText">텍스트 값</label><input id="fillFieldText" class="dialog-input" maxlength="1000">
        <label for="fillFieldCheck">체크 상태</label><input id="fillFieldCheck" type="checkbox"></div><p id="fillFieldStatus" role="status" aria-live="polite"></p>`,
        footerHtml:`<div></div><div class="modal-footer-right"><button type="button" class="dialog-btn primary" id="fillFieldApply">적용</button><button type="button" class="dialog-btn" id="fillFieldCancel">취소</button></div>`,
        onMount:()=>{
          const get=id=>document.getElementById(id),select=get('fillFieldSelect'),button=get('fillFieldApply'),status=get('fillFieldStatus');
          fields.forEach((field,index)=>{const option=document.createElement('option');option.value=String(index);option.textContent=field.name+(field.readOnly?' (읽기 전용)':'');select.append(option)});
          const sync=()=>{const field=fields[Number(select.value)];get('fillFieldText').disabled=field.kind!=='text'||field.readOnly;get('fillFieldCheck').disabled=field.kind!=='checkbox'||field.readOnly;get('fillFieldText').value=field.kind==='text'?field.value:'';get('fillFieldCheck').checked=field.kind==='checkbox'&&field.value;button.disabled=field.readOnly;status.textContent=field.readOnly?'읽기 전용 필드입니다.':''};
          select.addEventListener('change',sync);sync();get('fillFieldCancel').addEventListener('click',closeModal);
          button.addEventListener('click',async()=>{
            if(doc.operationBusy || activeDoc()!==doc || !saveStateIsCurrent(doc,captured)){status.textContent='문서가 변경되어 다시 열어야 합니다.';return;}
            const field=fields[Number(select.value)],value=field.kind==='text'?get('fillFieldText').value:get('fillFieldCheck').checked;
            doc.operationBusy=true;button.disabled=true;status.textContent='입력값을 적용하고 있습니다.';let info;
            try{
              const nextBytes=await updatePdfFormField(captured.snapshot.bytes,field.name,value);
              info=await parsePageCountAndMeta(nextBytes);
              if(!get('modalBackdrop').classList.contains('open') || get('fillFieldApply')!==button || activeDoc()!==doc || !saveStateIsCurrent(doc,captured))throw new Error('창이 닫히거나 문서가 변경되어 작업을 취소했습니다.');
              saveUndoSnapshot(doc,'PDF 양식 입력값 수정');doc.bytes=nextBytes;await reloadDocPdfJs(doc,{info});info=null;
              closeModal();await refreshAllViews();showToast('양식 값을 적용했습니다. PDF를 저장해 주세요.','fa-square-check');
            }catch(error){if(info?.pdfJsDoc && doc.pdfJsDoc!==info.pdfJsDoc)await info.pdfJsDoc.destroy();console.warn('Unable to update PDF form field',error);status.textContent=error.message||'양식 값을 적용하지 못했습니다.';}
            finally{doc.operationBusy=false;button.disabled=field.readOnly;}
          });
        }});
    }

    let searchEpoch = 0;
    function clearSearchResults() {
      searchEpoch++;
      state.searchResults = []; state.activeSearchHitIndex = -1; state.searchScrollHit = null;

    async function renderSearchIndicator(doc, pageIndex, scale, generation) {
      const target = document.getElementById("searchIndicator"), hit = state.searchResults[state.activeSearchHitIndex];
      if (!target || !hit || hit.docId !== doc.id || hit.reader !== doc.pdfJsDoc || hit.pageIndex !== pageIndex) return;
      const current = () => generation === renderGeneration && activeDoc() === doc && doc.pdfJsDoc === hit.reader &&
        state.searchResults[state.activeSearchHitIndex] === hit && doc.currentPage === pageIndex;
      let textLayer;
      try {
        if (hit.kind === "overlay") {
          const element = [...document.querySelectorAll("#annotationOverlay .overlay-item")].find(el => el.dataset.overlayId === hit.overlayId);
          if (!element || !current()) return;
          const box = element.getBoundingClientRect(), parent = target.getBoundingClientRect();
          const marker = document.createElement("div"); marker.className = "search-hit-box";
          Object.assign(marker.style,{left:`${box.left-parent.left}px`,top:`${box.top-parent.top}px`,width:`${box.width}px`,height:`${box.height}px`});
          target.replaceChildren(marker);
          if (state.searchScrollHit === hit) { state.searchScrollHit = null; marker.scrollIntoView({block:"nearest",inline:"nearest"}); }
          return;
        }
        if (hit.kind !== "text" || !window.pdfjsLib?.TextLayer) return;
        const page = await hit.reader.getPage(pageIndex+1), content = await page.getTextContent();
        if (!current()) return;
        textLayer = document.createElement("div"); textLayer.className = "search-text-layer";
        textLayer.style.setProperty("--total-scale-factor",String(scale));
        document.getElementById("pageStage").appendChild(textLayer);
        const layer = new window.pdfjsLib.TextLayer({textContentSource:content,container:textLayer,viewport:page.getViewport({scale})});
        await layer.render();
        if (!current()) return;
        const text = layer.textDivs[hit.itemIndex]?.firstChild;
        if (!text || hit.end > text.length) return;
        const range = document.createRange(); range.setStart(text,hit.start); range.setEnd(text,hit.end);
        const parent = target.getBoundingClientRect();
        const rects = [...range.getClientRects()].filter(box => box.width > 0 && box.height > 0);
        const item = content.items.filter(item => typeof item.str === "string")[hit.itemIndex];
        const transform = item?.transform;
        hit.highlightRect = null;
        if (rects.length === 1 && item?.dir !== "rtl" && transform && transform[0] > 0 && transform[3] > 0 &&
            Math.abs(transform[1]) < 0.001 && Math.abs(transform[2]) < 0.001) {
          const box = rects[0], viewport = page.getViewport({scale});
          const points = [[box.left-parent.left,box.top-parent.top],[box.right-parent.left,box.top-parent.top],
            [box.left-parent.left,box.bottom-parent.top],[box.right-parent.left,box.bottom-parent.top]]
            .map(([x,y]) => viewport.convertToPdfPoint(x,y));
          const xs=points.map(p=>p[0]), ys=points.map(p=>p[1]);
          const rect=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
          if (rect.every(Number.isFinite) && rect[2]>rect[0] && rect[3]>rect[1]) hit.highlightRect=rect;
        }
        const markers = rects.map(box => {
          const marker = document.createElement("div"); marker.className = "search-hit-box";
          Object.assign(marker.style,{left:`${box.left-parent.left}px`,top:`${box.top-parent.top}px`,width:`${box.width}px`,height:`${box.height}px`}); return marker;
        });
        if (current()) {
          target.replaceChildren(...markers);
          if (markers.length && state.searchScrollHit === hit) { state.searchScrollHit = null; markers[0].scrollIntoView({block:"nearest",inline:"nearest"}); }
        }
      } catch (error) { console.warn("검색 위치 표시 실패",error); }
      finally { textLayer?.remove(); }
    }

    function addPdfHighlight(pdfDoc, pageIndex, rect) {
      if (!Array.isArray(rect) || rect.length !== 4 || !rect.every(Number.isFinite) || rect[2] <= rect[0] || rect[3] <= rect[1])
        throw new Error("형광펜 위치가 올바르지 않습니다.");
      const page = pdfDoc.getPage(pageIndex), context = pdfDoc.context;
      const [x1,y1,x2,y2] = rect, width = x2-x1, height = y2-y1;
      const appearance = context.flateStream(`q /GS0 gs 1 1 0 rg 0 0 ${width} ${height} re f Q`, {
        Type:"XObject", Subtype:"Form", FormType:1, BBox:[0,0,width,height],
        Resources:{ExtGState:{GS0:{Type:"ExtGState",ca:0.35,CA:0.35,BM:"Multiply"}}},
      });
      const annotation = context.obj({Type:"Annot",Subtype:"Highlight",Rect:rect,
        QuadPoints:[x1,y2,x2,y2,x1,y1,x2,y1],C:[1,1,0],CA:0.35,F:4,
        AP:{N:context.register(appearance)},P:page.ref});
      page.node.addAnnot(context.register(annotation));
    }

    async function highlightCurrentSearchHit() {
      const doc=activeDoc(), hit=state.searchResults[state.activeSearchHitIndex];
      if (!doc || doc.operationBusy) return;
      if (!hit || hit.docId!==doc.id || hit.reader!==doc.pdfJsDoc || hit.pageIndex!==doc.currentPage ||
          hit.kind!=="text" || !hit.highlightRect || document.getElementById("inlineSearchInput")?.value.trim()!==state.lastSearchTerm) {
        showToast("위치를 확인할 수 있는 본문 검색 결과에서만 형광펜을 추가할 수 있습니다.","fa-circle-info"); return;
      }
      doc.operationBusy=true;
      const oldBytes=doc.bytes, reader=doc.pdfJsDoc;
      try {
        const pdfDoc=await window.PDFLib.PDFDocument.load(oldBytes);
        addPdfHighlight(pdfDoc,hit.pageIndex,hit.highlightRect);
        const nextBytes=await pdfDoc.save(), info=await parsePageCountAndMeta(nextBytes);
        if (activeDoc()!==doc || doc.bytes!==oldBytes || doc.pdfJsDoc!==reader || doc.currentPage!==hit.pageIndex ||
            state.searchResults[state.activeSearchHitIndex]!==hit || document.getElementById("inlineSearchInput")?.value.trim()!==state.lastSearchTerm) {
          await info.pdfJsDoc.destroy(); throw new Error("문서 또는 검색 결과가 변경되어 작업을 취소했습니다.");
        }
        saveUndoSnapshot(doc,"검색 결과 형광펜 추가"); doc.bytes=nextBytes;
        await reloadDocPdfJs(doc,{info,selection:[hit.pageIndex]});
        await refreshAllViews();
        showToast("형광펜을 추가했습니다. PDF를 저장하면 주석이 보존됩니다.","fa-highlighter");
      } catch (error) {
        console.error("형광펜 추가 실패",error);
        showToast(`형광펜 추가 실패: ${error.message || error}`,"fa-circle-exclamation");
      } finally { doc.operationBusy=false; }
    }

    async function runDocumentSearch(term, options = {}) {
      const epoch = ++searchEpoch, doc = activeDoc();
      const countEl = document.getElementById("inlineSearchCount"), inlineInput = document.getElementById("inlineSearchInput");
      state.searchResults = []; state.activeSearchHitIndex = -1; state.searchScrollHit = null;
      document.getElementById("searchIndicator")?.replaceChildren();
      if (!doc || !term) { if (countEl) countEl.textContent = "-"; return; }
      state.lastSearchTerm = term; if (inlineInput && inlineInput.value !== term) inlineInput.value = term;
      if (countEl) countEl.textContent = "검색 중";
      const reader = doc.pdfJsDoc;
      const valid = () => epoch === searchEpoch && activeDoc() === doc && doc.pdfJsDoc === reader;
      const ready = await ensurePageTexts(doc);
      if (!ready || !valid()) return;
      const caseSensitive = Boolean(options.caseSensitive), needle = caseSensitive ? term : term.toLowerCase();
      let truncated = false;
      for (let i=0; i<doc.pageCount; i++) {
        const baseText = doc.pageTexts[i] || "", searchable = caseSensitive ? baseText : baseText.toLowerCase();
        const pageResults = [];
        if (searchable.includes(needle)) {
          try {
            const content = await (await reader.getPage(i+1)).getTextContent();
            if (!valid()) return;
            let itemIndex=0,cursor=0; const parts=[];
            for (const item of content.items) {
              const text=item.str || "";
              if (typeof item.str === "string") parts.push({itemIndex:itemIndex++,start:cursor,end:cursor+text.length});
              cursor += text.length+1;
            }
            let offset=0,partIndex=0,found;
            while ((found=searchable.indexOf(needle,offset)) !== -1 && pageResults.length < 5000) {
              while (partIndex<parts.length && parts[partIndex].end<=found) partIndex++;
              const part=parts[partIndex], within=searchable.length===baseText.length && part && found>=part.start && found+term.length<=part.end;
              const snippet=baseText.slice(Math.max(0,found-20),found+term.length+40);
              pageResults.push(within ? {kind:"text",itemIndex:part.itemIndex,start:found-part.start,end:found-part.start+term.length,snippet} : {kind:"page",snippet});
              offset=found+Math.max(1,needle.length);
            }
            if (pageResults.length >= 5000 && searchable.indexOf(needle, offset) !== -1) truncated = true;
          } catch (error) { console.warn(`검색 위치 분석 실패 (${i+1}쪽)`,error); pageResults.push({kind:"page",snippet:baseText.slice(0,90)}); }
        }
        for (const overlay of doc.overlays.filter(item => item.pageIndex===i)) {
          const value=String(overlay.text || ""), check=caseSensitive ? value : value.toLowerCase();
          if (check.includes(needle)) pageResults.push({kind:"overlay",overlayId:overlay.id,snippet:value.slice(0,90)});
        }
        for (const result of pageResults) {
          if (state.searchResults.length>=5000) { truncated=true; break; }
          state.searchResults.push({...result,pageIndex:i,docId:doc.id,reader});
        }
        if (truncated) break;
      }
      if (!valid()) return;
      if (state.searchResults.length) {
        state.activeSearchHitIndex=0; const hit=state.searchResults[0]; state.searchScrollHit=hit;
        doc.currentPage=hit.pageIndex; doc.selectedPages=new Set([hit.pageIndex]);
        if (countEl) countEl.textContent=`1/${state.searchResults.length}`; renderCurrentPageCanvas();
      } else if (countEl) countEl.textContent="0건";
      if (options.openSidePanel!==false) ensureLeftPanelOpen("search"); else renderLeftPane();
      showToast(`'${term}' 검색 결과: ${state.searchResults.length}건${truncated ? " (최대 5000건)" : ""}`,"fa-magnifying-glass");
    }

    function stepSearchHit(delta) {
      const doc=activeDoc(), countEl=document.getElementById("inlineSearchCount"), first=state.searchResults[0];
      if (!doc || !first || first.docId!==doc.id || first.reader!==doc.pdfJsDoc) {
        const term=document.getElementById("inlineSearchInput")?.value.trim();
        if (term) runDocumentSearch(term,{openSidePanel:false}); return;
      }
      state.activeSearchHitIndex=(state.activeSearchHitIndex+delta+state.searchResults.length)%state.searchResults.length;
      const hit=state.searchResults[state.activeSearchHitIndex]; state.searchScrollHit=hit;
      doc.currentPage=hit.pageIndex; doc.selectedPages=new Set([hit.pageIndex]);
      if (countEl) countEl.textContent=`${state.activeSearchHitIndex+1}/${state.searchResults.length}`;
      renderCurrentPageCanvas(); renderLeftPane();
      if (hit.kind==="page") showToast("이 결과는 페이지 위치만 표시됩니다.","fa-circle-info");
    }

    async function renderImageForExport(pdf, pageNumber) {
      const page = await pdf.getPage(pageNumber);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      await page.render({ canvas, canvasContext: canvas.getContext("2d"), viewport }).promise;
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      if (!blob) throw new Error("PNG 이미지를 만들지 못했습니다.");
      return new Uint8Array(await blob.arrayBuffer());
    }

    async function exportCurrentPageToPng(doc) {
      let pdf;
      try {
        const bytes = await compileDocumentWithOverlays(doc);
        pdf = await window.pdfjsLib.getDocument(pdfJsLoadOptions(bytes)).promise;
        const png = await renderImageForExport(pdf, doc.currentPage + 1);
        downloadBytes(png, `${doc.name.replace(/\.pdf$/i, "")}_page_${doc.currentPage + 1}.png`, "image/png");
        showToast(`${doc.currentPage + 1}쪽 PNG 다운로드를 시작했습니다.`, "fa-image");
      } catch (error) {
        showToast(`페이지 이미지 저장 실패: ${error.message || error}`, "fa-circle-exclamation");
      } finally {
        if (pdf) await pdf.destroy();
      }
    }

    async function exportAllPagesToImages(doc) {
      const base = doc.name.replace(/\.pdf$/i, "");
      let pdf;
      try {
        const bytes = await compileDocumentWithOverlays(doc);
        pdf = await window.pdfjsLib.getDocument(pdfJsLoadOptions(bytes)).promise;
        for (let p = 1; p <= doc.pageCount; p++) {
          const png = await renderImageForExport(pdf, p);
          downloadBytes(png, `${base}_page_${String(p).padStart(2, "0")}.png`, "image/png");
        }
        showToast(`전체 ${doc.pageCount}쪽 이미지의 다운로드를 시작했습니다.`, "fa-images");
      } catch (error) {
        showToast(`페이지 이미지 저장 실패: ${error.message || error}`, "fa-circle-exclamation");
      } finally {
        if (pdf) await pdf.destroy();
      }
    }

    function exportOverlaysToCsv(doc) {
      const rows = ["페이지,유형,내용,X좌표,Y좌표"];
      doc.overlays.forEach((o) => {
        rows.push(`${o.pageIndex + 1},"${o.type}","${(o.text || "").replace(/"/g, '""')}",${o.x},${o.y}`);
      });
      downloadBytes(new TextEncoder().encode("\uFEFF" + rows.join("\n")), `${doc.name.replace(/\.pdf$/i, "")}_comments.csv`, "text/csv;charset=utf-8");
      showToast("주석 및 삽입 항목 CSV를 저장했습니다.", "fa-file-csv");
    }

    function closeDocumentByIndex(idx) {
      if (idx < 0 || idx >= state.docs.length) return;
      const doc = state.docs[idx];
      if (state.pendingPlacement?.doc === doc) cancelPlacement();
      if (doc.operationBusy) { showToast("페이지 작업을 처리하고 있습니다. 잠시 기다려 주세요.", "fa-hourglass-half"); return; }
      if (doc.dirty && !window.confirm(`“${doc.name}”에 저장하지 않은 변경사항이 있습니다. 닫으시겠습니까?`)) return;
      if (idx === state.activeDocIndex) clearSearchResults();
      const removed = state.docs.splice(idx, 1)[0];
      if (state.docs.length === 0) {
        state.activeDocIndex = -1;
      } else if (idx < state.activeDocIndex) {
        state.activeDocIndex--;
      } else if (state.activeDocIndex >= state.docs.length) {
        state.activeDocIndex = state.docs.length - 1;
      }
      removed.pdfJsDoc?.destroy().catch((error) => console.warn("PDF cleanup failed", error));
      refreshAllViews();
      showToast(`문서를 닫았습니다: ${removed.name}`, "fa-circle-xmark");
    }

    function cancelPlacement() {
      if (!state.pendingPlacement) return;

    }
    function placePendingItem(event) {
      const pending = state.pendingPlacement, doc = activeDoc();
      if (!pending || pending.doc !== doc || doc.operationBusy) return;
      const rect = document.getElementById("pageStage").getBoundingClientRect();
      const size = doc.pageSizes[doc.currentPage] || {width:595, height:842};
      const x = Math.max(0, Math.min(size.width - 1, (event.clientX - rect.left) / doc.zoom));
      const y = Math.max(0, Math.min(size.height - 1, (event.clientY - rect.top) / doc.zoom));
      saveUndoSnapshot(doc, `${pending.title}: ${pending.text}`);
      const id = `ov_${overlayIdCounter++}`;
      doc.overlays.push({id, pageIndex:doc.currentPage, type:pending.type, text:pending.text,
        x:Math.round(x), y:Math.round(y), fontSize:pending.fontSize, color:pending.color,
        bgColor:pending.bg, opacity:pending.type === "Watermark" ? 0.35 : 0.96});
      state.selectedInsertId = id;
      cancelPlacement();
      renderOverlayItems(doc, doc.currentPage, doc.zoom);
      renderLeftPane(); updateCommandStates();
      showToast(`${pending.title} 완료`, "fa-check");
    }

    let lastPageTurnTime = 0;

    function showSwipePageBadge(text) {
      const badge = document.getElementById("swipePageIndicator");
      if (!badge) return;
      badge.textContent = text;
      badge.classList.add("visible");
      if (swipeIndicatorTimer) clearTimeout(swipeIndicatorTimer);
      swipeIndicatorTimer = setTimeout(() => {
        badge.classList.remove("visible");
      }, 1100);
    }

    async function navigatePageByDelta(delta, reason = "") {
      const doc = activeDoc();
      if (!doc || doc.pageCount <= 1) return false;
      const now = Date.now();
      if (now - lastPageTurnTime < 220) return false;

      const nextPage = doc.currentPage + delta;
      if (nextPage < 0) {
        showSwipePageBadge(`첫 페이지입니다 (1 / ${doc.pageCount})`);
        lastPageTurnTime = now;
        return false;
      }
      if (nextPage >= doc.pageCount) {
        showSwipePageBadge(`마지막 페이지입니다 (${doc.pageCount} / ${doc.pageCount})`);
        lastPageTurnTime = now;
        return false;
      }

      lastPageTurnTime = now;
      doc.currentPage = nextPage;
      doc.selectedPages = new Set([doc.currentPage]);
      const vp = document.getElementById("canvasViewport");
      if (vp) {
        vp.scrollTop = 0;
        vp.scrollLeft = 0;
      }
      await renderCurrentPageCanvas();
      await renderLeftPane();
      const dirArrow = delta > 0 ? "다음 페이지 ▶" : "◀ 이전 페이지";
      showSwipePageBadge(`${dirArrow} (${doc.currentPage + 1} / ${doc.pageCount}쪽)`);
      return true;
    }
