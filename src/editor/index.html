    // =========================================================================
    // Left Navigation Pane Content
    // =========================================================================
    let thumbDoc = null, thumbBytes = null, thumbSignature = "", thumbObserver = null;
    async function renderLeftPane() {
      renderLeftTabBar();
      const container = document.getElementById("leftPaneContent");
      const doc = activeDoc();

      if (state.leftPanels.length === 0) {
        container.innerHTML = `
          <div style="padding:18px;text-align:center;color:var(--text-muted)">
            <p style="margin-bottom:8px">열려 있는 좌측 패널이 없습니다.</p>
            <button type="button" class="compact-btn" id="emptyLeftAddBtn"><i class="fa-solid fa-plus"></i> 패널 추가</button>
          </div>
        `;
        document.getElementById("emptyLeftAddBtn")?.addEventListener("click", () => openPanelManagerModal("left"));
        return;
      }

      if (!state.leftPanels.includes(state.activeLeftTab)) {
        state.activeLeftTab = state.leftPanels[0];
      }

      if (state.activeLeftTab === "pages") {
        const signature = doc ? `${doc.pageCount}:${doc.overlays.map(x => x.pageIndex).join(",")}` : "";
        if (doc && thumbDoc === doc && thumbBytes === doc.bytes && thumbSignature === signature && container.querySelector("#thumbnailContainer")) { syncThumbnailSelection(doc); return; }
        thumbObserver?.disconnect(); thumbDoc = doc; thumbBytes = doc?.bytes; thumbSignature = signature;
        container.innerHTML = `<div id="thumbnailContainer"></div>`;
        const thumbWrap = document.getElementById("thumbnailContainer");
        if (!doc) {
          thumbWrap.innerHTML = `<div style="padding:16px;text-align:center;color:var(--text-muted)">열려 있는 PDF가 없습니다.</div>`;
          return;
        }
        thumbWrap.dataset.docId = doc.id;
        thumbObserver = new IntersectionObserver(entries => {
          for (const entry of entries) {
            if (!entry.isIntersecting || entry.target.dataset.rendered) continue;
            entry.target.dataset.rendered = "1";
            const canvas = entry.target.querySelector("canvas"), index = Number(entry.target.dataset.pageIndex);
            doc.pdfJsDoc.getPage(index + 1).then(page => {
              if (!canvas.isConnected) return;
              const vp = page.getViewport({scale: 0.22}); canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
              return page.render({canvas, canvasContext:canvas.getContext("2d"), viewport:vp}).promise;
            }).catch(error => console.warn("축소판 표시 실패", error));
            thumbObserver?.unobserve(entry.target);
          }
        }, {root:container, rootMargin:"200px"});
        for (let i = 0; i < doc.pageCount; i++) {
          const card = document.createElement("div");
          card.dataset.pageIndex = String(i);
          card.className = "thumb-card" + (doc.selectedPages.has(i) || (doc.selectedPages.size <= 1 && doc.currentPage === i) ? " selected" : "");
          const cWrap = document.createElement("div");
          cWrap.className = "thumb-canvas-wrap";
          const tCanvas = document.createElement("canvas");
          const thumbSize = doc.pageSizes[i] || {width:595,height:842};
          tCanvas.style.width = `${Math.round(thumbSize.width * 0.22)}px`;
          tCanvas.style.height = `${Math.round(thumbSize.height * 0.22)}px`;
          tCanvas.width = 1;
          tCanvas.height = 1;
          cWrap.appendChild(tCanvas);

          const lbl = document.createElement("div");
          lbl.className = "thumb-label";
          const ovCount = doc.overlays.filter((o) => o.pageIndex === i).length;
          lbl.textContent = `${i + 1}쪽` + (ovCount > 0 ? ` · 항목 ${ovCount}` : "");

          card.appendChild(cWrap);
          card.appendChild(lbl);
          card.addEventListener("click", (e) => {
            if (e.ctrlKey || e.metaKey) {
              if (doc.selectedPages.has(i) && doc.selectedPages.size > 1) {
                doc.selectedPages.delete(i);
              } else {
                doc.selectedPages.add(i);
              }
            } else if (e.shiftKey) {
              const start = Math.min(doc.currentPage, i);
              const end = Math.max(doc.currentPage, i);
              doc.selectedPages.clear();
              for (let p = start; p <= end; p++) doc.selectedPages.add(p);
            } else {
              doc.selectedPages.clear();
              doc.selectedPages.add(i);
            }
            doc.currentPage = i;
            if (isMobileViewport()) toggleLeftPane(true);
            renderCurrentPageCanvas();
            renderLeftPane();
          });
          thumbWrap.appendChild(card);

          if (doc.pdfJsDoc) thumbObserver.observe(card);
        }
        return;
      }

      if (state.activeLeftTab === "bookmarks") {
        if (!doc) {
          container.innerHTML = `<div style="padding:14px;color:var(--text-muted)">문서를 먼저 열어주세요.</div>`;
          return;
        }
        let html = `
          <div style="padding:6px;color:var(--text-muted);font-size:11px">이 표시는 현재 세션에서만 유지되며 PDF 북마크로 저장되지 않습니다.</div>
          <div style="display:flex;gap:6px;margin-bottom:8px">
            <button type="button" class="compact-btn" id="bmAddNowBtn" style="flex:1"><i class="fa-solid fa-plus"></i> 현재 쪽 임시 표시</button>
            <button type="button" class="compact-btn" id="bmAutoGenBtn"><i class="fa-solid fa-wand-magic-sparkles"></i> 전체 표시</button>
          </div>
        `;
        if (doc.bookmarks.length === 0) {
          html += `<div style="padding:12px;color:var(--text-muted)">등록된 북마크가 없습니다.</div>`;
        } else {
          doc.bookmarks.forEach((bm, idx) => {
            html += `

                <span style="font-size:11px;color:var(--text-muted)">${bm.page + 1}쪽</span>
              </div>
            `;
          });
        }
        container.innerHTML = html;
        document.getElementById("bmAddNowBtn")?.addEventListener("click", () => executeCommand("addBookmark"));
        document.getElementById("bmAutoGenBtn")?.addEventListener("click", () => executeCommand("autoBookmarks"));
        container.querySelectorAll("[data-bm-idx]").forEach((row) => {
          row.addEventListener("click", () => {
            const bm = doc.bookmarks[Number(row.dataset.bmIdx)];
            if (bm) {
              doc.currentPage = Math.max(0, Math.min(bm.page, doc.pageCount - 1));
              doc.selectedPages = new Set([doc.currentPage]);
              if (isMobileViewport()) toggleLeftPane(true);
              renderCurrentPageCanvas();
            }
          });
        });
        return;
      }

      if (state.activeLeftTab === "comments") {
        if (!doc) {
          container.innerHTML = `<div style="padding:14px;color:var(--text-muted)">문서를 먼저 열어주세요.</div>`;
          return;
        }
        let html = `
          <div style="display:flex;gap:6px;margin-bottom:8px">
            <button type="button" class="compact-btn" id="cmAddNoteBtn" style="flex:1"><i class="fa-solid fa-comment-medical"></i> 주석 추가</button>
            <button type="button" class="compact-btn" id="cmExportCsvBtn"><i class="fa-solid fa-file-csv"></i> CSV 저장</button>
          </div>
        `;
        if (doc.overlays.length === 0) {
          html += `<div style="padding:12px;color:var(--text-muted)">현재 문서에 삽입된 주석·항목이 없습니다.</div>`;
        } else {
          doc.overlays.forEach((ov) => {
            html += `
              <div class="list-row-item" data-ov-id="${ov.id}">
                <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <strong style="color:var(--primary)">[${escapeHtml(ov.type)}]</strong> ${escapeHtml(ov.text || "표 항목")}
                </div>
                <span style="font-size:11px;color:var(--text-muted);flex-shrink:0">${ov.pageIndex + 1}쪽</span>
              </div>
            `;
          });
        }
        container.innerHTML = html;
        document.getElementById("cmAddNoteBtn")?.addEventListener("click", () => executeCommand("insertNote"));
        document.getElementById("cmExportCsvBtn")?.addEventListener("click", () => exportOverlaysToCsv(doc));
        container.querySelectorAll("[data-ov-id]").forEach((row) => {
          row.addEventListener("click", () => {
            const target = doc.overlays.find((o) => o.id === row.dataset.ovId);
            if (target) {
              doc.currentPage = target.pageIndex;
              state.selectedInsertId = target.id;
              if (isMobileViewport()) toggleLeftPane(true);
              renderCurrentPageCanvas();
            }
          });

      if (state.activeLeftTab === "search") {
        let html = `
          <div style="display:flex;gap:5px;margin-bottom:8px">
            <input type="text" id="leftSearchInput" class="compact-input" placeholder="검색어 입력..." value="${escapeHtml(state.lastSearchTerm)}" />
            <button type="button" class="compact-btn" id="leftSearchRunBtn">검색</button>
          </div>
        `;
        if (state.searchResults.length === 0) {
          html += `<div style="padding:12px;color:var(--text-muted)">검색 결과가 없습니다.</div>`;
        } else {
          state.searchResults.forEach((res, idx) => {
            html += `
              <div class="list-row-item" data-search-idx="${idx}">
                <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <strong style="color:var(--primary)">${res.pageIndex + 1}쪽:</strong> ${escapeHtml(res.snippet)}
                </div>
              </div>
            `;
          });
        }
        container.innerHTML = html;
        document.getElementById("leftSearchRunBtn")?.addEventListener("click", () => {
          const val = document.getElementById("leftSearchInput")?.value || "";
          runDocumentSearch(val);
        });
        container.querySelectorAll("[data-search-idx]").forEach((row) => {
          row.addEventListener("click", () => {
            const hit = state.searchResults[Number(row.dataset.searchIdx)];
            if (hit && doc) {
              doc.currentPage = hit.pageIndex;
              doc.selectedPages = new Set([hit.pageIndex]);
              if (isMobileViewport()) toggleLeftPane(true);
              renderCurrentPageCanvas();
            }
          });
        });
        return;
      }

      if (state.activeLeftTab === "attachments") {
        if (!doc) {
          container.innerHTML = `<div style="padding:14px;color:var(--text-muted)">문서를 먼저 열어주세요.</div>`;
          return;
        }
        let html = `
          <div style="display:flex;gap:6px;margin-bottom:8px">
            <button type="button" class="compact-btn" id="attAddBtn" style="flex:1"><i class="fa-solid fa-plus"></i> 첨부 추가</button>
            <button type="button" class="compact-btn" id="attSaveAllBtn"><i class="fa-solid fa-download"></i> 일괄 저장</button>
          </div>
        `;
        if (!doc.attachmentsReadable) {
          html += `<div style="padding:12px;color:var(--text-muted)">기존 첨부파일 목록을 읽을 수 없습니다.</div>`;
        } else if (doc.attachments.length === 0) {
          html += `<div style="padding:12px;color:var(--text-muted)">등록된 첨부파일이 없습니다.</div>`;
        } else {
          doc.attachments.forEach((att, idx) => {
            html += `
              <div class="list-row-item" data-att-idx="${idx}">
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><i class="fa-solid fa-paperclip" style="color:var(--primary);margin-right:5px"></i>${escapeHtml(att.name)}</span>
                <span style="font-size:11px;color:var(--text-muted)">${(att.bytes.byteLength / 1024).toFixed(1)}KB</span>
              </div>
            `;
          });
        }
        container.innerHTML = html;
        document.getElementById("attAddBtn")?.addEventListener("click", () => executeCommand("addAttachment"));
        document.getElementById("attSaveAllBtn")?.addEventListener("click", () => executeCommand("saveAllAttachments"));
        container.querySelectorAll("[data-att-idx]").forEach((row) => {
          row.addEventListener("click", () => {
            const att = doc.attachments[Number(row.dataset.attIdx)];
            if (att) downloadBytes(att.bytes, att.name, att.type || "application/octet-stream");
          });
        });
        return;
      }

      if (state.activeLeftTab === "recent") {
        let html = ``;
        if (state.recentFiles.length === 0) {
          html = `<div style="padding:12px;color:var(--text-muted)">최근 열었던 파일이 없습니다.</div>`;
        } else {
          state.recentFiles.forEach((rf, idx) => {
            html += `
              <div class="list-row-item" data-recent-idx="${idx}">
                <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">

    // =========================================================================
    // PDF Binary Manipulation Helpers (pdf-lib + Canvas Bake)
    // =========================================================================
    async function compileDocumentWithOverlays(doc) {
      if (!window.PDFLib) throw new Error("PDF 편집 엔진을 사용할 수 없습니다.");
      if (!window.SunriseEditState || !window.SunriseKoreanFont) throw new Error("PDF 편집 구성요소를 불러오지 못했습니다.");
      const { PDFDocument, degrees, rgb } = window.PDFLib;
      const pdfDoc = await PDFDocument.load(doc.bytes);
      if (doc.metadata.title) pdfDoc.setTitle(doc.metadata.title);
      if (doc.metadata.author) pdfDoc.setAuthor(doc.metadata.author);
      if (doc.metadata.subject) pdfDoc.setSubject(doc.metadata.subject);
      if (doc.metadata.keywords) pdfDoc.setKeywords([doc.metadata.keywords]);
      for (const attachment of doc.attachments.filter((item) => item.isNew)) {
        await pdfDoc.attach(attachment.bytes, attachment.name, attachment.type ? { mimeType: attachment.type } : {});
      }

      const pages = pdfDoc.getPages();
      const textTypes = new Set(["Text", "Header", "Footer", "PageNumber"]);
      const textItems = doc.overlays.filter((item) => textTypes.has(item.type));
      const textFont = textItems.length
        ? await window.SunriseKoreanFont.embed(pdfDoc, textItems.map((item) => item.text || "")) : null;
      const pageStreams = new Map();

      for (const item of doc.overlays) {
        if (item.pageIndex < 0 || item.pageIndex >= pages.length) throw new Error("삽입 항목의 페이지 위치가 잘못되어 저장을 중단했습니다.");
        const page = pages[item.pageIndex];
        if (!pageStreams.has(item.pageIndex)) {
          const stream = page.getContentStream(false);
          pageStreams.set(item.pageIndex, { stream, ref: page.contentStreamRef });
        }

        if (textTypes.has(item.type)) {
          const fontSize = item.fontSize || 13;
          const text = String(item.text || "").normalize("NFC").replace(/\t/g, " ");
          const lineHeight = fontSize * 1.3;
          const maxWidth = item.width ? Math.max(1, item.width - 14) : Infinity;
          const lines = [];
          for (const paragraph of text.split(/\r?\n/)) {
            let line = "";
            for (const char of paragraph) {
              const candidate = line + char;
              if (line && textFont.widthOfTextAtSize(candidate, fontSize) > maxWidth) {
                lines.push(line);
                line = char;
              } else line = candidate;
            }
            lines.push(line);
          }
          const viewPage = await doc.pdfJsDoc.getPage(item.pageIndex + 1);
          const viewport = viewPage.getViewport({ scale: 1 });
          const colorValue = /^#[0-9a-f]{6}$/i.test(item.color || "") ? item.color.slice(1) : "1B2631";
          const color = rgb(parseInt(colorValue.slice(0, 2), 16) / 255,
            parseInt(colorValue.slice(2, 4), 16) / 255, parseInt(colorValue.slice(4, 6), 16) / 255);
          for (const [lineIndex, line] of lines.entries()) {
            if (!line) continue;
            const [x, y] = viewport.convertToPdfPoint(item.x + 7, item.y + 4 + fontSize * 1.05 + lineIndex * lineHeight);
            page.drawText(line, { x, y, font: textFont, size: fontSize, color,
              rotate: degrees(viewPage.rotate || 0), opacity: item.opacity ?? 1 });
          }
          continue;
        }

        const offCanvas = document.createElement("canvas");
        const octx = offCanvas.getContext("2d");
        const fontSize = item.fontSize || 13;
        const rawText = item.type === "Note" ? `💬 ${item.text || ""}` : String(item.text || "");
        const lines = rawText.split(/\r?\n/);

        octx.font = `bold ${fontSize}px "Inter", "Noto Sans KR", "Malgun Gothic", sans-serif`;
        let measuredMaxW = 40;
        lines.forEach((ln) => {
          const m = octx.measureText(ln).width;
          if (m > measuredMaxW) measuredMaxW = m;
        });

        const defaultW = item.type === "Table" ? 240 : Math.ceil(measuredMaxW + 20);
        const lineH = Math.ceil(fontSize * 1.35);
        const defaultH = item.type === "Table" ? 64 : Math.max(26, lines.length * lineH + 12);

        const w = Math.max(40, item.width || defaultW);
        const h = Math.max(22, item.height || defaultH);
        const dpr = 3;
        offCanvas.width = Math.round(w * dpr);
        offCanvas.height = Math.round(h * dpr);
        octx.scale(dpr, dpr);

        if (item.bgColor && item.bgColor !== "transparent") {
          octx.fillStyle = item.bgColor;
          octx.fillRect(0, 0, w, h);
        }

        if (item.type === "Stamp") {
          octx.strokeStyle = item.color || "#1F6F9F";
          octx.lineWidth = 2;
          octx.strokeRect(1.5, 1.5, w - 3, h - 3);
        } else if (item.type === "Note") {
          octx.fillStyle = "#E58A18";
          octx.fillRect(0, 0, 4, h);
        }

        if (item.type === "Table" && Array.isArray(item.cells) && item.cells.length > 0) {
          const rows = item.cells.length;
          const cols = Math.max(1, item.cells[0]?.length || 1);
          const cw = w / cols;
          const ch = h / rows;
          octx.font = `11.5px "Inter", "Noto Sans KR", "Malgun Gothic", sans-serif`;
          item.cells.forEach((r, ri) => {
            r.forEach((c, ci) => {
              octx.fillStyle = ri === 0 ? "#EAF2F8" : "#FFFFFF";
              octx.fillRect(ci * cw, ri * ch, cw, ch);
              octx.strokeStyle = "#263746";
              octx.lineWidth = 1;
              octx.strokeRect(ci * cw, ri * ch, cw, ch);
              octx.fillStyle = "#1B2631";
              octx.fillText(String(c), ci * cw + 5, ri * ch + ch / 2 + 4);
            });
          });
        } else {
          octx.fillStyle = item.color || "#1B2631";
          octx.font = `bold ${fontSize}px "Inter", "Noto Sans KR", "Malgun Gothic", sans-serif`;
          if (item.type === "Stamp") {
            octx.textAlign = "center";
            octx.textBaseline = "middle";
            octx.fillText(lines[0] || "", w / 2, h / 2);
          } else {
            octx.textAlign = "left";
            octx.textBaseline = "top";
            lines.forEach((ln, idx) => {
              octx.fillText(ln, item.type === "Note" ? 8 : 5, 5 + idx * lineH);
            });
          }
        }

        const pngImage = await pdfDoc.embedPng(offCanvas.toDataURL("image/png"));
        const viewPage = await doc.pdfJsDoc.getPage(item.pageIndex + 1);
        const viewport = viewPage.getViewport({ scale: 1 });
        let [x, y] = viewport.convertToPdfPoint(item.x, item.y + h);
        let angle = viewPage.rotate || 0;
        if (item.type === "Watermark") {
          angle += 24;
          const [centerX, centerY] = viewport.convertToPdfPoint(item.x + w / 2, item.y + h / 2);
          const radians = angle * Math.PI / 180;
          x = centerX - (w * Math.cos(radians) - h * Math.sin(radians)) / 2;
          y = centerY - (w * Math.sin(radians) + h * Math.cos(radians)) / 2;
        }
        page.drawImage(pngImage, {
          x, y, width: w, height: h, rotate: degrees(angle),
          opacity: item.opacity ?? 1,
        });
      }

      if (doc.overlays.length) window.SunriseEditState.record(pdfDoc, pageStreams, doc.overlays, window.PDFLib);
      return await pdfDoc.save();
    }

    // =========================================================================
    // Feature 1: PDF Merge Dialog
    // =========================================================================
    async function openMergePdfModal() {
      try {
        const queued = [];
        for (const [idx, d] of state.docs.entries()) {
          queued.push({ id: `mq_${Date.now()}_${idx}`, name: d.name,
            pages: d.pageCount, bytes: await compileDocumentWithOverlays(d) });
        }
        state.mergeQueue = queued;
      } catch (error) {
        showToast(`열린 문서를 병합 목록에 추가하지 못했습니다: ${error.message || error}`, "fa-circle-exclamation");
        return;
      }
      state.mergeSelectedIdx = state.mergeQueue.length > 0 ? 0 : -1;

      const defaultOutName =
        state.mergeQueue.length > 0
          ? state.mergeQueue[0].name.replace(/\.pdf$/i, "") + "_merged.pdf"
          : "Sunrise_merged.pdf";

      openModal({
        title: "PDF 병합",
        icon: "fa-object-group",
        width: "720px",
        bodyHtml: `
          <div class="dialog-info-box">
            병합할 PDF를 2개 이상 추가하거나 이 창으로 파일을 드래그하세요. 페이지와 삽입한 표시가 합쳐집니다. 원본의 문서 수준 북마크와 첨부파일은 병합 결과에 포함되지 않습니다.
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px">
            <strong id="mergeSummaryLabel" style="color:var(--primary);font-size:13px">병합 대상: 0개 파일 (총 0쪽)</strong>
            <span style="font-size:11.5px;color:var(--text-muted)">원본 파일은 변경되지 않으며 새 PDF로 병합됩니다.</span>
          </div>
          <div class="merge-layout">
            <div class="merge-file-list" id="mergeFileListBox"></div>
            <div class="merge-btn-col" style="display:flex;flex-direction:column;gap:5px">
              <button type="button" class="dialog-btn primary" id="mergeAddFilesBtn"><i class="fa-solid fa-plus"></i> 파일 추가</button>
              <button type="button" class="dialog-btn" id="mergeAddOpenDocsBtn"><i class="fa-solid fa-book-open"></i> 열린 문서 추가</button>
              <button type="button" class="dialog-btn" id="mergeMoveUpBtn"><i class="fa-solid fa-arrow-up"></i> 위로</button>
              <button type="button" class="dialog-btn" id="mergeMoveDownBtn"><i class="fa-solid fa-arrow-down"></i> 아래로</button>
              <button type="button" class="dialog-btn" id="mergeSortNameBtn"><i class="fa-solid fa-arrow-down-a-z"></i> 이름순 정렬</button>
              <button type="button" class="dialog-btn" id="mergeDuplicateItemBtn"><i class="fa-solid fa-clone"></i> 선택 복제</button>
              <button type="button" class="dialog-btn" id="mergeRemoveBtn"><i class="fa-solid fa-trash"></i> 선택 제거</button>
              <button type="button" class="dialog-btn" id="mergeClearBtn">전체 비우기</button>
            </div>
          </div>
          <div class="dialog-form-grid" style="margin-top:4px">
            <label for="mergeOutputNameInput">결과 파일명:</label>
            <input type="text" id="mergeOutputNameInput" class="dialog-input" value="${escapeHtml(defaultOutName)}" placeholder="병합 결과 PDF 파일명 (.pdf)" />
          </div>
        `,
        footerHtml: `
          <div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px">
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
              <input type="checkbox" id="mergeOpenAfterCheck" checked />
              <span>병합 완료 후 편집기 탭에서 바로 열기</span>
            </label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
              <input type="checkbox" id="mergeDownloadCheck" checked />
              <span>내 기기로 즉시 다운로드</span>
            </label>
          </div>
          <div class="modal-footer-right">
            <button type="button" class="dialog-btn primary" id="mergeExecuteBtn"><i class="fa-solid fa-object-group"></i> 병합 실행</button>
            <button type="button" class="dialog-btn" id="mergeCancelBtn">취소</button>
          </div>
        `,
        onMount: () => {
          renderMergeQueueList();

          document.getElementById("mergeAddFilesBtn").addEventListener("click", () => {
            document.getElementById("mergePdfInput").click();
          });

          document.getElementById("mergeAddOpenDocsBtn").addEventListener("click", async () => {
            if (state.docs.length === 0) {
              showToast("현재 열려 있는 문서가 없습니다.", "fa-circle-info");
              return;
            }
            try {
              const queued = [];
              for (const [idx, d] of state.docs.entries()) {
                queued.push({ id: `mq_${Date.now()}_open_${idx}`, name: d.name,
                  pages: d.pageCount, bytes: await compileDocumentWithOverlays(d) });
              }
              state.mergeQueue.push(...queued);
              state.mergeSelectedIdx = state.mergeQueue.length - 1;
              renderMergeQueueList();
            } catch (error) {
              showToast(`열린 문서를 병합 목록에 추가하지 못했습니다: ${error.message || error}`, "fa-circle-exclamation");
            }
          });

          document.getElementById("mergeMoveUpBtn").addEventListener("click", () => {
            const idx = state.mergeSelectedIdx;
            if (idx > 0 && idx < state.mergeQueue.length) {
              const tmp = state.mergeQueue[idx - 1];
              state.mergeQueue[idx - 1] = state.mergeQueue[idx];
              state.mergeQueue[idx] = tmp;
              state.mergeSelectedIdx = idx - 1;
              renderMergeQueueList();
            }
          });

          document.getElementById("mergeMoveDownBtn").addEventListener("click", () => {
            const idx = state.mergeSelectedIdx;
            if (idx >= 0 && idx < state.mergeQueue.length - 1) {
              const tmp = state.mergeQueue[idx + 1];
              state.mergeQueue[idx + 1] = state.mergeQueue[idx];
              state.mergeQueue[idx] = tmp;
              state.mergeSelectedIdx = idx + 1;
              renderMergeQueueList();
            }
          });

          document.getElementById("mergeSortNameBtn").addEventListener("click", () => {
            state.mergeQueue.sort((a, b) => a.name.localeCompare(b.name, "ko"));
            renderMergeQueueList();
          });

          document.getElementById("mergeDuplicateItemBtn").addEventListener("click", () => {
            const idx = state.mergeSelectedIdx;
            if (idx >= 0 && idx < state.mergeQueue.length) {
              const src = state.mergeQueue[idx];
              state.mergeQueue.splice(idx + 1, 0, {
                id: `mq_${Date.now()}_dup`,
                name: src.name,
                pages: src.pages,
                bytes: src.bytes.slice(0),
              });
              state.mergeSelectedIdx = idx + 1;
              renderMergeQueueList();
            }
          });

          document.getElementById("mergeRemoveBtn").addEventListener("click", () => {
            const idx = state.mergeSelectedIdx;
            if (idx >= 0 && idx < state.mergeQueue.length) {
              state.mergeQueue.splice(idx, 1);
              state.mergeSelectedIdx = Math.min(idx, state.mergeQueue.length - 1);
              renderMergeQueueList();
            }
          });

          document.getElementById("mergeClearBtn").addEventListener("click", () => {
            state.mergeQueue = [];
            state.mergeSelectedIdx = -1;
            renderMergeQueueList();
          });

          const listBox = document.getElementById("mergeFileListBox");
          listBox.addEventListener("dragover", (e) => {
            e.preventDefault();
          });
          listBox.addEventListener("drop", async (e) => {
            e.preventDefault();
            if (e.dataTransfer?.files?.length) {
              await addFilesToMergeQueue(e.dataTransfer.files);
            }
          });

          document.getElementById("mergeCancelBtn").addEventListener("click", closeModal);
          document.getElementById("mergeExecuteBtn").addEventListener("click", executePdfMergeFromModal);
        },
      });
    }

    function renderMergeQueueList() {
      const box = document.getElementById("mergeFileListBox");
      const summary = document.getElementById("mergeSummaryLabel");
      if (!box || !summary) return;

      const totalPages = state.mergeQueue.reduce((acc, item) => acc + (item.pages || 0), 0);
      summary.textContent = `병합 대상: ${state.mergeQueue.length}개 파일 (총 ${totalPages}쪽)`;

      if (state.mergeQueue.length === 0) {
        box.innerHTML = `
          <div style="margin:auto;text-align:center;padding:30px;color:var(--text-muted)">
            <i class="fa-solid fa-file-circle-plus" style="font-size:26px;margin-bottom:8px;color:var(--primary)"></i>
            <div><strong>[파일 추가]</strong> 또는 <strong>[열린 문서 추가]</strong>를 누르거나<br/>PDF 파일을 이곳으로 드래그하세요.</div>
          </div>
        `;
        return;
      }

      box.innerHTML = "";
      let dragSrcIndex = null;

      state.mergeQueue.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "merge-item" + (idx === state.mergeSelectedIdx ? " selected" : "");
        row.draggable = true;
        row.innerHTML = `
          <span style="display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden">
            <i class="fa-solid fa-grip-vertical" style="color:var(--text-muted)"></i>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${String(idx + 1).padStart(2, "0")}. ${escapeHtml(item.name)}</span>
          </span>
          <span style="font-size:11.5px;color:var(--primary);font-weight:700;flex-shrink:0">${item.pages}쪽</span>
        `;
        row.addEventListener("click", () => {
          state.mergeSelectedIdx = idx;
          renderMergeQueueList();
        });
        row.addEventListener("dragstart", (e) => {
          dragSrcIndex = idx;
          e.dataTransfer.effectAllowed = "move";
        });
        row.addEventListener("dragover", (e) => {
          e.preventDefault();
          row.classList.add("drag-over");
        });
        row.addEventListener("dragleave", () => {
          row.classList.remove("drag-over");
        });
        row.addEventListener("drop", (e) => {
          e.preventDefault();
          row.classList.remove("drag-over");
          if (dragSrcIndex !== null && dragSrcIndex !== idx) {
            const moved = state.mergeQueue.splice(dragSrcIndex, 1)[0];
            state.mergeQueue.splice(idx, 0, moved);
            state.mergeSelectedIdx = idx;
            renderMergeQueueList();
          }
        });
        box.appendChild(row);
      });
    }

    async function addFilesToMergeQueue(fileList) {
      for (const file of Array.from(fileList)) {
        if (!file.name.toLowerCase().endsWith(".pdf")) continue;
        try {
          if (file.size > 50 * 1024 * 1024) throw new Error("50MB 이하 PDF를 선택해 주세요.");
          const bytes = new Uint8Array(await file.arrayBuffer());
          const info = await parsePageCountAndMeta(bytes);
          state.mergeQueue.push({ id: `mq_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            name: file.name, pages: info.pageCount, bytes });
          await info.pdfJsDoc.destroy();
        } catch (error) {
          showToast(`${file.name}: ${error.message || error}`, "fa-circle-exclamation");
        }
      }
      if (state.mergeSelectedIdx < 0 && state.mergeQueue.length > 0) {
        state.mergeSelectedIdx = 0;
      }
      renderMergeQueueList();
    }

    async function executePdfMergeFromModal() {
      if (state.mergeQueue.length < 2) {
        showToast("병합할 PDF를 2개 이상 목록에 추가하세요.", "fa-triangle-exclamation");
        return;
      }
      const outInput = document.getElementById("mergeOutputNameInput");
      let outName = (outInput?.value || "merged.pdf").trim();
      if (!outName.toLowerCase().endsWith(".pdf")) outName += ".pdf";

      const openAfter = Boolean(document.getElementById("mergeOpenAfterCheck")?.checked);
      const downloadNow = Boolean(document.getElementById("mergeDownloadCheck")?.checked);

      try {
        const { PDFDocument } = window.PDFLib;
        const mergedPdf = await PDFDocument.create();
        let totalMergedPages = 0;

        for (const item of state.mergeQueue) {
          const srcPdf = await PDFDocument.load(item.bytes);
          const indices = srcPdf.getPageIndices();
          const copiedPages = await mergedPdf.copyPages(srcPdf, indices);
          copiedPages.forEach((p) => mergedPdf.addPage(p));
          totalMergedPages += copiedPages.length;
        }

        const mergedBytes = await mergedPdf.save();
        closeModal();

        if (openAfter) {
          await openPdfFromBytes(outName, mergedBytes, { switchActive: true });
        }
        if (downloadNow) {
          downloadBytes(mergedBytes, outName);
        }
        showToast(`PDF 병합 완료: ${outName} (${state.mergeQueue.length}개 문서, 총 ${totalMergedPages}쪽)`, "fa-object-group");
      } catch (err) {
        showToast(`PDF 병합 중 오류 발생: ${err.message || err}`, "fa-circle-exclamation");
      }
    }

    // =========================================================================
    // Page & Content Operation Implementations
    // =========================================================================
    // Each entry maps a resulting page to its original page, or null for a new page.
    function remapPageItems(doc, newToOld) {
      const overlays = doc.overlays;
      const bookmarks = doc.bookmarks;
      const seen = new Set();
      const newOverlays = [];
      const newBookmarks = [];
      newToOld.forEach((oldIndex, pageIndex) => {
        if (oldIndex === null) return;
        const duplicate = seen.has(oldIndex);
        seen.add(oldIndex);
        overlays.filter((item) => item.pageIndex === oldIndex).forEach((item) => {
          const copy = JSON.parse(JSON.stringify(item));
          copy.pageIndex = pageIndex;
          if (duplicate) copy.id = `ov_${overlayIdCounter++}`;
          newOverlays.push(copy);
        });
        bookmarks.filter((item) => item.page === oldIndex).forEach((item) => {
          newBookmarks.push({ ...item, page: pageIndex,
            id: duplicate ? `bm_${Date.now()}_${pageIndex}_${newBookmarks.length}` : item.id });
        });
      });
      doc.overlays = newOverlays;
      doc.bookmarks = newBookmarks;
    }

    function insertedPageMap(pageCount, insertAt, count) {
      const original = Array.from({ length: pageCount }, (_, index) => index);
      original.splice(insertAt, 0, ...Array(count).fill(null));
      return original;
    }

    function openInsertBlankPageModal(doc) {
      openModal({
        title: "빈 페이지 삽입",
        icon: "fa-file-circle-plus",
        width: "440px",
        bodyHtml: `
          <div class="dialog-form-grid">
            <label for="blankPosSelect">삽입 위치:</label>
            <select id="blankPosSelect" class="dialog-select">
              <option value="after">현재 페이지 뒤 (${doc.currentPage + 1}쪽 뒤)</option>
              <option value="before">현재 페이지 앞 (${doc.currentPage + 1}쪽 앞)</option>
              <option value="end">문서 맨 끝</option>
              <option value="start">문서 맨 앞</option>
            </select>
            <label for="blankSizeSelect">용지 크기:</label>
            <select id="blankSizeSelect" class="dialog-select">
              <option value="a4p">A4 세로 (595 × 842 pt)</option>
              <option value="a4l">A4 가로 (842 × 595 pt)</option>
            </select>
            <label for="blankCountInput">추가 장수:</label>
            <input type="number" id="blankCountInput" class="dialog-input" min="1" max="20" value="1" />
          </div>
        `,
        footerHtml: `
          <div></div>
          <div class="modal-footer-right">
            <button type="button" class="dialog-btn primary" id="blankInsertConfirmBtn">삽입</button>
            <button type="button" class="dialog-btn" id="blankInsertCancelBtn">취소</button>
          </div>
        `,
        onMount: () => {
          document.getElementById("blankInsertCancelBtn").addEventListener("click", closeModal);
          document.getElementById("blankInsertConfirmBtn").addEventListener("click", async () => {
            const posMode = document.getElementById("blankPosSelect").value;
            const sizeMode = document.getElementById("blankSizeSelect").value;
            const count = Math.max(1, Math.min(20, Number(document.getElementById("blankCountInput").value) || 1));
            saveUndoSnapshot(doc, `빈 페이지 ${count}장 삽입`);

            const { PDFDocument } = window.PDFLib;
            const pdfDoc = await PDFDocument.load(doc.bytes);
            const dims = sizeMode === "a4l" ? [841.89, 595.28] : [595.28, 841.89];
            let targetIdx = doc.currentPage + 1;
            if (posMode === "before") targetIdx = doc.currentPage;
            else if (posMode === "start") targetIdx = 0;
            else if (posMode === "end") targetIdx = doc.pageCount;

            for (let c = 0; c < count; c++) {
              pdfDoc.insertPage(targetIdx + c, dims);
            }
            doc.overlays.forEach((ov) => {
              if (ov.pageIndex >= targetIdx) ov.pageIndex += count;
            });
            doc.bookmarks.forEach((bm) => {
              if (bm.page >= targetIdx) bm.page += count;
            });
            doc.bytes = await pdfDoc.save();
            await reloadDocPdfJs(doc);
            doc.currentPage = Math.min(targetIdx, doc.pageCount - 1);
            doc.selectedPages = new Set([doc.currentPage]);
            closeModal();
            await refreshAllViews();
            showToast(`빈 페이지 ${count}장을 삽입했습니다.`, "fa-file-circle-plus");
          });
        },
      });
    }

    async function duplicateSelectedPages(doc) {
      const indices = Array.from(doc.selectedPages).sort((a, b) => a - b);
      if (indices.length === 0) indices.push(doc.currentPage);
      saveUndoSnapshot(doc, `선택 페이지 ${indices.length}장 복제`);

      const { PDFDocument } = window.PDFLib;
      const pdfDoc = await PDFDocument.load(doc.bytes);
      const copied = await pdfDoc.copyPages(pdfDoc, indices);
      const insertAt = Math.max(...indices) + 1;
      copied.forEach((p, offset) => pdfDoc.insertPage(insertAt + offset, p));
      const updatedBytes = await pdfDoc.save();
      const pageMap = Array.from({ length: doc.pageCount }, (_, index) => index);
      pageMap.splice(insertAt, 0, ...indices);
      remapPageItems(doc, pageMap);
      doc.bytes = updatedBytes;
      await reloadDocPdfJs(doc);
      doc.currentPage = Math.min(insertAt, doc.pageCount - 1);
      doc.selectedPages = new Set([doc.currentPage]);
      await refreshAllViews();
      showToast(`선택한 ${indices.length}개 페이지를 복제했습니다.`, "fa-clone");
    }

    async function copySelectedPagesToClipboard(doc, isCut = false) {
      const indices = Array.from(doc.selectedPages).sort((a, b) => a - b);
      if (indices.length === 0) indices.push(doc.currentPage);
      if (isCut && indices.length >= doc.pageCount) {
        showToast("문서의 모든 페이지를 잘라낼 수 없습니다 (최소 1쪽 유지).", "fa-triangle-exclamation");
        return;
      }

      const { PDFDocument } = window.PDFLib;
      const srcDoc = await PDFDocument.load(doc.bytes);
      const clipDoc = await PDFDocument.create();
      const copied = await clipDoc.copyPages(srcDoc, indices);
      copied.forEach((p) => clipDoc.addPage(p));
      const clipBytes = await clipDoc.save();

      state.pageClipboard = {
        sourceName: doc.name,
        count: indices.length,
        bytes: clipBytes,
        overlays: doc.overlays.filter((item) => indices.includes(item.pageIndex)).map((item) => ({
          ...JSON.parse(JSON.stringify(item)), pageIndex: indices.indexOf(item.pageIndex),
        })),
      };

      if (isCut) {
        saveUndoSnapshot(doc, `페이지 잘라내기 (${indices.length}쪽)`);
        for (const pageIdx of indices.slice().reverse()) {
          srcDoc.removePage(pageIdx);
        }
        const updatedBytes = await srcDoc.save();
        remapPageItems(doc, Array.from({ length: doc.pageCount }, (_, index) => index).filter((index) => !indices.includes(index)));
        doc.bytes = updatedBytes;
        await reloadDocPdfJs(doc);
        await refreshAllViews();
        showToast(`${indices.length}개 페이지를 클립보드로 잘라냈습니다.`, "fa-scissors");
      } else {
        showToast(`${indices.length}개 페이지를 클립보드에 복사했습니다.`, "fa-copy");
      }
    }

    function parseRangeInput(str, maxPages) {
      const result = new Set();
      String(str || "")
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean)
        .forEach((part) => {
          if (part.includes("-")) {
            const [a, b] = part.split("-").map((n) => parseInt(n.trim(), 10));
            if (!isNaN(a) && !isNaN(b)) {
              for (let p = Math.min(a, b); p <= Math.max(a, b); p++) {
                if (p >= 1 && p <= maxPages) result.add(p - 1);
              }
            }
          } else {
            const p = parseInt(part, 10);
            if (!isNaN(p) && p >= 1 && p <= maxPages) result.add(p - 1);
          }
        });
      return Array.from(result).sort((a, b) => a - b);
    }

    async function splitDocumentPages(doc) {
      const { PDFDocument } = window.PDFLib;
      const srcDoc = await PDFDocument.load(await compileDocumentWithOverlays(doc));
      const stem = doc.name.replace(/\.pdf$/i, "");
      for (let i = 0; i < doc.pageCount; i++) {
        const single = await PDFDocument.create();
        const [copied] = await single.copyPages(srcDoc, [i]);
        single.addPage(copied);
        const bytes = await single.save();
        downloadBytes(bytes, `${stem}_page_${String(i + 1).padStart(2, "0")}.pdf`);
      }
      showToast(`전체 ${doc.pageCount}쪽을 개별 PDF 파일로 분할 다운로드했습니다.`, "fa-table-columns");
    }

    async function deleteSelectedPagesFromDoc(doc) {
      const indices = Array.from(doc.selectedPages).sort((a, b) => a - b);
      if (indices.length === 0) indices.push(doc.currentPage);
      if (indices.length >= doc.pageCount) {
        showToast("문서의 모든 페이지를 삭제할 수 없습니다 (최소 1쪽 유지).", "fa-triangle-exclamation");
        return;
      }
      saveUndoSnapshot(doc, `선택 페이지 ${indices.length}장 삭제`);
      const { PDFDocument } = window.PDFLib;
      const pdfDoc = await PDFDocument.load(doc.bytes);
      const delSet = new Set(indices);
      for (const idx of indices.slice().reverse()) {
        pdfDoc.removePage(idx);
      }
      doc.overlays = doc.overlays
        .filter((ov) => !delSet.has(ov.pageIndex))
        .map((ov) => {
          const shift = indices.filter((dIdx) => dIdx < ov.pageIndex).length;
          return { ...ov, pageIndex: ov.pageIndex - shift };
        });
      doc.bookmarks = doc.bookmarks
        .filter((bm) => !delSet.has(bm.page))
        .map((bm) => {
          const shift = indices.filter((dIdx) => dIdx < bm.page).length;
          return { ...bm, page: bm.page - shift };
        });
      doc.bytes = await pdfDoc.save();
      await reloadDocPdfJs(doc);
      await refreshAllViews();
      showToast(`선택한 ${indices.length}개 페이지를 삭제했습니다.`, "fa-trash-can");
    }

            closeModal();

          });

    }

    async function rotateSelectedPages(doc, deltaDegrees) {
      if (doc.operationBusy) return;
      const indices = Array.from(doc.selectedPages).sort((a, b) => a - b);
      if (indices.length === 0) indices.push(doc.currentPage);
      if (doc.overlays.some(item => indices.includes(item.pageIndex))) {
        showToast("삽입 항목이 있는 페이지는 먼저 저장 후 다시 열어 회전해 주세요.", "fa-triangle-exclamation");
        return;
      }
      doc.operationBusy = true;
      const anchorPage = doc.currentPage;
      try {
        const { PDFDocument, degrees } = window.PDFLib;
        const pdfDoc = await PDFDocument.load(doc.bytes);
        indices.forEach(idx => {
          const page = pdfDoc.getPage(idx);
          page.setRotation(degrees(((page.getRotation().angle || 0) + deltaDegrees + 360) % 360));
        });
        const nextBytes = await pdfDoc.save();
        const info = await parsePageCountAndMeta(nextBytes);
        saveUndoSnapshot(doc, `페이지 회전 (${deltaDegrees > 0 ? "시계" : "반시계"} 90°)`);
        doc.bytes = nextBytes;
        await reloadDocPdfJs(doc, {info, selection: indices});
        doc.currentPage = anchorPage;
        doc.scrollSyncSuspended = true;
        await refreshAllViews();
        if (activeDoc() === doc) {
          const slot = document.querySelector(`#pagesFlow [data-page-index="${anchorPage}"]`);
          slot?.scrollIntoView({block: "start", inline: "nearest"});
          updateCommandStates(); syncThumbnailSelection(doc);
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }
        showToast(`${indices.length}개 페이지를 회전했습니다.`, deltaDegrees > 0 ? "fa-rotate-right" : "fa-rotate-left");
      } catch (error) {
        console.error("페이지 회전 실패", error);
        showToast(`페이지 회전에 실패했습니다: ${error.message || error}`, "fa-circle-exclamation");
      } finally { doc.scrollSyncSuspended = false; doc.operationBusy = false; }
    }

    async function runDocumentSearch(term, options = {}) {
      const doc = activeDoc();
      const countEl = document.getElementById("inlineSearchCount");
      const inlineInput = document.getElementById("inlineSearchInput");
      if (!doc || !term) {
        state.searchResults = [];
        state.activeSearchHitIndex = -1;
        if (countEl) countEl.textContent = "-";
        return;
      }
      state.lastSearchTerm = term;
      if (inlineInput && inlineInput.value !== term) inlineInput.value = term;
      state.searchResults = [];
      if (countEl) countEl.textContent = "검색 중";
      const ready = await ensurePageTexts(doc);
      if (!ready || activeDoc() !== doc || state.lastSearchTerm !== term) return;
      const caseSensitive = Boolean(options.caseSensitive);
      const needle = caseSensitive ? term : term.toLowerCase();

      for (let i = 0; i < doc.pageCount; i++) {
        const baseText = doc.pageTexts[i] || "";
        const ovText = doc.overlays
          .filter((o) => o.pageIndex === i)
          .map((o) => o.text)
          .join(" ");
        const combined = `${baseText} ${ovText}`.trim();
        const haystack = caseSensitive ? combined : combined.toLowerCase();
        const pos = haystack.indexOf(needle);
        if (pos !== -1) {
          const start = Math.max(0, pos - 20);
          state.searchResults.push({
            pageIndex: i,
            snippet: combined.slice(start, start + 90),
          });
        }
      }

      if (state.searchResults.length > 0) {
        state.activeSearchHitIndex = 0;
        const firstHit = state.searchResults[0];
        doc.currentPage = firstHit.pageIndex;
        doc.selectedPages = new Set([firstHit.pageIndex]);
        if (countEl) countEl.textContent = `1/${state.searchResults.length}`;
        renderCurrentPageCanvas();
      } else {
        state.activeSearchHitIndex = -1;
        if (countEl) countEl.textContent = "0건";
      }

      if (options.openSidePanel !== false) {
        ensureLeftPanelOpen("search");
      } else {
        renderLeftPane();
      }
      showToast(`'${term}' 검색 결과: ${state.searchResults.length}건`, "fa-magnifying-glass");
    }

    function stepSearchHit(delta) {
      const doc = activeDoc();
      const countEl = document.getElementById("inlineSearchCount");
      if (!doc || state.searchResults.length === 0) {
        const inlineTerm = document.getElementById("inlineSearchInput")?.value.trim();
        if (inlineTerm) {
          runDocumentSearch(inlineTerm, { openSidePanel: false });
        }
        return;
      }
      state.activeSearchHitIndex =
        (state.activeSearchHitIndex + delta + state.searchResults.length) % state.searchResults.length;
      const hit = state.searchResults[state.activeSearchHitIndex];
      if (hit) {
        doc.currentPage = hit.pageIndex;
        doc.selectedPages = new Set([hit.pageIndex]);
        if (countEl) countEl.textContent = `${state.activeSearchHitIndex + 1}/${state.searchResults.length}`;
        renderCurrentPageCanvas();
        renderLeftPane();
      }
    }

    async function renderImageForExport(pdf, pageNumber) {
      const page = await pdf.getPage(pageNumber);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      await page.render({ canvas, canvasContext: canvas.getContext("2d"), viewport }).promise;
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      if (!blob) throw new Error("PNG 이미지를 만들지 못했습니다.");
      return new Uint8Array(await blob.arrayBuffer());
    }

    async function exportCurrentPageToPng(doc) {
      let pdf;
      try {
        const bytes = await compileDocumentWithOverlays(doc);
        pdf = await window.pdfjsLib.getDocument(pdfJsLoadOptions(bytes)).promise;
        const png = await renderImageForExport(pdf, doc.currentPage + 1);
        downloadBytes(png, `${doc.name.replace(/\.pdf$/i, "")}_page_${doc.currentPage + 1}.png`, "image/png");
        showToast(`${doc.currentPage + 1}쪽 PNG 다운로드를 시작했습니다.`, "fa-image");
      } catch (error) {
        showToast(`페이지 이미지 저장 실패: ${error.message || error}`, "fa-circle-exclamation");
      } finally {
        if (pdf) await pdf.destroy();
      }
    }

    async function exportAllPagesToImages(doc) {
      const base = doc.name.replace(/\.pdf$/i, "");
      let pdf;
      try {
        const bytes = await compileDocumentWithOverlays(doc);
        pdf = await window.pdfjsLib.getDocument(pdfJsLoadOptions(bytes)).promise;
        for (let p = 1; p <= doc.pageCount; p++) {
          const png = await renderImageForExport(pdf, p);
          downloadBytes(png, `${base}_page_${String(p).padStart(2, "0")}.png`, "image/png");
        }
        showToast(`전체 ${doc.pageCount}쪽 이미지의 다운로드를 시작했습니다.`, "fa-images");
      } catch (error) {
        showToast(`페이지 이미지 저장 실패: ${error.message || error}`, "fa-circle-exclamation");
      } finally {
        if (pdf) await pdf.destroy();
      }
    }

        },
      });
    }

    function closeDocumentByIndex(idx) {
      if (idx < 0 || idx >= state.docs.length) return;
      const doc = state.docs[idx];
      if (state.pendingPlacement?.doc === doc) cancelPlacement();
      if (doc.operationBusy) { showToast("페이지 작업을 처리하고 있습니다. 잠시 기다려 주세요.", "fa-hourglass-half"); return; }
      if (doc.dirty && !window.confirm(`“${doc.name}”에 저장하지 않은 변경사항이 있습니다. 닫으시겠습니까?`)) return;
      const removed = state.docs.splice(idx, 1)[0];
      if (state.docs.length === 0) {
        state.activeDocIndex = -1;
      } else if (idx < state.activeDocIndex) {
        state.activeDocIndex--;
      } else if (state.activeDocIndex >= state.docs.length) {
        state.activeDocIndex = state.docs.length - 1;
      }
      removed.pdfJsDoc?.destroy().catch((error) => console.warn("PDF cleanup failed", error));
      refreshAllViews();
      showToast(`문서를 닫았습니다: ${removed.name}`, "fa-circle-xmark");
    }

    // =========================================================================
    // Theme & Ribbon Visibility Controls
    // =========================================================================
    function applyThemeMode(mode) {
      state.theme = mode === "dark" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", state.theme);
      const isDark = state.theme === "dark";
      document.getElementById("themeToggleIcon").className = isDark ? "fa-solid fa-moon" : "fa-solid fa-sun";
      document.getElementById("themeToggleLabel").textContent = isDark ? "다크 모드" : "라이트 모드";
      try {
        localStorage.setItem("sunrise_pdf_web_theme", state.theme);
      } catch (_e) {}
    }

    function toggleThemeMode() {
      applyThemeMode(state.theme === "light" ? "dark" : "light");
      showToast(`${state.theme === "dark" ? "다크 모드" : "라이트 모드"}로 전환했습니다.`, "fa-circle-half-stroke");
    }

    function toggleRibbonVisibility(forceState) {
      state.ribbonVisible = typeof forceState === "boolean" ? forceState : !state.ribbonVisible;
      const ribbon = document.getElementById("mainRibbon");
      const icon = document.getElementById("ribbonToggleIcon");
      const label = document.getElementById("ribbonToggleLabel");
      const restoreBtn = document.getElementById("ribbonRestoreBtn");
      const mobRibbonBtn = document.getElementById("mobRibbonBtn");

      ribbon.classList.toggle("hidden", !state.ribbonVisible);
      icon.className = state.ribbonVisible ? "fa-solid fa-chevron-up" : "fa-solid fa-chevron-down";
      label.textContent = state.ribbonVisible ? "리본 숨기기" : "리본 표시";
      restoreBtn.style.display = state.ribbonVisible ? "none" : "inline-flex";
      if (mobRibbonBtn) mobRibbonBtn.classList.toggle("active", state.ribbonVisible);
      renderCurrentPageCanvas();
    }

    function cancelPlacement() {
      if (!state.pendingPlacement) return;
      state.pendingPlacement = null;
      document.getElementById("placementHint").style.display = "none";
      document.getElementById("pageStage").classList.remove("placement-mode");
    }
    function placePendingItem(event) {
      const pending = state.pendingPlacement, doc = activeDoc();
      if (!pending || pending.doc !== doc || doc.operationBusy) return;
      const rect = document.getElementById("pageStage").getBoundingClientRect();
      const size = doc.pageSizes[doc.currentPage] || {width:595, height:842};
      const x = Math.max(0, Math.min(size.width - 1, (event.clientX - rect.left) / doc.zoom));
      const y = Math.max(0, Math.min(size.height - 1, (event.clientY - rect.top) / doc.zoom));
      saveUndoSnapshot(doc, `${pending.title}: ${pending.text}`);
      const id = `ov_${overlayIdCounter++}`;
      doc.overlays.push({id, pageIndex:doc.currentPage, type:pending.type, text:pending.text,
        x:Math.round(x), y:Math.round(y), fontSize:pending.fontSize, color:pending.color,
        bgColor:pending.bg, opacity:pending.type === "Watermark" ? 0.35 : 0.96});
      state.selectedInsertId = id;
      cancelPlacement();
      renderOverlayItems(doc, doc.currentPage, doc.zoom);
      renderLeftPane(); updateCommandStates();
      showToast(`${pending.title} 완료`, "fa-check");
    }

    // =========================================================================
    // Event Listeners & File Input Wiring
    // =========================================================================
    let lastPageTurnTime = 0;
    let swipeIndicatorTimer = null;

    function showSwipePageBadge(text) {
      const badge = document.getElementById("swipePageIndicator");
      if (!badge) return;
      badge.textContent = text;
      badge.classList.add("visible");
      if (swipeIndicatorTimer) clearTimeout(swipeIndicatorTimer);
      swipeIndicatorTimer = setTimeout(() => {
        badge.classList.remove("visible");
      }, 1100);
    }

    async function navigatePageByDelta(delta, reason = "") {
      const doc = activeDoc();
      if (!doc || doc.pageCount <= 1) return false;
      const now = Date.now();
      if (now - lastPageTurnTime < 220) return false;

      const nextPage = doc.currentPage + delta;
      if (nextPage < 0) {
        showSwipePageBadge(`첫 페이지입니다 (1 / ${doc.pageCount})`);
        lastPageTurnTime = now;
        return false;
      }
      if (nextPage >= doc.pageCount) {
        showSwipePageBadge(`마지막 페이지입니다 (${doc.pageCount} / ${doc.pageCount})`);
        lastPageTurnTime = now;
        return false;
      }

      lastPageTurnTime = now;
      doc.currentPage = nextPage;
      doc.selectedPages = new Set([doc.currentPage]);
      const vp = document.getElementById("canvasViewport");
      if (vp) {
        vp.scrollTop = 0;
        vp.scrollLeft = 0;
      }
      await renderCurrentPageCanvas();
      await renderLeftPane();
      const dirArrow = delta > 0 ? "다음 페이지 ▶" : "◀ 이전 페이지";
      showSwipePageBadge(`${dirArrow} (${doc.currentPage + 1} / ${doc.pageCount}쪽)`);
      return true;
    }

          renderLeftPane();

            stepSearchHit(e.shiftKey ? -1 : 1);

          }

      });

      document.getElementById("inlineSearchNextBtn").addEventListener("click", () => stepSearchHit(1));

      document.getElementById("emptyNewBlankBtn").addEventListener("click", createNewBlankDocument);
      document.getElementById("emptyMergePdfBtn").addEventListener("click", () => openMergePdfModal());
      document.getElementById("emptyLoadSampleBtn").addEventListener("click", initSampleDocuments);
      document.getElementById("bottomPanelResetBtn").addEventListener("click", resetPanelsToDefault);
      const slider = document.getElementById("zoomSlider");
      let zoomTimer = null;
      slider.addEventListener("input", () => {
        clearTimeout(zoomTimer);
        const doc = activeDoc();
        if (!doc) return;
        const pct = Number(slider.value);
        zoomTimer = setTimeout(() => {
          if (activeDoc() !== doc) return;
          doc.fitMode = "custom"; doc.zoom = Math.max(0.25, Math.min(4, pct / 100));
          renderCurrentPageCanvas();
        }, 120);
      });

      // Context Tool Palette buttons
      document.getElementById("ctxEditItemBtn").addEventListener("click", openEditInsertItemModal);
      document.getElementById("ctxDupItemBtn").addEventListener("click", () => {

      });
      document.getElementById("ctxMoveItemBtn").addEventListener("click", () => executeCommand("moveInsertItem"));
      document.getElementById("ctxDeleteItemBtn").addEventListener("click", () => {

        if (doc) deleteSelectedInsertItem(doc);
      });

      // Left Panel Page Jump & Zoom Spinners
      document.getElementById("pageJumpBtn").addEventListener("click", () => {
        const doc = activeDoc();
        if (!doc) return;
        const v = Number(document.getElementById("pageJumpSpin").value) || 1;
        doc.currentPage = Math.max(0, Math.min(doc.pageCount - 1, v - 1));
        doc.selectedPages = new Set([doc.currentPage]);
        if (isMobileViewport()) toggleLeftPane(true);
        renderCurrentPageCanvas();
        renderLeftPane();
      });
      document.getElementById("zoomPercentBtn").addEventListener("click", () => {
        const doc = activeDoc();
        if (!doc) return;
        const pct = Number(document.getElementById("zoomPercentSpin").value) || 100;
        doc.fitMode = "custom";
        doc.zoom = Math.max(0.25, Math.min(4.0, pct / 100));

      // Modal close
      document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
      document.getElementById("modalBackdrop").addEventListener("click", (e) => {

      });

      // File Inputs
      document.getElementById("openPdfInput").addEventListener("change", async (e) => {
        const files = Array.from(e.target.files || []);
        for (const f of files) {
          try {
            const buf = await f.arrayBuffer();
            await openPdfFromBytes(f.name, new Uint8Array(buf), { switchActive: true });
          } catch (error) {
            showToast(`${f.name}: ${error.message || error}`, "fa-circle-exclamation");
          }
        }
        e.target.value = "";
      });

      document.getElementById("mergePdfInput").addEventListener("change", async (e) => {
        if (e.target.files?.length) {
          await addFilesToMergeQueue(e.target.files);
        }
        e.target.value = "";
      });

      document.getElementById("insertPdfInput").addEventListener("change", async (e) => {
        const doc = activeDoc();
        const file = e.target.files?.[0];
        if (doc && file && window.PDFLib) {
          const buf = await file.arrayBuffer();
          saveUndoSnapshot(doc, `다른 PDF 삽입 (${file.name})`);
          const { PDFDocument } = window.PDFLib;
          const targetDoc = await PDFDocument.load(doc.bytes);
          const srcDoc = await PDFDocument.load(buf);
          const copied = await targetDoc.copyPages(srcDoc, srcDoc.getPageIndices());
          const insertAt = doc.currentPage + 1;
          copied.forEach((p, offset) => targetDoc.insertPage(insertAt + offset, p));
          const updatedBytes = await targetDoc.save();
          remapPageItems(doc, insertedPageMap(doc.pageCount, insertAt, copied.length));
          doc.bytes = updatedBytes;
          await reloadDocPdfJs(doc);
          await refreshAllViews();
          showToast(`${file.name}에서 ${copied.length}개 페이지를 삽입했습니다.`, "fa-file-import");
        }
        e.target.value = "";
      });

      document.getElementById("imageToPdfInput").addEventListener("change", async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length > 0 && window.PDFLib) {
          const { PDFDocument } = window.PDFLib;
          const pdfDoc = await PDFDocument.create();
          for (const f of files) {
            const buf = await f.arrayBuffer();
            let img;
            if (f.type.includes("png") || f.name.toLowerCase().endsWith(".png")) {
              img = await pdfDoc.embedPng(buf);
            } else {
              img = await pdfDoc.embedJpg(buf);
            }
            const page = pdfDoc.addPage([595.28, 841.89]);
            const scale = Math.min(535 / img.width, 780 / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            page.drawImage(img, { x: (595.28 - w) / 2, y: (841.89 - h) / 2, width: w, height: h });
          }
          const outBytes = await pdfDoc.save();
          const outName = `${files[0].name.replace(/\.[^.]+$/, "")}_images.pdf`;
          await openPdfFromBytes(outName, outBytes, { switchActive: true });
          downloadBytes(outBytes, outName);
          showToast(`이미지 ${files.length}장으로 PDF를 생성했습니다: ${outName}`, "fa-file-image");
        }
        e.target.value = "";
      });

      document.getElementById("attachmentInput").addEventListener("change", async (e) => {
        const doc = activeDoc();
        const files = Array.from(e.target.files || []);
        if (doc && files.length > 0) {
          try {
            const names = new Set(doc.attachments.map((item) => item.name.toLowerCase()));
            const added = [];
            for (const f of files) {
              if (names.has(f.name.toLowerCase())) throw new Error(`같은 이름의 첨부파일이 있습니다: ${f.name}`);
              names.add(f.name.toLowerCase());
              added.push({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()), type: f.type, isNew: true });
            }
            saveUndoSnapshot(doc, `첨부파일 ${added.length}개 추가`);
            doc.attachments.push(...added);
            renderDocTabs();
            updateCommandStates();
            ensureLeftPanelOpen("attachments");
            showToast(`첨부파일 ${files.length}개를 추가했습니다. PDF 저장 시 포함됩니다.`, "fa-paperclip");
          } catch (error) {
            showToast(`첨부파일 추가 실패: ${error.message || error}`, "fa-circle-exclamation");
          }
        }
        e.target.value = "";
      });

      // Global Drag & Drop PDF onto workspace
      window.addEventListener("dragover", (e) => e.preventDefault());
      window.addEventListener("drop", async (e) => {
        if (document.getElementById("modalBackdrop").classList.contains("open")) return;
        e.preventDefault();
        const allFiles = Array.from(e.dataTransfer?.files || []);
        const pdfFiles = allFiles.filter((f) => f.name.toLowerCase().endsWith(".pdf"));
        const imgFiles = allFiles.filter((f) => /\.(png|jpe?g)$/i.test(f.name));
        for (const f of pdfFiles) {
          const buf = await f.arrayBuffer();
          await openPdfFromBytes(f.name, new Uint8Array(buf), { switchActive: true });
        }
        if (imgFiles.length > 0 && window.PDFLib) {
          const { PDFDocument } = window.PDFLib;
          const pdfDoc = await PDFDocument.create();
          for (const imgFile of imgFiles) {
            const buf = await imgFile.arrayBuffer();
            const embedded = imgFile.name.toLowerCase().endsWith(".png")
              ? await pdfDoc.embedPng(buf)
              : await pdfDoc.embedJpg(buf);
            const page = pdfDoc.addPage([595.28, 841.89]);
            const scale = Math.min(535 / embedded.width, 780 / embedded.height);
            const w = embedded.width * scale;
            const h = embedded.height * scale;
            page.drawImage(embedded, { x: (595.28 - w) / 2, y: (841.89 - h) / 2, width: w, height: h });
          }
          const outBytes = await pdfDoc.save();
          const outName = `${imgFiles[0].name.replace(/\.[^.]+$/, "")}_images.pdf`;
          await openPdfFromBytes(outName, outBytes, { switchActive: true });
          showToast(`드롭한 이미지 ${imgFiles.length}장으로 PDF를 열었습니다.`, "fa-file-image");
        }
      });

      // Mobile & Touch 4-Way Swipe / Scroll Page Navigation on Center Canvas Viewport
      let swipeTouchState = null;
      let multiTouchActive = false, lastMultiTouchTime = 0;

      const canvasViewportEl = document.getElementById("canvasViewport");
      document.getElementById("pageViewMode").addEventListener("change", event => {
        state.viewMode = event.target.value; flowKey = ""; renderCurrentPageCanvas();
      });
      canvasViewportEl.addEventListener("scroll", () => {
        if (!flowScrollFrame) flowScrollFrame = requestAnimationFrame(syncPageFromScroll);
      }, {passive:true});

      canvasViewportEl.addEventListener(
        "touchstart",
        (e) => {
          if (e.touches.length >= 2) { multiTouchActive = true; lastMultiTouchTime = Date.now(); swipeTouchState = null; return; }
          if (state.viewMode !== "single" || multiTouchActive || Date.now() - lastMultiTouchTime < 350) return;
          if (e.touches.length !== 1) { swipeTouchState = null; return; }
          if (e.target.closest(".overlay-item") || e.target.closest("#emptyDropState")) {
            swipeTouchState = null;
            return;
          }
          const t = e.touches[0];
          const maxTop = Math.max(0, canvasViewportEl.scrollHeight - canvasViewportEl.clientHeight);
          const maxLeft = Math.max(0, canvasViewportEl.scrollWidth - canvasViewportEl.clientWidth);
          swipeTouchState = {
            startX: t.clientX,
            startY: t.clientY,
            lastX: t.clientX,
            lastY: t.clientY,
            atTop: canvasViewportEl.scrollTop <= 10,
            atBottom: canvasViewportEl.scrollTop >= maxTop - 10,
            atLeft: canvasViewportEl.scrollLeft <= 10,
            atRight: canvasViewportEl.scrollLeft >= maxLeft - 10,
          };
        },
        { passive: true }
      );

      canvasViewportEl.addEventListener(
        "touchmove",
        (e) => {
          if (e.touches.length >= 2) { multiTouchActive = true; lastMultiTouchTime = Date.now(); swipeTouchState = null; return; }
          if (!swipeTouchState || e.touches.length !== 1) return;
          const t = e.touches[0];
          swipeTouchState.lastX = t.clientX;
          swipeTouchState.lastY = t.clientY;
        },
        { passive: true }
      );

      canvasViewportEl.addEventListener(
        "touchend",
        async (e) => {
          if (multiTouchActive) {
            lastMultiTouchTime = Date.now(); swipeTouchState = null;
            if (e.touches.length === 0) multiTouchActive = false;
            return;
          }
          if (Date.now() - lastMultiTouchTime < 350 || !swipeTouchState) { swipeTouchState = null; return; }
          const changed = e.changedTouches?.[0];
          const endX = changed ? changed.clientX : swipeTouchState.lastX;
          const endY = changed ? changed.clientY : swipeTouchState.lastY;
          const dx = endX - swipeTouchState.startX;
          const dy = endY - swipeTouchState.startY;
          const st = swipeTouchState;
          swipeTouchState = null;

          const SWIPE_MIN = 34;
          if (Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN) return;

          const maxTop = Math.max(0, canvasViewportEl.scrollHeight - canvasViewportEl.clientHeight);
          const maxLeft = Math.max(0, canvasViewportEl.scrollWidth - canvasViewportEl.clientWidth);
          const nowAtTop = canvasViewportEl.scrollTop <= 10;
          const nowAtBottom = canvasViewportEl.scrollTop >= maxTop - 10;
          const nowAtLeft = canvasViewportEl.scrollLeft <= 10;
          const nowAtRight = canvasViewportEl.scrollLeft >= maxLeft - 10;

          if (Math.abs(dx) >= Math.abs(dy)) {
            // Left / Right horizontal scroll/swipe
            if (dx <= -SWIPE_MIN && (st.atRight || nowAtRight || maxLeft <= 14)) {
              await navigatePageByDelta(1, "좌우 스크롤");
            } else if (dx >= SWIPE_MIN && (st.atLeft || nowAtLeft || maxLeft <= 14)) {
              await navigatePageByDelta(-1, "좌우 스크롤");
            }
          } else {
            // Up / Down vertical scroll/swipe
            if (dy <= -SWIPE_MIN && (st.atBottom || nowAtBottom || maxTop <= 14)) {
              await navigatePageByDelta(1, "상하 스크롤");
            } else if (dy >= SWIPE_MIN && (st.atTop || nowAtTop || maxTop <= 14)) {
              await navigatePageByDelta(-1, "상하 스크롤");
            }
          }
        },
        { passive: true }
      );

      canvasViewportEl.addEventListener("touchcancel", () => { multiTouchActive = false; lastMultiTouchTime = Date.now(); swipeTouchState = null; }, {passive:true});

      canvasViewportEl.addEventListener(
        "wheel",
        async (e) => {
          if (e.ctrlKey || e.metaKey || state.viewMode !== "single") return;
          const doc = activeDoc();
          if (!doc || doc.pageCount <= 1) return;

          const maxTop = Math.max(0, canvasViewportEl.scrollHeight - canvasViewportEl.clientHeight);
          const maxLeft = Math.max(0, canvasViewportEl.scrollWidth - canvasViewportEl.clientWidth);
          const atTop = canvasViewportEl.scrollTop <= 4;
          const atBottom = canvasViewportEl.scrollTop >= maxTop - 4;
          const atLeft = canvasViewportEl.scrollLeft <= 4;
          const atRight = canvasViewportEl.scrollLeft >= maxLeft - 4;

          if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) >= 24) {
            if (e.deltaX > 0 && (atRight || maxLeft <= 8)) {
              e.preventDefault();
              await navigatePageByDelta(1, "좌우 스크롤");
            } else if (e.deltaX < 0 && (atLeft || maxLeft <= 8)) {
              e.preventDefault();
              await navigatePageByDelta(-1, "좌우 스크롤");
            }
          } else if (Math.abs(e.deltaY) >= 28) {
            if (e.deltaY > 0 && (atBottom || maxTop <= 8)) {
              e.preventDefault();
              await navigatePageByDelta(1, "상하 스크롤");
            } else if (e.deltaY < 0 && (atTop || maxTop <= 8)) {
              e.preventDefault();
              await navigatePageByDelta(-1, "상하 스크롤");
            }
          }
        },
        { passive: false }
      );

      // Capture placement before item dragging or selection.
      document.getElementById("pageStage").addEventListener("mousedown", event => {
        if (state.pendingPlacement) { event.preventDefault(); event.stopPropagation(); }
      }, true);
      document.getElementById("pageStage").addEventListener("click", event => {
        if (state.pendingPlacement) { event.preventDefault(); event.stopPropagation(); placePendingItem(event); }
      }, true);
      // Deselect overlay when clicking blank page stage
      document.getElementById("pageStage").addEventListener("mousedown", () => {
        if (state.selectedInsertId) {
          state.selectedInsertId = null;
          const doc = activeDoc();
          if (doc) renderOverlayItems(doc, doc.currentPage, doc.zoom);
          updateCommandStates();
        }
      });

      // Keyboard Shortcuts (Commercial PDF Editor Standard Shortcuts)
      window.addEventListener("keydown", (e) => {
        const inInput = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
        if (e.key === "Escape") {
          if (document.getElementById("modalBackdrop").classList.contains("open")) {
            closeModal();
          } else if (state.pendingPlacement) {
            cancelPlacement(); showToast("삽입 위치 지정을 취소했습니다.", "fa-xmark");
          } else if (state.selectedInsertId) {
            state.selectedInsertId = null;
            const doc = activeDoc();
            if (doc) renderOverlayItems(doc, doc.currentPage, doc.zoom);
            updateCommandStates();
          }
          return;
        }
        const editing = inInput || document.activeElement?.isContentEditable;
        const modalOpen = document.getElementById("modalBackdrop").classList.contains("open");
        if (modalOpen || editing) return;
        const mod = e.ctrlKey || e.metaKey;
        if (e.altKey && e.shiftKey && !mod) {
          const alternatives = {t:"insertText", w:"closeDoc", r:"reorderPages", h:"highlightText", d:"splitPages"};
          const alternative = alternatives[e.key.toLowerCase()];
          if (alternative && activeDoc()) { e.preventDefault(); executeCommand(alternative); return; }
        }
        if (mod && !e.altKey && !e.shiftKey && e.key === "2") {
          e.preventDefault(); state.viewMode = "single"; document.getElementById("pageViewMode").value = "single"; flowKey = ""; renderCurrentPageCanvas(); return;
        }
        if (mod && !e.altKey && !e.shiftKey && (e.key === "=" || e.key === "+" || e.key === "-")) {
          e.preventDefault(); document.getElementById(e.key === "-" ? "quickZoomOutBtn" : "quickZoomInBtn").click(); return;
        }
        if (mod) {
          let key = e.key.toLowerCase();
          if (e.code === "BracketLeft") key = "[";
          if (e.code === "BracketRight") key = "]";
          if (key === "delete") key = "del";
          const shortcut = ["ctrl", ...(e.altKey ? ["alt"] : []), ...(e.shiftKey ? ["shift"] : []), key].join("+");
          const action = RIBBON_SPEC.flatMap(tab => tab.groups.flatMap(group => group.actions)).find(item => item.shortcut?.toLowerCase() === shortcut);
          if (action && (!action.docReq || activeDoc())) { e.preventDefault(); executeCommand(action.id); return; }
        }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "l") {
          e.preventDefault();
          toggleThemeMode();
        } else if ((e.ctrlKey || e.metaKey) && e.key === "F1") {
          e.preventDefault();
          toggleRibbonVisibility();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "m") {
          e.preventDefault();
          openMergePdfModal();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "o") {
          e.preventDefault();
          executeCommand("openPdf");
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") {
          e.preventDefault();
          const inlineInp = document.getElementById("inlineSearchInput");
          if (!isMobileViewport() && inlineInp) {
            inlineInp.focus();
            inlineInp.select();
          } else {
            executeCommand("searchDoc");
          }
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          executeCommand("saveAs");
        } else if ((e.ctrlKey || e.metaKey) && !inInput && e.key.toLowerCase() === "z") {
          e.preventDefault();
          if (e.shiftKey) performRedo();
          else performUndo();
        } else if ((e.ctrlKey || e.metaKey) && !inInput && e.key.toLowerCase() === "y") {
          e.preventDefault();
          performRedo();
        } else if ((e.ctrlKey || e.metaKey) && !inInput && e.key.toLowerCase() === "d") {
          const doc = activeDoc();
          if (doc && state.selectedInsertId) {
            e.preventDefault();
            duplicateSelectedInsertItem(doc);
          }
        } else if (!inInput && (e.key === "Delete" || e.key === "Backspace")) {
          const doc = activeDoc();
          if (doc && state.selectedInsertId) {
            e.preventDefault();
            deleteSelectedInsertItem(doc);
          }
        } else if (!inInput && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
          const doc = activeDoc();
          if (doc && state.selectedInsertId) {
            const item = doc.overlays.find((o) => o.id === state.selectedInsertId);
            if (item && item.pageIndex === doc.currentPage) {
              e.preventDefault();
              const step = e.shiftKey ? 10 : 2;
              if (e.key === "ArrowUp") item.y = Math.max(0, item.y - step);
              if (e.key === "ArrowDown") item.y = Math.min(820, item.y + step);
              if (e.key === "ArrowLeft") item.x = Math.max(0, item.x - step);
              if (e.key === "ArrowRight") item.x = Math.min(560, item.x + step);
              renderOverlayItems(doc, doc.currentPage, doc.zoom);
            }
          }
        } else if (!inInput && e.key === "PageDown") {
          e.preventDefault();
          navigatePageByDelta(1, "PageDown");
        } else if (!inInput && e.key === "PageUp") {
          e.preventDefault();
          navigatePageByDelta(-1, "PageUp");
        }
      });

      window.addEventListener("resize", () => {
        syncSidePaneDomState();
        const doc = activeDoc();
        if (doc && (doc.fitMode === "width" || doc.fitMode === "page")) {
          renderCurrentPageCanvas();
        }
      });
    }

    // =========================================================================
    // Bootstrap
    // =========================================================================
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const savedTheme = localStorage.getItem("sunrise_pdf_web_theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          applyThemeMode(savedTheme);
        }
        const savedPanels = JSON.parse(localStorage.getItem("sunrise_pdf_web_panels_default_l_q") || "null");
        if (savedPanels && Array.isArray(savedPanels.leftPanels) && Array.isArray(savedPanels.rightPanels)) {
          state.leftPanels = savedPanels.leftPanels.filter(k => LEFT_PANEL_CATALOG.some(p => p.key === k));
          state.rightPanels = savedPanels.rightPanels.filter(k => RIGHT_PANEL_CATALOG.some(p => p.key === k));
          if (!state.leftPanels.length) state.leftPanels = [...DEFAULT_LEFT_PANELS];
          if (!state.rightPanels.length) state.rightPanels = [...DEFAULT_RIGHT_PANELS];
          state.activeLeftTab = state.leftPanels[0] || "";
          state.activeRightTab = state.rightPanels[0] || "";
        }
      } catch (_e) {}

      if (isMobileViewport()) {
        state.leftPaneCollapsed = true;
        state.rightPaneCollapsed = true;
      }

      wireEvents();
      if (window.matchMedia("(max-width: 820px) and (orientation: landscape) and (pointer: coarse)").matches) {
        toggleRibbonVisibility(false);
      }
      window.addEventListener("beforeunload", (event) => {
        if (state.docs.some((doc) => doc.dirty)) {
          event.preventDefault();
          event.returnValue = "";
        }
      });
      await refreshAllViews();
    });
  </script>
</body>
</html>
