      // File Inputs
      document.getElementById("openPdfInput").addEventListener("change", async (e) => {
        const files = Array.from(e.target.files || []);
        for (const f of files) {
          try {
            const bytes = await readPdfInputFile(f);
            await openPdfFromBytes(f.name, bytes, { switchActive: true });
          } catch (error) {
            showToast(`${f.name}: ${error.message || error}`, "fa-circle-exclamation");
          }
        }
        e.target.value = "";
      });

      document.getElementById("mergePdfInput").addEventListener("change", async (e) => {
        if (e.target.files?.length) {
          await addFilesToMergeQueue(e.target.files);
        }
        e.target.value = "";
      });

      document.getElementById("insertPdfInput").addEventListener("change", async (e) => {
        const doc = activeDoc();
        const file = e.target.files?.[0];
        try {
          if (!doc || !file || !window.PDFLib) return;
          const buf = await readPdfInputFile(file);
          const { PDFDocument } = window.PDFLib;
          const originalBytes = doc.bytes;
          const targetDoc = await PDFDocument.load(originalBytes);
          if (doc.bytes !== originalBytes || !allowPageStructureChange(targetDoc)) return;
          const srcDoc = await PDFDocument.load(buf);
          if (!allowPageFormStructure(srcDoc)) return;
          if (doc.bytes !== originalBytes || activeDoc() !== doc) { showToast("문서가 변경되어 페이지 작업을 취소했습니다.", "fa-circle-exclamation"); return; }
          const insertAt = doc.currentPage + 1;
          const copied = await targetDoc.copyPages(srcDoc, srcDoc.getPageIndices());
          copied.forEach((p, offset) => targetDoc.insertPage(insertAt + offset, p));
          const updatedBytes = await targetDoc.save();
          if (doc.bytes !== originalBytes || activeDoc() !== doc || doc.currentPage + 1 !== insertAt) { showToast("문서가 변경되어 페이지 작업을 취소했습니다.", "fa-circle-exclamation"); return; }
          saveUndoSnapshot(doc, `다른 PDF 삽입 (${file.name})`);
          remapPageItems(doc, insertedPageMap(doc.pageCount, insertAt, copied.length));
          doc.bytes = updatedBytes;
          await reloadDocPdfJs(doc);
          await refreshAllViews();
          showToast(`${file.name}에서 ${copied.length}개 페이지를 삽입했습니다.`, "fa-file-import");
        } catch (error) {
          showToast(`PDF 페이지 삽입 실패: ${error.message || error}`, "fa-circle-exclamation");
        } finally {
          e.target.value = "";
        }
      });

      document.getElementById("imageToPdfInput").addEventListener("change", async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length > 0 && window.PDFLib) {
          const { PDFDocument } = window.PDFLib;
          const pdfDoc = await PDFDocument.create();
          for (const f of files) {
            const buf = await f.arrayBuffer();
            let img;
            if (f.type.includes("png") || f.name.toLowerCase().endsWith(".png")) {
              img = await pdfDoc.embedPng(buf);
            } else {
              img = await pdfDoc.embedJpg(buf);
            }
            const page = pdfDoc.addPage([595.28, 841.89]);
            const scale = Math.min(535 / img.width, 780 / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            page.drawImage(img, { x: (595.28 - w) / 2, y: (841.89 - h) / 2, width: w, height: h });
          }
          const outBytes = await pdfDoc.save();
          const outName = `${files[0].name.replace(/\.[^.]+$/, "")}_images.pdf`;
          await openPdfFromBytes(outName, outBytes, { switchActive: true });
          downloadBytes(outBytes, outName);
          showToast(`이미지 ${files.length}장으로 PDF를 생성했습니다: ${outName}`, "fa-file-image");
        }
        e.target.value = "";
      });

      document.getElementById("attachmentInput").addEventListener("change", async (e) => {
        const doc = activeDoc();
        const files = Array.from(e.target.files || []);
        if (doc && files.length > 0) {
          try {
            const names = new Set(doc.attachments.map((item) => item.name.toLowerCase()));
            const added = [];
            for (const f of files) {
              if (names.has(f.name.toLowerCase())) throw new Error(`같은 이름의 첨부파일이 있습니다: ${f.name}`);
              names.add(f.name.toLowerCase());
              added.push({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()), type: f.type, isNew: true });
            }
            saveUndoSnapshot(doc, `첨부파일 ${added.length}개 추가`);
            doc.attachments.push(...added);
            renderDocTabs();
            updateCommandStates();
            ensureLeftPanelOpen("attachments");
            showToast(`첨부파일 ${files.length}개를 추가했습니다. PDF 저장 시 포함됩니다.`, "fa-paperclip");
          } catch (error) {
            showToast(`첨부파일 추가 실패: ${error.message || error}`, "fa-circle-exclamation");
          }
        }
        e.target.value = "";
      });

      // Global Drag & Drop PDF onto workspace
      window.addEventListener("dragover", (e) => e.preventDefault());
      window.addEventListener("drop", async (e) => {
        if (document.getElementById("modalBackdrop").classList.contains("open")) return;
        e.preventDefault();
        const allFiles = Array.from(e.dataTransfer?.files || []);
        const pdfFiles = allFiles.filter((f) => f.name.toLowerCase().endsWith(".pdf"));
        const imgFiles = allFiles.filter((f) => /\.(png|jpe?g)$/i.test(f.name));
        for (const f of pdfFiles) {
          try {
            const bytes = await readPdfInputFile(f);
            await openPdfFromBytes(f.name, bytes, { switchActive: true });
          } catch (error) {
            showToast(`${f.name}: ${error.message || error}`, "fa-circle-exclamation");
          }
        }
        if (imgFiles.length > 0 && window.PDFLib) {
          const { PDFDocument } = window.PDFLib;
          const pdfDoc = await PDFDocument.create();
          for (const imgFile of imgFiles) {
            const buf = await imgFile.arrayBuffer();
            const embedded = imgFile.name.toLowerCase().endsWith(".png")
              ? await pdfDoc.embedPng(buf)
              : await pdfDoc.embedJpg(buf);
            const page = pdfDoc.addPage([595.28, 841.89]);
            const scale = Math.min(535 / embedded.width, 780 / embedded.height);
            const w = embedded.width * scale;
            const h = embedded.height * scale;
            page.drawImage(embedded, { x: (595.28 - w) / 2, y: (841.89 - h) / 2, width: w, height: h });
          }
          const outBytes = await pdfDoc.save();
          const outName = `${imgFiles[0].name.replace(/\.[^.]+$/, "")}_images.pdf`;
          await openPdfFromBytes(outName, outBytes, { switchActive: true });
          showToast(`드롭한 이미지 ${imgFiles.length}장으로 PDF를 열었습니다.`, "fa-file-image");
        }
      });

      // Mobile & Touch 4-Way Swipe / Scroll Page Navigation on Center Canvas Viewport
      let swipeTouchState = null;
      let multiTouchActive = false, lastMultiTouchTime = 0;

      const canvasViewportEl = document.getElementById("canvasViewport");
      document.getElementById("pageViewMode").addEventListener("change", event => {
        state.viewMode = event.target.value; flowKey = ""; renderCurrentPageCanvas();
      });
      canvasViewportEl.addEventListener("scroll", () => {
        if (!flowScrollFrame) flowScrollFrame = requestAnimationFrame(syncPageFromScroll);
      }, {passive:true});

      canvasViewportEl.addEventListener(
        "touchstart",
        (e) => {
          if (e.touches.length >= 2) { multiTouchActive = true; lastMultiTouchTime = Date.now(); swipeTouchState = null; return; }
          if (state.viewMode !== "single" || multiTouchActive || Date.now() - lastMultiTouchTime < 350) return;
          if (e.touches.length !== 1) { swipeTouchState = null; return; }
          if (e.target.closest(".overlay-item") || e.target.closest("#emptyDropState")) {
            swipeTouchState = null;
            return;
          }
          const t = e.touches[0];
          const maxTop = Math.max(0, canvasViewportEl.scrollHeight - canvasViewportEl.clientHeight);
          const maxLeft = Math.max(0, canvasViewportEl.scrollWidth - canvasViewportEl.clientWidth);
          swipeTouchState = {
            startX: t.clientX,
            startY: t.clientY,
            lastX: t.clientX,
            lastY: t.clientY,
            atTop: canvasViewportEl.scrollTop <= 10,
            atBottom: canvasViewportEl.scrollTop >= maxTop - 10,
            atLeft: canvasViewportEl.scrollLeft <= 10,
            atRight: canvasViewportEl.scrollLeft >= maxLeft - 10,
          };
        },
        { passive: true }
      );

      canvasViewportEl.addEventListener(
        "touchmove",
        (e) => {
          if (e.touches.length >= 2) { multiTouchActive = true; lastMultiTouchTime = Date.now(); swipeTouchState = null; return; }
          if (!swipeTouchState || e.touches.length !== 1) return;
          const t = e.touches[0];
          swipeTouchState.lastX = t.clientX;
          swipeTouchState.lastY = t.clientY;
        },
        { passive: true }
      );

      canvasViewportEl.addEventListener(
        "touchend",
        async (e) => {
          if (multiTouchActive) {
            lastMultiTouchTime = Date.now(); swipeTouchState = null;
            if (e.touches.length === 0) multiTouchActive = false;
            return;
          }
          if (Date.now() - lastMultiTouchTime < 350 || !swipeTouchState) { swipeTouchState = null; return; }
          const changed = e.changedTouches?.[0];
          const endX = changed ? changed.clientX : swipeTouchState.lastX;
          const endY = changed ? changed.clientY : swipeTouchState.lastY;
          const dx = endX - swipeTouchState.startX;
          const dy = endY - swipeTouchState.startY;
          const st = swipeTouchState;
          swipeTouchState = null;

          const SWIPE_MIN = 34;
          if (Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN) return;

          const maxTop = Math.max(0, canvasViewportEl.scrollHeight - canvasViewportEl.clientHeight);
          const maxLeft = Math.max(0, canvasViewportEl.scrollWidth - canvasViewportEl.clientWidth);
          const nowAtTop = canvasViewportEl.scrollTop <= 10;
          const nowAtBottom = canvasViewportEl.scrollTop >= maxTop - 10;
          const nowAtLeft = canvasViewportEl.scrollLeft <= 10;
          const nowAtRight = canvasViewportEl.scrollLeft >= maxLeft - 10;

          if (Math.abs(dx) >= Math.abs(dy)) {
            // Left / Right horizontal scroll/swipe
            if (dx <= -SWIPE_MIN && (st.atRight || nowAtRight || maxLeft <= 14)) {
              await navigatePageByDelta(1, "좌우 스크롤");
            } else if (dx >= SWIPE_MIN && (st.atLeft || nowAtLeft || maxLeft <= 14)) {
              await navigatePageByDelta(-1, "좌우 스크롤");
            }
          } else {
            // Up / Down vertical scroll/swipe
            if (dy <= -SWIPE_MIN && (st.atBottom || nowAtBottom || maxTop <= 14)) {
              await navigatePageByDelta(1, "상하 스크롤");
            } else if (dy >= SWIPE_MIN && (st.atTop || nowAtTop || maxTop <= 14)) {
              await navigatePageByDelta(-1, "상하 스크롤");
            }
          }
        },
        { passive: true }
      );

      canvasViewportEl.addEventListener("touchcancel", () => { multiTouchActive = false; lastMultiTouchTime = Date.now(); swipeTouchState = null; }, {passive:true});

      canvasViewportEl.addEventListener(
        "wheel",
        async (e) => {
          if (e.ctrlKey || e.metaKey || state.viewMode !== "single") return;
          const doc = activeDoc();
          if (!doc || doc.pageCount <= 1) return;

          const maxTop = Math.max(0, canvasViewportEl.scrollHeight - canvasViewportEl.clientHeight);
          const maxLeft = Math.max(0, canvasViewportEl.scrollWidth - canvasViewportEl.clientWidth);
          const atTop = canvasViewportEl.scrollTop <= 4;
          const atBottom = canvasViewportEl.scrollTop >= maxTop - 4;
          const atLeft = canvasViewportEl.scrollLeft <= 4;
          const atRight = canvasViewportEl.scrollLeft >= maxLeft - 4;

          if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) >= 24) {
            if (e.deltaX > 0 && (atRight || maxLeft <= 8)) {
              e.preventDefault();
              await navigatePageByDelta(1, "좌우 스크롤");
            } else if (e.deltaX < 0 && (atLeft || maxLeft <= 8)) {
              e.preventDefault();
              await navigatePageByDelta(-1, "좌우 스크롤");
            }
          } else if (Math.abs(e.deltaY) >= 28) {
            if (e.deltaY > 0 && (atBottom || maxTop <= 8)) {
              e.preventDefault();
              await navigatePageByDelta(1, "상하 스크롤");
            } else if (e.deltaY < 0 && (atTop || maxTop <= 8)) {
              e.preventDefault();
              await navigatePageByDelta(-1, "상하 스크롤");
            }
          }
        },
        { passive: false }
      );

      // Capture placement before item dragging or selection.
      document.getElementById("pageStage").addEventListener("mousedown", event => {
        if (state.pendingPlacement) { event.preventDefault(); event.stopPropagation(); }
      }, true);
      document.getElementById("pageStage").addEventListener("click", event => {
        if (state.pendingPlacement) { event.preventDefault(); event.stopPropagation(); placePendingItem(event); }
      }, true);
      // Deselect overlay when clicking blank page stage
      document.getElementById("pageStage").addEventListener("mousedown", () => {
        if (state.selectedInsertId) {
          state.selectedInsertId = null;
          const doc = activeDoc();
          if (doc) renderOverlayItems(doc, doc.currentPage, doc.zoom);
          updateCommandStates();
        }
      });

      // Keyboard Shortcuts (Commercial PDF Editor Standard Shortcuts)
      window.addEventListener("keydown", (e) => {
        const inInput = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
        if (e.key === "Escape") {
          if (document.getElementById("modalBackdrop").classList.contains("open")) {
            closeModal();
          } else if (state.pendingPlacement) {
            cancelPlacement(); showToast("삽입 위치 지정을 취소했습니다.", "fa-xmark");
          } else if (state.selectedInsertId) {
            state.selectedInsertId = null;
            const doc = activeDoc();
            if (doc) renderOverlayItems(doc, doc.currentPage, doc.zoom);
            updateCommandStates();
          }
          return;
        }
        const editing = inInput || document.activeElement?.isContentEditable;
        const modalOpen = document.getElementById("modalBackdrop").classList.contains("open");
        if (modalOpen || editing) return;
        const mod = e.ctrlKey || e.metaKey;
        if (e.altKey && e.shiftKey && !mod) {
          const alternatives = {t:"insertText", w:"closeDoc", r:"reorderPages", h:"highlightText", d:"splitPages"};
          const alternative = alternatives[e.key.toLowerCase()];
          if (alternative && activeDoc()) { e.preventDefault(); executeCommand(alternative); return; }
        }
        if (mod && !e.altKey && !e.shiftKey && e.key === "2") {
          e.preventDefault(); state.viewMode = "single"; document.getElementById("pageViewMode").value = "single"; flowKey = ""; renderCurrentPageCanvas(); return;
        }
        if (mod && !e.altKey && !e.shiftKey && (e.key === "=" || e.key === "+" || e.key === "-")) {
          e.preventDefault(); document.getElementById(e.key === "-" ? "quickZoomOutBtn" : "quickZoomInBtn").click(); return;
        }
        if (mod) {
          let key = e.key.toLowerCase();
          if (e.code === "BracketLeft") key = "[";
          if (e.code === "BracketRight") key = "]";
          if (key === "delete") key = "del";
          const shortcut = ["ctrl", ...(e.altKey ? ["alt"] : []), ...(e.shiftKey ? ["shift"] : []), key].join("+");
          const action = RIBBON_SPEC.flatMap(tab => tab.groups.flatMap(group => group.actions)).find(item => item.shortcut?.toLowerCase() === shortcut);
          if (action && (!action.docReq || activeDoc())) { e.preventDefault(); executeCommand(action.id); return; }
        }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "l") {
          e.preventDefault();
          toggleThemeMode();
        } else if ((e.ctrlKey || e.metaKey) && e.key === "F1") {
          e.preventDefault();
          toggleRibbonVisibility();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "m") {
          e.preventDefault();
          openMergePdfModal();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "o") {
          e.preventDefault();
          executeCommand("openPdf");
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") {
          e.preventDefault();
          const inlineInp = document.getElementById("inlineSearchInput");
          if (!isMobileViewport() && inlineInp) {
            inlineInp.focus();
            inlineInp.select();
          } else {
            executeCommand("searchDoc");
          }
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          executeCommand("saveAs");
        } else if ((e.ctrlKey || e.metaKey) && !inInput && e.key.toLowerCase() === "z") {
          e.preventDefault();
          if (e.shiftKey) performRedo();
          else performUndo();
        } else if ((e.ctrlKey || e.metaKey) && !inInput && e.key.toLowerCase() === "y") {
          e.preventDefault();
          performRedo();
        } else if ((e.ctrlKey || e.metaKey) && !inInput && e.key.toLowerCase() === "d") {
          const doc = activeDoc();
          if (doc && state.selectedInsertId) {
            e.preventDefault();
            duplicateSelectedInsertItem(doc);
          }
        } else if (!inInput && (e.key === "Delete" || e.key === "Backspace")) {
          const doc = activeDoc();
          if (doc && state.selectedInsertId) {
            e.preventDefault();
            deleteSelectedInsertItem(doc);
          }
        } else if (!inInput && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
          const doc = activeDoc();
          if (doc && state.selectedInsertId) {
            const item = doc.overlays.find((o) => o.id === state.selectedInsertId);
            if (item && item.pageIndex === doc.currentPage) {
              e.preventDefault();
              const step = e.shiftKey ? 10 : 2;
              if (e.key === "ArrowUp") item.y = Math.max(0, item.y - step);
              if (e.key === "ArrowDown") item.y = Math.min(820, item.y + step);
              if (e.key === "ArrowLeft") item.x = Math.max(0, item.x - step);
              if (e.key === "ArrowRight") item.x = Math.min(560, item.x + step);
              renderOverlayItems(doc, doc.currentPage, doc.zoom);
            }
          }
        } else if (!inInput && e.key === "PageDown") {
          e.preventDefault();
          navigatePageByDelta(1, "PageDown");
        } else if (!inInput && e.key === "PageUp") {
          e.preventDefault();
          navigatePageByDelta(-1, "PageUp");
        }
      });

      window.addEventListener("resize", () => {
        syncSidePaneDomState();
        const doc = activeDoc();
        if (doc && (doc.fitMode === "width" || doc.fitMode === "page")) {
          renderCurrentPageCanvas();
        }
      });
    }

    // =========================================================================
    // Bootstrap
    // =========================================================================
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const savedTheme = localStorage.getItem("sunrise_pdf_web_theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          applyThemeMode(savedTheme);
        }
        const savedPanels = JSON.parse(localStorage.getItem("sunrise_pdf_web_panels_default_l_q") || "null");
        if (savedPanels && Array.isArray(savedPanels.leftPanels) && Array.isArray(savedPanels.rightPanels)) {
          state.leftPanels = savedPanels.leftPanels.filter(k => LEFT_PANEL_CATALOG.some(p => p.key === k));
          state.rightPanels = savedPanels.rightPanels.filter(k => RIGHT_PANEL_CATALOG.some(p => p.key === k));
          if (!state.leftPanels.length) state.leftPanels = [...DEFAULT_LEFT_PANELS];
          if (!state.rightPanels.length) state.rightPanels = [...DEFAULT_RIGHT_PANELS];
          state.activeLeftTab = state.leftPanels[0] || "";
          state.activeRightTab = state.rightPanels[0] || "";
        }
      } catch (_e) {}

      if (isMobileViewport()) {
        state.leftPaneCollapsed = true;
        state.rightPaneCollapsed = true;
      }

      wireEvents();
      if (window.matchMedia("(max-width: 820px) and (orientation: landscape) and (pointer: coarse)").matches) {
        toggleRibbonVisibility(false);
      }
      window.addEventListener("beforeunload", (event) => {
        if (state.docs.some((doc) => doc.dirty)) {
          event.preventDefault();
          event.returnValue = "";
        }
      });
      await refreshAllViews();
    });
  </script>
</body>
</html>
