<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Sunrise PDF Editor — Web Edition (Chrome / Edge / Mobile)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="/assets/pdf-lib/pdf-lib.min.js"></script>
  <script src="/assets/korean-font.js"></script>
  <script src="/assets/sunrise-edit-state.js"></script>
  <script src="/assets/sunrise-auto-bookmarks.js"></script>
  <script src="/assets/sunrise-batch-pages.js"></script>
  <script src="/assets/sunrise-pdf-quality.js"></script>
  <script type="module">
    try {
      window.pdfjsLib = await import("/assets/pdfjs/pdf.min.mjs");
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "/assets/pdfjs/pdf.worker.min.mjs";
    } catch (error) {
      console.error("PDF renderer failed to load", error);
    }
  </script>
  <style>
    :root, html[data-theme="light"] {
      --workspace-bg: #F2F5F8;
      --surface: #FFFFFF;
      --surface-alt: #EAF0F5;
      --surface-soft: #F7F9FB;
      --group-alt: #FBFCFD;
      --border: #C7D1DA;
      --border-soft: #DCE3E9;
      --text: #263746;
      --text-muted: #647687;
      --primary: #1F6F9F;
      --primary-hover: #2B7FAF;
      --primary-soft: #DCEAF5;
      --primary-selected: #CFE3F2;
      --brand: #E58A18;
      --brand-soft: #FFF2DF;
      --success: #2F7D5A;
      --success-soft: #E7F5EE;
      --warning: #C97820;
      --danger: #C94B48;
      --danger-soft: #FDEDEC;
      --disabled: #9AA6B2;
      --canvas-bg: #D9E0E6;
      --shadow-sm: 0 2px 6px rgba(23, 61, 90, 0.08);
      --shadow-lg: 0 14px 36px rgba(15, 35, 52, 0.22);
      --modal-backdrop: rgba(15, 28, 40, 0.45);
      --info-box-bg: #EAF2F8;
      --info-box-border: #C5D7E5;
      --info-box-text: #234156;
    }

    html[data-theme="dark"] {
      --workspace-bg: #141C24;
      --surface: #1B2631;
      --surface-alt: #212F3D;
      --surface-soft: #17212B;
      --group-alt: #1E2936;
      --border: #314355;
      --border-soft: #283747;
      --text: #E6EEF6;
      --text-muted: #9FB0C2;
      --primary: #4BA8DF;
      --primary-hover: #62B8EB;
      --primary-soft: #1E3A52;
      --primary-selected: #244763;
      --brand: #F09B2D;
      --brand-soft: #3B2B16;
      --success: #48B884;
      --success-soft: #19382B;
      --warning: #E69938;
      --danger: #E56B67;
      --danger-soft: #3F1F21;
      --disabled: #5A6B7C;
      --canvas-bg: #0F151C;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 42px rgba(0, 0, 0, 0.58);
      --modal-backdrop: rgba(5, 10, 15, 0.68);
      --info-box-bg: #1C2B3A;
      --info-box-border: #324C63;
      --info-box-text: #D4E6F5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", "Noto Sans KR", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--workspace-bg);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    /* App Shell */
    #appShell {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--workspace-bg);
      overflow: hidden;
    }

    /* Top Command Bar */
    #workspaceCommandBar {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 44px;
      padding: 0 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #workspaceCommandBar::-webkit-scrollbar {
      display: none;
    }

    .brand-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 8px;
      line-height: 1.05;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--primary);
    }

    .brand-sub {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: 0.5px;
    }

    .cmd-divider {
      width: 1px;
      height: 22px;
      background: var(--border-soft);
      margin: 0 3px;
      flex-shrink: 0;
    }

    .quick-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background 0.14s, border-color 0.14s, color 0.14s;
      flex-shrink: 0;
    }

    .quick-icon-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .quick-icon-btn:disabled {
      color: var(--disabled);
      cursor: not-allowed;
      opacity: 0.55;
    }

    .doc-title-area {
      flex: 1;
      min-width: 160px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      overflow: hidden;
    }

    #workspaceDocumentTitle {
      font-weight: 600;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    #workspaceDocumentMeta {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid var(--border-soft);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .top-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .top-pill-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Ribbon Bar */
    #mainRibbon {
      display: flex;
      flex-direction: column;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #mainRibbon.hidden {
      display: none;
    }

    .ribbon-tabs {
      display: flex;
      align-items: stretch;
      height: 32px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      padding-left: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .ribbon-tabs::-webkit-scrollbar {
      display: none;
    }

    .ribbon-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 14px;
      border: none;
      border-right: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      font-size: 12.2px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s;
      flex-shrink: 0;
    }

    .ribbon-tab-btn:hover {
      background: var(--surface-soft);
      color: var(--primary);
    }

    .ribbon-tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      border-top: 2px solid var(--primary);
      font-weight: 700;
    }

    .ribbon-surface {
      display: flex;
      align-items: stretch;
      gap: 5px;
      padding: 5px 8px;
      min-height: 98px;
      background: var(--surface-soft);
      overflow-x: auto;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .ribbon-group {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 3px 4px 0 4px;
      flex-shrink: 0;
    }

    .ribbon-group:nth-child(even) {
      background: var(--group-alt);
    }

    .ribbon-group-body {
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 1px 2px;
      min-height: 66px;
    }

    .ribbon-group-title {
      height: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.8px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-alt);
      border-top: 1px solid var(--border-soft);
      margin: 2px -4px 0 -4px;
      border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;
      padding: 0 6px;
      white-space: nowrap;
    }

    .cmd-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 88px;
      min-width: 84px;
      max-width: 105px;
      min-height: 64px;
      height: auto;
      padding: 5px 3px 3px 3px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.13s;
      text-align: center;
      position: relative;
      flex-shrink: 0;
    }

    .cmd-btn i {
      font-size: 16px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      margin-bottom: 3px;
      transition: transform 0.12s;
    }

    .cmd-btn span {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      word-break: keep-all;
      overflow-wrap: break-word;
      display: block;
      overflow: visible;
    }

    .cmd-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .cmd-btn:hover:not(:disabled) i {
      transform: translateY(-1px);
    }

    .cmd-btn.active {
      background: var(--primary-selected);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    .cmd-btn.active::after {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 10px;
      right: 10px;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
    }

    .cmd-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .cmd-btn:disabled i {
      color: var(--disabled);
    }

    /* Main Workspace Flex Layout with Collapsible Left & Right Panels */
    #mainWorkspace {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      background: var(--workspace-bg);
      position: relative;
      overflow: hidden;
    }

    /* Left & Right Side Panels */
    .side-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      transition: width 0.18s ease, min-width 0.18s ease, transform 0.22s ease;
      flex-shrink: 0;
      position: relative;
      z-index: 20;
    }

    #leftNavigationPane {
      width: 245px;
      min-width: 245px;
    }

    #leftNavigationPane.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      border-right: none;
      overflow: hidden;
    }

    #rightInspectorPane {
      width: 280px;
      min-width: 280px;
      border-right: none;
      border-left: 1px solid var(--border);
    }

    #rightInspectorPane.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      border-left: none;
      overflow: hidden;
    }

    /* Center Edge Handle Toggle Buttons (Left & Right Vertical Middle Handles) */
    .panel-edge-handle {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 35;
      width: 18px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      color: var(--primary);
      border: 1px solid var(--border);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 0.15s, color 0.15s, width 0.15s, border-color 0.15s;
    }

    .panel-edge-handle:hover {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
      width: 22px;
    }

    #leftPanelEdgeToggle {
      left: 0;
      border-left: none;
      border-radius: 0 7px 7px 0;
    }

    #rightPanelEdgeToggle {
      right: 0;
      border-right: none;
      border-radius: 7px 0 0 7px;
    }

    /* Customizable Pane Tab Bar with Close (x) & Add (+) */
    .pane-tab-bar {
      display: flex;
      align-items: center;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      min-height: 33px;
    }

    .pane-tab-bar::-webkit-scrollbar {
      display: none;
    }

    .pane-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 8px 6px 10px;
      border: none;
      border-right: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s;
      flex-shrink: 0;
    }

    .pane-tab-btn:hover {
      background: var(--surface-soft);
      color: var(--primary);
    }

    .pane-tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      border-top: 2px solid var(--primary);
      font-weight: 700;
    }

    .pane-tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      font-size: 9.5px;
      color: var(--text-muted);
      transition: background 0.12s, color 0.12s;
    }

    .pane-tab-close:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .pane-tab-add-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 0 3px;
      border-radius: 4px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--primary);
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.14s;
    }

    .pane-tab-add-btn:hover {
      background: var(--primary-soft);
      border-style: solid;
      border-color: var(--primary);
    }

    .pane-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      -webkit-overflow-scrolling: touch;
    }

    /* Thumbnail List */
    #thumbnailContainer {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .thumb-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      border-radius: 6px;
      border: 1.5px solid var(--border-soft);
      background: var(--surface-soft);
      cursor: pointer;
      transition: all 0.14s;
      position: relative;
    }

    .thumb-card:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .thumb-card.selected {
      border-color: var(--primary);
      background: var(--primary-selected);
      box-shadow: var(--shadow-sm);
    }

    .thumb-canvas-wrap {
      background: #FFFFFF;
      border: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      overflow: hidden;
    }

    .thumb-canvas-wrap canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .thumb-label {
      margin-top: 5px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
    }

    /* Page Nav Control Card (bottom of left panel) */
    #pageNavControlCard {
      padding: 8px 10px;
      background: var(--surface-soft);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    #pageStatusBanner {
      text-align: center;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 4px 6px;
      border-radius: 4px;
    }

    .nav-grid-row {
      display: grid;
      grid-template-columns: 46px 1fr 48px;
      align-items: center;
      gap: 5px;
    }

    .nav-grid-row label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .compact-input {
      width: 100%;
      height: 26px;
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
    }

    .compact-btn {
      height: 26px;
      padding: 0 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .compact-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Center Viewer Column */
    #centerViewerColumn {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--canvas-bg);
      position: relative;
    }

    /* Document Tab Bar */
    #docTabBar {
      display: flex;
      align-items: center;
      height: 34px;
      padding: 0 8px;
      gap: 4px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }

    #docTabBar::-webkit-scrollbar {
      display: none;
    }

    .doc-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 10px;
      border-radius: 5px 5px 0 0;
      border: 1px solid var(--border-soft);
      border-bottom: none;
      background: var(--surface-soft);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      margin-top: 5px;
      transition: all 0.14s;
      flex-shrink: 0;
    }

    .doc-tab.active {
      background: var(--surface);
      color: var(--primary);
      font-weight: 700;
      border-top: 2px solid var(--primary);
    }

    .doc-tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
    }

    .doc-tab-close:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* Context Tool Palette (Floating bar when an insert item is selected) */
    #contextToolPalette {
      position: absolute;
      top: 44px;
      right: 24px;
      z-index: 30;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1.5px solid var(--primary);
      border-radius: 7px;
      box-shadow: var(--shadow-lg);
      flex-wrap: wrap;
    }

    #contextToolPalette.visible {
      display: flex;
    }

    /* Canvas Viewport */
    #canvasViewport {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 26px;
      position: relative;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    #swipePageIndicator {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 38;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--primary);
      border: 1.5px solid var(--primary);
      box-shadow: var(--shadow-lg);
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    #swipePageIndicator.visible {
      opacity: 0.96;
      transform: translateX(-50%) translateY(-4px);
    }

    #pagesFlow { display: grid; gap: 16px; align-items: start; flex: none; padding-bottom: 20px; }
    .page-slot { position: relative; background: white; box-shadow: 0 6px 24px rgba(0,0,0,.18); flex: none; }
    .page-slot > canvas { display: block; width: 100%; height: 100%; }
    .page-preview-overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .page-preview-overlay * { pointer-events: none !important; }
    #pageViewMode { max-width: 112px; font-size: 11px; padding: 4px; border: 1px solid var(--border-soft); border-radius: 4px; background: var(--surface); color: var(--text); }
    #pageStage {
      position: relative;
      background: #FFFFFF;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
      border: 1px solid var(--border);
      transition: width 0.1s, height 0.1s;
    }

    #pdfRenderCanvas {
      display: block;
    }
    #pageStage[data-loading="true"]::after {
      content: "페이지 표시 중…"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: #687582; font-size: 12px; pointer-events: none;
    }

    #searchIndicator { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
    .search-hit-box { position:absolute; background:rgba(255,210,0,.46); outline:1px solid rgba(180,120,0,.7); }
    .search-text-layer { position:absolute; left:0; top:0; line-height:1; opacity:0; pointer-events:none;
      transform-origin:0 0; --scale-round-x:1px; --scale-round-y:1px;
      --text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size)); --min-font-size-inv:calc(1 / var(--min-font-size)); }
    .search-text-layer span { position:absolute; white-space:pre; transform-origin:0 0;
      font-size:calc(var(--text-scale-factor) * var(--font-height)); transform:rotate(var(--rotate, 0deg)) scaleX(var(--scale-x, 1)) scale(var(--min-font-size-inv)); }
    .search-text-layer[data-main-rotation="90"] { transform:rotate(90deg) translateY(-100%); }
    .search-text-layer[data-main-rotation="180"] { transform:rotate(180deg) translate(-100%, -100%); }
    .search-text-layer[data-main-rotation="270"] { transform:rotate(270deg) translateX(-100%); }
    #annotationOverlay {
      position: absolute;
      inset: 0;
      pointer-events: auto;
      overflow: hidden;
    }

    @font-face {
      font-family: "Sunrise Korean";
      src: url("/assets/fonts/DroidSansFallback.ttf") format("truetype");
      font-display: swap;
    }

    .overlay-item {
      font-family: "Sunrise Korean", "Noto Sans KR", sans-serif;
      position: absolute;
      cursor: pointer;
      padding: 4px 7px;
      border: 1.5px dashed transparent;
      border-radius: 3px;
      transition: border-color 0.12s, box-shadow 0.12s;
      user-select: none;
      white-space: pre-wrap;
      line-height: 1.3;
      touch-action: none;
    }

    .overlay-item:hover {
      border-color: var(--primary);
    }

    .overlay-item.selected {
      border: 2px solid var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 159, 0.22);
    }

    .overlay-item.move-mode {
      cursor: move;
    }

    .overlay-resize-handle {
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 11px;
      height: 11px;
      border-radius: 2px;
      background: var(--primary);
      border: 1.5px solid #FFFFFF;
      cursor: nwse-resize;
      display: none;
      z-index: 5;
    }

    .overlay-item.selected .overlay-resize-handle {
      display: block;
    }

    .inline-search-box {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 30px;
      padding: 0 6px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      flex-shrink: 0;
    }

    .inline-search-box:focus-within {
      border-color: var(--primary);
      background: var(--surface);
    }

    .inline-search-input {
      width: 115px;
      border: none;
      background: transparent;
      font-size: 12px;
      color: var(--text);
      outline: none;
    }

    .inline-search-count {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 32px;
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      .inline-search-box {
        display: none;
      }
    }

    .overlay-table {
      border-collapse: collapse;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.92);
    }

    .overlay-table td, .overlay-table th {
      border: 1px solid #263746;
      padding: 3px 6px;
      font-size: 11px;
      color: #1B2631;
    }

    /* Empty Workspace Dropzone */
    #emptyDropState {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 480px;
      margin: auto;
      padding: 32px 24px;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    /* Right Inspector Cards */
    .inspector-card {
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .inspector-card-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .quick-action-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      margin-bottom: 5px;
      border-radius: 5px;
      border: 1px solid var(--border-soft);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.14s;
      text-align: left;
    }

    .quick-action-btn i {
      width: 18px;
      text-align: center;
      color: var(--primary);
    }

    .quick-action-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .list-row-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 8px;
      border-radius: 5px;
      border: 1px solid var(--border-soft);
      background: var(--surface);
      margin-bottom: 5px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.12s;
    }

    .list-row-item:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    /* Bottom Operational Bar */
    #bottomOperationalBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 30px;
      padding: 0 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-muted);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    /* Mobile Bottom Navigation Bar (Shown on Mobile/Tablet <= 820px) */
    #mobileBottomNav {
      display: none;
      align-items: stretch;
      justify-content: space-around;
      height: 52px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 45;
      padding: 2px 4px;
    }

    .mobile-nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 10.5px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .mobile-nav-btn i {
      font-size: 15px;
      color: var(--primary);
    }

    .mobile-nav-btn.active, .mobile-nav-btn:active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .mobile-page-stepper {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      margin: 4px 2px;
    }

    #mobileDrawerBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 30, 0.45);
      z-index: 48;
      backdrop-filter: blur(1px);
    }

    #mobileDrawerBackdrop.open {
      display: block;
    }

    /* Unified Sunrise Modal System */
    #modalBackdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--modal-backdrop);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      backdrop-filter: blur(2px);
    }

    #modalBackdrop.open {
      display: flex;
    }

    .sunrise-modal {
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      background: var(--workspace-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: modalFadeIn 0.15s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .modal-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .dialog-info-box {
      padding: 9px 12px;
      border-radius: 6px;
      background: var(--info-box-bg);
      border: 1px solid var(--info-box-border);
      color: var(--info-box-text);
      font-size: 12px;
      line-height: 1.45;
    }

    .dialog-form-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      align-items: center;
      gap: 8px 10px;
    }

    .dialog-form-grid label {
      font-weight: 600;
      font-size: 12px;
      color: var(--text);
    }

    .dialog-input, .dialog-select, .dialog-textarea {
      width: 100%;
      padding: 6px 9px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12.5px;
    }

    .dialog-input:focus, .dialog-select:focus, .dialog-textarea:focus {
      outline: none;
      border: 2px solid var(--primary);
      padding: 5px 8px;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 11px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .modal-footer-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .dialog-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 32px;
      min-width: 74px;
      padding: 5px 14px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s;
    }

    .dialog-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .dialog-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .dialog-btn.primary:hover:not(:disabled) {
      background: var(--primary-hover);
      color: #FFFFFF;
    }

    .dialog-btn.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #FFFFFF;
    }

    /* Merge List Box inside Merge Modal */
    .merge-layout {
      display: grid;
      grid-template-columns: 1fr 140px;
      gap: 10px;
      min-height: 230px;
    }

    .merge-file-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      overflow-y: auto;
      max-height: 260px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .merge-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 5px;
      border: 1px solid var(--border-soft);
      background: var(--surface-soft);
      font-size: 12px;
      cursor: grab;
      transition: all 0.12s;
    }

    .merge-item.selected {
      background: var(--primary-selected);
      border-color: var(--primary);
      font-weight: 600;
    }

    .merge-item.drag-over {
      border-top: 2px solid var(--brand);
    }

    /* Toast Banner */
    #toastContainer {
      position: fixed;
      bottom: 58px;
      right: 16px;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      max-width: calc(100vw - 32px);
    }

    .sunrise-toast {
      padding: 9px 14px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      border-left: 4px solid var(--primary);
      box-shadow: var(--shadow-lg);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 1280px) {
      #workspacePanelMgrBtn span, #themeToggleLabel, #ribbonToggleLabel { display: none; }
      .top-pill-btn { padding: 0 8px; }
    }
    #placementHint { display: none; padding: 6px 10px; background: var(--primary-soft); color: var(--text); font-size: 12px; }
    #pageStage.placement-mode, #pageStage.placement-mode * { cursor: crosshair !important; }
    #zoomSlider { width: 90px; accent-color: var(--primary); }

    /* =====================================================================
       Mobile & Tablet Responsive Adjustments (<= 820px)
       ===================================================================== */
    @media (max-width: 820px) {
      #backendStatusBadge {
        display: none;
      }

      #themeToggleLabel, #ribbonToggleLabel {
        display: none;
      }

      .top-pill-btn {
        padding: 0 8px;
      }

      /* Side panes turn into slide-over drawers on mobile so the PDF canvas has 100% width */
      #leftNavigationPane, #rightInspectorPane {
        position: fixed;
        top: 44px;
        bottom: 52px;
        z-index: 60;
        width: min(84vw, 310px) !important;
        min-width: min(84vw, 310px) !important;
        box-shadow: var(--shadow-lg);
      }

      #leftNavigationPane {
        left: 0;
        transform: translateX(0);
      }

      #leftNavigationPane.collapsed {
        transform: translateX(-105%);
      }

      #rightInspectorPane {
        right: 0;
        transform: translateX(0);
      }

      #rightInspectorPane.collapsed {
        transform: translateX(105%);
      }

      #canvasViewport {
        padding: 10px 14px;
      }

      .panel-edge-handle {
        width: 20px;
        height: 58px;
        opacity: 0.92;
      }

      #bottomOperationalBar {
        display: none;
      }

      #mobileBottomNav {
        display: flex;
      }

      .ribbon-surface {
        min-height: 86px;
        padding: 4px 6px;
      }

      .cmd-btn {
        width: 80px;
        min-width: 80px;
        height: auto;
        min-height: 60px;
      }

      .dialog-form-grid {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .merge-layout {
        grid-template-columns: 1fr;
      }

      .merge-btn-col {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px !important;
      }

      #contextToolPalette {
        top: 40px;
        left: 10px;
        right: 10px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="appShell">
    <!-- Hidden File Inputs for Browser File Operations -->
    <input type="file" id="openPdfInput" accept=".pdf,application/pdf" multiple style="display:none" />
    <input type="file" id="mergePdfInput" accept=".pdf,application/pdf" multiple style="display:none" />
    <input type="file" id="insertPdfInput" accept=".pdf,application/pdf" style="display:none" />
    <input type="file" id="imageToPdfInput" accept="image/png,image/jpeg" multiple style="display:none" />
    <input type="file" id="attachmentInput" multiple style="display:none" />

    <!-- Top Persistent Workspace Command Bar -->
    <header id="workspaceCommandBar">
      <div class="brand-box">
        <span class="brand-title">SUNRISE</span>
        <span class="brand-sub">PDF EDITOR WEB</span>
      </div>

      <button type="button" class="quick-icon-btn" id="quickOpenBtn" title="PDF 열기 (Ctrl+O)">
        <i class="fa-solid fa-folder-open"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickSaveBtn" title="다른 이름으로 저장 (Ctrl+Shift+S)">
        <i class="fa-solid fa-floppy-disk"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickUndoBtn" title="실행 취소 (Ctrl+Z)">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickRedoBtn" title="다시 실행 (Ctrl+Y)">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickPrevBtn" title="이전 페이지 (PgUp)">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickNextBtn" title="다음 페이지 (PgDown)">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickZoomOutBtn" title="축소 (Ctrl+-)">
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickZoomInBtn" title="확대 (Ctrl+=)">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickFitWidthBtn" title="폭맞춤 (Ctrl+0)">
        <i class="fa-solid fa-arrows-left-right"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickFitPageBtn" title="쪽맞춤 (Ctrl+1)">
        <i class="fa-solid fa-expand"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickSearchBtn" title="문서 검색 대화상자 (Ctrl+F)">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <div class="inline-search-box" title="빠른 본문/주석 검색 (Enter: 다음 결과)">
        <input type="text" id="inlineSearchInput" class="inline-search-input" placeholder="빠른 검색 (Ctrl+F)" />
        <span id="inlineSearchCount" class="inline-search-count">-</span>
        <button type="button" class="quick-icon-btn" id="inlineSearchPrevBtn" style="width:22px;height:22px" title="이전 검색 결과">
          <i class="fa-solid fa-chevron-up" style="font-size:10px"></i>
        </button>
        <button type="button" class="quick-icon-btn" id="inlineSearchNextBtn" style="width:22px;height:22px" title="다음 검색 결과">
          <i class="fa-solid fa-chevron-down" style="font-size:10px"></i>
        </button>
        <button type="button" class="quick-icon-btn" id="highlightSearchBtn" style="width:24px;height:22px" title="현재 검색 결과에 PDF 형광펜 추가" aria-label="현재 검색 결과에 PDF 형광펜 추가">
          <i class="fa-solid fa-highlighter" style="font-size:11px"></i>
        </button>
      </div>

      <div class="doc-title-area">
        <span id="workspaceDocumentTitle">문서를 불러오는 중...</span>
        <span id="workspaceDocumentMeta"></span>
      </div>


      <button type="button" class="top-pill-btn" id="workspacePanelMgrBtn" title="좌/우측 패널 추가 및 삭제 관리">
        <i class="fa-solid fa-table-columns"></i>
        <span>패널 관리</span>
      </button>

      <button type="button" class="top-pill-btn" id="workspaceThemeToggle" title="라이트/다크 모드 전환 (Ctrl+Shift+L)">
        <i class="fa-solid fa-sun" id="themeToggleIcon"></i>
        <span id="themeToggleLabel">라이트 모드</span>
      </button>

      <button type="button" class="top-pill-btn" id="workspaceRibbonToggle" title="상단 리본 표시/숨기기 (Ctrl+F1)">
        <i class="fa-solid fa-chevron-up" id="ribbonToggleIcon"></i>
        <span id="ribbonToggleLabel">리본 숨기기</span>
      </button>
    </header>

      <!-- General PDF ribbon (specialized domain functions excluded) -->
    <nav id="mainRibbon" aria-label="주 기능 리본">
      <div class="ribbon-tabs" id="ribbonTabHeader"></div>
      <div class="ribbon-surface" id="ribbonCommandSurface"></div>
    </nav>

    <!-- Mobile Backdrop for Slide-Over Side Panels -->
    <div id="mobileDrawerBackdrop"></div>

    <!-- Main 3-Column Workspace -->
    <main id="mainWorkspace">
      <!-- Left Navigation Panel (Collapsible & Customizable Tabs) -->

    function escapeHtml(str) {

    }

    async function inspectSavedPdf(bytes) {
      if (!window.PDFLib) throw new Error("PDF 검사 엔진을 불러오지 못했습니다.");
      validatePdfByteLength(bytes.byteLength);
      const pdf = await window.PDFLib.PDFDocument.load(bytes);
      const pages = pdf.getPages();
      if (!pages.length) throw new Error("페이지가 없는 PDF입니다.");
      const orientation = { portrait: 0, landscape: 0, square: 0 };
      for (const page of pages) {
        const box = page.getCropBox();
        let { width, height } = box;
        const rotation = ((page.getRotation().angle % 360) + 360) % 360;
        if (![0, 90, 180, 270].includes(rotation) || width <= 0 || height <= 0) throw new Error("확인할 수 없는 페이지 크기 또는 회전값입니다.");
        if (rotation === 90 || rotation === 270) [width, height] = [height, width];
        if (Math.abs(width - height) < 0.01) orientation.square++;
        else orientation[width > height ? "landscape" : "portrait"]++;
      }
      return { bytes: bytes.byteLength, pageCount: pages.length, orientation };
    }

          input.addEventListener("change", async () => {
            const current = ++request, file = input.files?.[0];

            if (!file) { status.textContent = "검사할 파일을 선택하세요."; return; }

              const result = await window.SunrisePdfQuality.inspect(bytes, {
                PDFLib: window.PDFLib, pdfjsLib: window.pdfjsLib, maxPages: 120,

                }
              });
              if (current !== request || !input.isConnected) return;
              const o = result.orientation;
              status.textContent = `검사 완료(판독 가능한 범위): ${(result.bytes / 1048576).toFixed(2)} MiB, ${result.pageCount}쪽.
                세로 ${o.portrait}·가로 ${o.landscape}·정사각형 ${o.square}쪽,
                내용 검사 ${result.scannedPages}쪽, 빈 페이지 후보 ${result.blankCandidates}쪽,
                검토 필요 ${result.reviews}건, 구조 오류 ${result.errors}건.`;
              const heading = document.createElement("p");
              heading.textContent = result.errors ? "구조 오류가 확인되었습니다. 제출 전 수정해야 합니다." :
                result.reviews ? "자동 검사에서 확인이 필요한 항목이 있습니다." :
                "검사 범위에서 구조 오류·확인 항목이 발견되지 않았습니다. 제출 적합성 보증은 아닙니다.";
              results.appendChild(heading);
              const list = document.createElement("ol");
              for (const item of result.issues) {
                const row = document.createElement("li");
                row.textContent = `[${item.severity === "error" ? "오류" : "확인 필요"}] ${item.page ? item.page + "쪽 · " : ""}${item.message}`;
                list.appendChild(row);
              }
              if (result.issues.length) results.appendChild(list);
              const details = document.createElement("p");
              details.textContent = `양식 필드 ${result.formFields}개(비어 있는 필수란 ${result.emptyRequired}개),
                확인한 글꼴 리소스 ${result.fontResources}개. ${result.limitations}`;
              results.appendChild(details);
            } catch (error) {
              if (current !== request || !input.isConnected) return;
              console.warn("저장 PDF 품질 검사 실패", error?.name || "error");
              status.textContent = "검사를 완료하지 못했습니다: " + String(error?.message || "암호·파일 구조·크기를 확인하세요.");
            }
          });
        },
      });
    }

    let pendingSaveUrl = null;
    function closeModal() {
      if (pendingSaveUrl) {
        const url = pendingSaveUrl;
        pendingSaveUrl = null;
        // Downloads may start asynchronously after the user clicks the link.
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    function downloadBytes(bytes, filename, mime = "application/pdf") {
      const blob = new Blob([bytes], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    function syncSidePaneDomState() {
      const leftPane = document.getElementById("leftNavigationPane");

      const rightIcon = document.getElementById("rightPanelEdgeIcon");

      const rightHandle = document.getElementById("rightPanelEdgeToggle");
      const backdrop = document.getElementById("mobileDrawerBackdrop");

      const leftCollapsed = state.leftPaneCollapsed || state.leftPanels.length === 0;
      const rightCollapsed = state.rightPaneCollapsed || state.rightPanels.length === 0;

      leftPane.classList.toggle("collapsed", leftCollapsed);
      rightPane.classList.toggle("collapsed", rightCollapsed);

      leftIcon.className = leftCollapsed ? "fa-solid fa-chevron-right" : "fa-solid fa-chevron-left";
      rightIcon.className = rightCollapsed ? "fa-solid fa-chevron-left" : "fa-solid fa-chevron-right";
      leftHandle.title = leftCollapsed ? "좌측 탐색 패널 열기" : "좌측 탐색 패널 닫기";
      rightHandle.title = rightCollapsed ? "우측 작업 패널 열기" : "우측 작업 패널 닫기";

      const mobLeftBtn = document.getElementById("mobLeftPaneBtn");
      const mobRightBtn = document.getElementById("mobRightPaneBtn");
      if (mobLeftBtn) mobLeftBtn.classList.toggle("active", !leftCollapsed);
      if (mobRightBtn) mobRightBtn.classList.toggle("active", !rightCollapsed);

      if (isMobileViewport() && (!leftCollapsed || !rightCollapsed)) {
        backdrop.classList.add("open");
      } else {
        backdrop.classList.remove("open");
      }
    }

      if (state.leftPanels.length === 0) {
        state.leftPanels = ["pages"];
        state.activeLeftTab = "pages";

        typeof forceCollapsed === "boolean" ? forceCollapsed : !state.leftPaneCollapsed;

    async function createSamplePdfDocument(titleText, codePrefix, pageSpecs) {
      if (window.PDFLib) {

        const pdfDoc = await PDFDocument.create();
        pdfDoc.setTitle(titleText);

        pdfDoc.setSubject("Sunrise PDF Editor Browser Sample");

        const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
        const bold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

        for (let i = 0; i < pageSpecs.length; i++) {
          const spec = pageSpecs[i];
          const page = pdfDoc.addPage([595.28, 841.89]);
          const { width, height } = page.getSize();

          page.drawRectangle({
            x: 36,
            y: height - 92,
            width: width - 72,
            height: 52,
            color: rgb(0.12, 0.43, 0.62),

              font: idx === 0 ? bold : font,

            x: 115,

            x: 310,

      return new Uint8Array();
    }

    async function createNewBlankDocument() {
      if (!window.PDFLib || !window.pdfjsLib) {
        showToast("PDF 엔진을 불러오지 못했습니다. 페이지를 새로고침해 주세요.", "fa-circle-exclamation");

      }

      pdfDoc.setAuthor("Sunrise PDF Editor Web");

      doc.dirty = true;

    // =========================================================================
    // Document Model & PDF Loading
    // =========================================================================
    let docIdCounter = 1;
    let overlayIdCounter = 1;

    function pdfJsLoadOptions(bytes) {
      return { data: bytes.slice(0), cMapUrl: "/assets/pdfjs/cmaps/", cMapPacked: true,
        standardFontDataUrl: "/assets/pdfjs/standard_fonts/", wasmUrl: "/assets/pdfjs/wasm/",
        iccUrl: "/assets/pdfjs/iccs/", isEvalSupported: false };
    }

    async function parsePageCountAndMeta(bytes) {
      if (!window.PDFLib || !window.pdfjsLib) throw new Error("PDF 엔진을 불러오지 못했습니다.");
      let pdfDoc;
      try {
        // Encrypted documents cannot safely be edited by pdf-lib.
        pdfDoc = await window.PDFLib.PDFDocument.load(bytes);
      } catch (error) {
        throw new Error("PDF를 편집할 수 없습니다. 손상되었거나 암호로 보호된 파일인지 확인해 주세요.");
      }
      if (pdfDoc.getPageCount() < 1) throw new Error("페이지가 없는 PDF입니다.");
      const metadata = {
        title: pdfDoc.getTitle() || "", author: pdfDoc.getAuthor() || "",
        subject: pdfDoc.getSubject() || "", keywords: pdfDoc.getKeywords() || "",
      };
      const loadingTask = window.pdfjsLib.getDocument(pdfJsLoadOptions(bytes));
      let pdfJsDoc;
      try { pdfJsDoc = await loadingTask.promise; }
      catch (error) { throw new Error("PDF를 표시할 수 없습니다. 손상되었거나 지원하지 않는 파일입니다."); }
      const pageCount = pdfJsDoc.numPages;
      const pageSizes = [];
      const pageTexts = [];
      let attachments = [];
      let attachmentsReadable = true;
      const readAttachments = (async () => {
        try {
          const embedded = await pdfJsDoc.getAttachments();
          attachments = Object.values(embedded || {}).map(item => ({
            name:item.filename, bytes:new Uint8Array(item.content), type:"", isNew:false,
          }));
        } catch (error) {
          attachmentsReadable = false;
          console.warn("Unable to read PDF attachments", error);
        }
      })();
      // Bound concurrent page-metadata requests while preserving the page order.
      let nextPage = 1, pageError = null;
      const loadPageSizes = async () => {
        while (!pageError && nextPage <= pageCount) {
          const pageNumber = nextPage++;
          try {
            const page = await pdfJsDoc.getPage(pageNumber);
            const viewport = page.getViewport({scale:1});
            if (!Number.isFinite(viewport.width) || !Number.isFinite(viewport.height) || viewport.width <= 0 || viewport.height <= 0)
              throw new Error(`잘못된 페이지 크기 (${pageNumber}쪽)`);
            pageSizes[pageNumber-1] = {width:viewport.width, height:viewport.height};
            pageTexts[pageNumber-1] = null;
          } catch (error) { pageError = error; }
        }
      };
      await Promise.all([readAttachments, ...Array.from({length:Math.min(4,pageCount)}, () => loadPageSizes())]);
      if (pageError) {
        try { await pdfJsDoc.destroy(); } catch (error) { console.warn("PDF cleanup failed",error); }
        throw new Error(`PDF 페이지 정보를 읽지 못했습니다: ${pageError.message || pageError}`);
      }
      return { pageCount, pageSizes, metadata, pdfJsDoc, pageTexts, attachments, attachmentsReadable };
    }

    // Read the original outline without changing its structure in the PDF.
    async function readPdfOutline(reader) {
      const outline = await reader.getOutline();
      const rows = [], pending = (outline || []).map((item, index) => ({item, depth: 0, path: [index], titles: [String(item.title || "")]})).reverse();
      while (pending.length) {
        if (rows.length >= 10000) throw new Error("북마크가 너무 많아 목록을 표시할 수 없습니다.");
        const {item, depth, path, titles} = pending.pop();
        rows.push({title: String(item.title || "제목 없음"), dest: item.dest, depth, path, titles});
        for (let i = (item.items || []).length - 1; i >= 0; i--)
          pending.push({item: item.items[i], depth: depth + 1, path: [...path, i],
            titles: [...titles, String(item.items[i].title || "")]});
      }
      return rows;
    }

    // Change the selected outline item only. Every ancestor title and sibling link must
    // match the outline PDF.js displayed; otherwise leave the PDF untouched.
    function renamePdfOutline(pdfDoc, path, titles, newTitle, displayedRows, remove = false, newPage = null, actionIndex = 0) {
      const {PDFName, PDFDict, PDFRef, PDFString, PDFHexString, PDFNumber} = window.PDFLib;
      const n = PDFName.of, ctx = pdfDoc.context;
      if (!Array.isArray(path) || !path.length || path.length !== titles.length || (!remove && newPage === null && !newTitle.trim()))
        throw new Error("북마크 위치 또는 이름이 올바르지 않습니다.");
      let parentRef = pdfDoc.catalog.get(n("Outlines"));
      if (!(parentRef instanceof PDFRef)) throw new Error("북마크 구조를 안전하게 확인할 수 없습니다.");
      let parent = ctx.lookup(parentRef);
      if (!(parent instanceof PDFDict)) throw new Error("북마크 구조를 안전하게 확인할 수 없습니다.");
      // Compare the complete displayed tree, not only the selected title: PDF.js
      // may omit malformed nodes, so matching a single path could target a peer.
      if (!Array.isArray(displayedRows)) throw new Error("표시된 북마크 목록을 확인할 수 없습니다.");
      const visited = new Set(), pending = [], nodes = [];
      const first = parent.get(n("First")), last = parent.get(n("Last"));
      if (Boolean(first) !== Boolean(last)) throw new Error("북마크 연결이 올바르지 않습니다.");
      if (first) pending.push({ref:first, parent, parentRef, previous:null, path:[0]});
      let rowIndex = 0;
      while (pending.length) {
        if (rowIndex >= 10000) throw new Error("북마크가 너무 많습니다.");
        const node = pending.pop(), ref = node.ref;
        if (!(ref instanceof PDFRef) || visited.has(ref.toString())) throw new Error("북마크 연결이 올바르지 않습니다.");
        visited.add(ref.toString());
        const item = ctx.lookup(ref), row = displayedRows[rowIndex++];
        if (!(item instanceof PDFDict) || String(item.get(n("Parent"))) !== String(node.parentRef) ||
            (node.previous ? String(item.get(n("Prev"))) !== String(node.previous) : Boolean(item.get(n("Prev")))))
          throw new Error("북마크 연결이 올바르지 않습니다.");
        const text = item.lookupMaybe(n("Title"), PDFString, PDFHexString);
        if (!text || !row || text.decodeText() !== row.titles[row.titles.length - 1] ||
            JSON.stringify(node.path) !== JSON.stringify(row.path))
          throw new Error("표시된 북마크와 원본 목차가 일치하지 않습니다.");
        nodes.push({item, ref, path:node.path});
        const next = item.get(n("Next")), child = item.get(n("First")), childLast = item.get(n("Last"));
        if (Boolean(child) !== Boolean(childLast) || (!next && String(node.parent.get(n("Last"))) !== String(ref)))
          throw new Error("북마크 연결이 올바르지 않습니다.");
        if (next) {
          const nextPath = node.path.slice(); nextPath[nextPath.length - 1]++;
          pending.push({ref:next, parent:node.parent, parentRef:node.parentRef, previous:ref, path:nextPath});
        }
        if (child) pending.push({ref:child, parent:item, parentRef:ref, previous:null, path:[...node.path, 0]});
      }
      if (rowIndex !== displayedRows.length) throw new Error("표시된 북마크와 원본 목차가 일치하지 않습니다.");
      if (remove) {
        // Validate all visible-descendant counts before changing any links.
        const byPath = new Map(nodes.map(node => [JSON.stringify(node.path), node]));
        const expected = new Map();
        for (let i = nodes.length - 1; i >= 0; i--) {
          const node = nodes[i], key = JSON.stringify(node.path);
          const children = expected.get(key) || 0;
          const countObject = node.item.get(n("Count"));
          if (countObject && !(countObject instanceof PDFNumber)) throw new Error("북마크 개수를 확인할 수 없습니다.");
          const count = countObject?.asNumber() || 0;
          if (!Number.isSafeInteger(count) || Math.abs(count) !== children)
            throw new Error("북마크 개수가 목차 구조와 일치하지 않습니다.");
          const parentPath = JSON.stringify(node.path.slice(0, -1));
          expected.set(parentPath, (expected.get(parentPath) || 0) + 1 + (count > 0 ? count : 0));
        }
        const rootCount = parent.get(n("Count"));
        if (!(rootCount instanceof PDFNumber) || rootCount.asNumber() !== (expected.get("[]") || 0))
          throw new Error("북마크 개수가 목차 구조와 일치하지 않습니다.");
        const target = byPath.get(JSON.stringify(path));
        if (!target || target.path.length !== titles.length ||
            titles.some((title, i) => displayedRows.find(row => JSON.stringify(row.path) === JSON.stringify(path.slice(0, i + 1)))?.titles[i] !== title))
          throw new Error("표시된 북마크와 원본 목차가 일치하지 않습니다.");
        const item = target.item, prev = item.get(n("Prev")), next = item.get(n("Next"));
        const parentNode = path.length === 1 ? parent : byPath.get(JSON.stringify(path.slice(0, -1))).item;
        if (prev) { if (next) ctx.lookup(prev).set(n("Next"), next); else ctx.lookup(prev).delete(n("Next")); }
        else if (next) parentNode.set(n("First"), next); else parentNode.delete(n("First"));
        if (next) { if (prev) ctx.lookup(next).set(n("Prev"), prev); else ctx.lookup(next).delete(n("Prev")); }
        else if (prev) parentNode.set(n("Last"), prev); else parentNode.delete(n("Last"));
        const targetCount = item.get(n("Count"))?.asNumber() || 0;
        let delta = 1 + (targetCount > 0 ? targetCount : 0);
        for (let depth = path.length - 1; depth >= 0 && delta; depth--) {
          const ancestor = depth === 0 ? parent : byPath.get(JSON.stringify(path.slice(0, depth))).item;
          const old = ancestor.get(n("Count")).asNumber();
          const nextCount = Math.abs(old) - delta;
          if (depth > 0 && nextCount === 0) ancestor.delete(n("Count"));
          else ancestor.set(n("Count"), PDFNumber.of(old < 0 ? -nextCount : nextCount));
          if (old < 0) delta = 0;
        }
        return;
      }
      const seen = new Set();
      for (let depth = 0; depth < path.length; depth++) {
        const index = path[depth];
        if (!Number.isSafeInteger(index) || index < 0 || index >= 10000) throw new Error("북마크 위치가 올바르지 않습니다.");
        let ref = parent.get(n("First")), previous = null, item;
        for (let i = 0; i <= index; i++) {
          if (!(ref instanceof PDFRef) || seen.has(ref.toString())) throw new Error("북마크 연결이 올바르지 않습니다.");
          seen.add(ref.toString()); item = ctx.lookup(ref);
          if (!(item instanceof PDFDict) || String(item.get(n("Parent"))) !== String(parentRef) ||
              (previous ? String(item.get(n("Prev"))) !== String(previous) : Boolean(item.get(n("Prev")))))
            throw new Error("북마크 연결이 올바르지 않습니다.");
          if (i < index) { previous = ref; ref = item.get(n("Next")); }
        }
        const title = item.lookupMaybe(n("Title"), PDFString, PDFHexString);
        if (!title || title.decodeText() !== titles[depth]) throw new Error("표시된 북마크와 원본 목차가 일치하지 않습니다.");
        if (depth === path.length - 1) {
          if (newPage === null) item.set(n("Title"), PDFHexString.fromText(newTitle.trim()));
          else {
            const pages = pdfDoc.getPages();
            if (!Number.isInteger(newPage) || newPage < 0 || newPage >= pages.length) throw new Error("북마크 페이지가 올바르지 않습니다.");
            const actionRef = item.get(n("A")), existingDest = item.get(n("Dest"));
            const dest = ctx.obj([pages[newPage].ref, n("Fit")]);
            if (actionRef) {
              const action = ctx.lookup(actionRef);
              if (existingDest || !(action instanceof PDFDict) || action.get(n("S")) !== n("GoTo") || !action.get(n("D")))
                throw new Error("이 북마크의 동작은 페이지를 안전하게 변경할 수 없습니다.");
              // Enumerate the chain in execution order and copy only the selected
              // path. This isolates actions shared by other bookmarks or branches.
              const { PDFArray } = window.PDFLib;
              const active = new WeakSet(), stack = [{value:action, path:[], exit:false}], choices = [];
              while (stack.length) {
                const entry = stack.pop(), node = ctx.lookup(entry.value);
                if (!(node instanceof PDFDict)) throw new Error("북마크 동작 연결이 올바르지 않습니다.");
                if (entry.exit) { active.delete(node); continue; }
                if (active.has(node)) throw new Error("순환하는 북마크 동작은 수정할 수 없습니다.");
                if (choices.length >= 10000 || node.get(n("S")) !== n("GoTo") || !node.get(n("D")))
                  throw new Error("이 북마크의 동작은 페이지를 안전하게 변경할 수 없습니다.");
                choices.push({node, path:entry.path});
                active.add(node); stack.push({value:node, exit:true});
                const nextRef = node.get(n("Next"));
                if (nextRef) {
                  const next = ctx.lookup(nextRef);
                  if (next instanceof PDFArray) {
                    if (!next.size() || next.size() > 10000) throw new Error("북마크 동작 연결이 올바르지 않습니다.");
                    for (let i = next.size() - 1; i >= 0; i--)
                      stack.push({value:next.get(i), path:[...entry.path,{node, array:next, index:i}], exit:false});
                  } else stack.push({value:nextRef, path:[...entry.path,{node, array:null}], exit:false});
                }
              }
              if (!Number.isSafeInteger(actionIndex) || actionIndex < 0 || actionIndex >= choices.length)
                throw new Error(`이동 동작 순번은 1~${choices.length} 범위여야 합니다.`);
              const selected = choices[actionIndex];
              let copy = selected.node.clone(); copy.set(n("D"), dest);
              for (let i = selected.path.length - 1; i >= 0; i--) {
                const edge = selected.path[i], parentCopy = edge.node.clone();
                if (edge.array) { const list = edge.array.clone(); list.set(edge.index, copy); parentCopy.set(n("Next"), list); }
                else parentCopy.set(n("Next"), copy);
                copy = parentCopy;
              }
              item.set(n("A"), copy);
            } else {
              if (actionIndex !== 0) throw new Error("이 북마크에는 이동 동작이 하나뿐입니다.");
              item.set(n("Dest"), dest);
            }
          }
        } else { parent = item; parentRef = ref; }
      }
    }

    async function renameExistingBookmark(doc, reader, bookmark, title, rows, remove = false, newPage = null, actionIndex = 0) {
      if (doc.operationBusy || doc.pdfJsDoc !== reader || activeDoc() !== doc) return;
      const bytes = doc.bytes;
      doc.operationBusy = true;
      let info;
      try {
        const pdf = await window.PDFLib.PDFDocument.load(bytes);
        renamePdfOutline(pdf, bookmark.path, bookmark.titles, title, rows, remove, newPage, actionIndex);
        const nextBytes = await pdf.save();
        info = await parsePageCountAndMeta(nextBytes);
        if (doc.bytes !== bytes || doc.pdfJsDoc !== reader || activeDoc() !== doc) {
          await info.pdfJsDoc.destroy(); info = null;
          showToast("문서가 변경되어 북마크 수정을 취소했습니다.", "fa-circle-exclamation"); return;
        }
        saveUndoSnapshot(doc, remove ? "기존 북마크 삭제" : newPage === null ? "기존 북마크 이름 변경" : "기존 북마크 페이지 변경");
        doc.bytes = nextBytes;
        await reloadDocPdfJs(doc, {info}); info = null;
        await refreshAllViews();
        showToast(remove ? "북마크를 삭제했습니다. PDF를 저장해 주세요." : newPage === null ? "북마크 이름을 변경했습니다. PDF를 저장해 주세요." : "북마크 페이지를 변경했습니다. PDF를 저장해 주세요.", "fa-bookmark");
      } catch (error) {
        if (info?.pdfJsDoc && doc.pdfJsDoc !== info.pdfJsDoc) await info.pdfJsDoc.destroy();
        console.warn("Unable to modify PDF bookmark", error);
        showToast(`북마크를 ${remove ? "삭제" : "변경"}하지 못했습니다: ${error.message || error}`, "fa-circle-exclamation");
      } finally { doc.operationBusy = false; }
    }

    async function outlinePage(reader, dest) {
      if (!dest) return null;
      const resolved = typeof dest === "string" ? await reader.getDestination(dest) : dest;
      if (!Array.isArray(resolved) || !resolved.length) return null;
      const page = typeof resolved[0] === "number" ? resolved[0] : await reader.getPageIndex(resolved[0]);
      return Number.isInteger(page) && page >= 0 && page < reader.numPages ? page : null;
    }

    // Suggest bookmarks only from text that already exists as PDF objects.
    // Each destination is its own source page, so there is no guessing of
    // printed page numbers or implicit OCR of scanned images.
    async function createTextLayerBookmarks(doc) {
      if (!doc || doc.operationBusy) return;
      const reader = doc.pdfJsDoc, sourceBytes = doc.bytes;
      const valid = () => activeDoc() === doc && doc.pdfJsDoc === reader && doc.bytes === sourceBytes;
      if (!window.SunriseAutoBookmarks?.suggestBookmarks) {
        showToast("북마크 제목 분석 기능을 불러오지 못했습니다.", "fa-circle-exclamation"); return;
      }
      const limit = Math.min(doc.pageCount, 150), pages = [];
      doc.operationBusy = true;
      try {
        for (let i = 0; i < limit; i++) {
          if (!valid()) return;
          try {
            const page = await reader.getPage(i + 1);
            const content = await page.getTextContent();
            if (!valid()) return;
            pages.push({pageIndex: i, items: content.items || []});
          } catch (error) {
            if (!valid()) return;
            console.warn("Bookmark text layer unavailable", i + 1, error?.name || "error");
            pages.push({pageIndex: i, items: []});
          }
        }
        const existing = new Set(doc.bookmarks.map(item => item.page));
        const proposed = window.SunriseAutoBookmarks.suggestBookmarks(pages, 80)
          .filter(item => !existing.has(item.page));
        if (!proposed.length) {
          showToast("확인 가능한 텍스트 제목을 찾지 못했습니다. 스캔 이미지에는 OCR을 적용하지 않습니다.", "fa-circle-info");
          return;
        }
        const samples = proposed.slice(0, 6).map(item => (item.page + 1) + "쪽: " + item.title).join("\n");
        const warning = doc.pageCount > limit ? "\n(처음 " + limit + "쪽만 분석했습니다.)" : "";
        if (!window.confirm("기존 PDF 텍스트를 바탕으로 북마크 " + proposed.length +
          "개를 제안합니다. 제목 인식 결과를 확인해 주세요.\n\n" + samples + warning +
          "\n\n실제 목차의 페이지 번호를 추정하지 않고 해당 텍스트가 있는 쪽을 연결합니다. 추가할까요?")) return;
        if (!valid()) {
          showToast("문서가 변경되어 북마크 생성을 취소했습니다.", "fa-circle-exclamation"); return;
        }
        saveUndoSnapshot(doc, "기존 텍스트 제목 북마크 생성");
        const nonce = Date.now();
        doc.bookmarks.push(...proposed.map((item, index) => ({
          id: "bm_heading_" + nonce + "_" + index, title: item.title, page: item.page
        })));
        ensureLeftPanelOpen("bookmarks");
        showToast("텍스트 제목 북마크 " + proposed.length + "개를 추가했습니다. PDF 저장 후 재열어 확인해 주세요.", "fa-bookmark");
      } catch (error) {
        console.warn("Text-layer bookmark generation failed", error?.name || "error");
        showToast("자동 북마크를 만들지 못했습니다. 원본 문서는 변경되지 않았습니다.", "fa-circle-exclamation");
      } finally {
        doc.operationBusy = false;
      }
    }

    async function ensurePageTexts(doc) {
      if (doc.pageTexts.every(text => text !== null)) return true;
      const reader = doc.pdfJsDoc, texts = doc.pageTexts;
      if (doc.textExtraction?.reader === reader) return doc.textExtraction.promise;
      const promise = (async () => {
        for (let i = 0; i < texts.length; i++) {
          if (doc.pdfJsDoc !== reader) return false;
          if (texts[i] !== null) continue;
          try {
            const page = await reader.getPage(i + 1);
            const content = await page.getTextContent();
            if (doc.pdfJsDoc !== reader) return false;
            texts[i] = content.items.map(item => item.str || "").join(" ");
          } catch (error) {
            if (doc.pdfJsDoc !== reader) return false;
            console.warn(`Unable to extract text from page ${i + 1}`, error);
            texts[i] = "";
          }
        }
        return true;
      })();
      doc.textExtraction = { reader, promise };
      try { return await promise; }
      finally { if (doc.textExtraction?.promise === promise) doc.textExtraction = null; }
    }

    function validatePdfByteLength(length) {
      if (!Number.isSafeInteger(length) || length < 0 || length > 50 * 1024 * 1024)
        throw new Error("50MB 이하 PDF를 선택해 주세요.");
    }

    async function readPdfInputFile(file) {
      validatePdfByteLength(file.size);
      const bytes = new Uint8Array(await file.arrayBuffer());
      validatePdfByteLength(bytes.byteLength);
      return bytes;
    }

    async function openPdfFromBytes(fileName, uint8Bytes, options = { switchActive: true }) {
      const originalBytes = uint8Bytes instanceof Uint8Array ? uint8Bytes : new Uint8Array(uint8Bytes);
      if (!window.PDFLib || !window.pdfjsLib) throw new Error("PDF 편집 엔진을 불러오지 못했습니다. 페이지를 새로고침해 주세요.");
      if (originalBytes.byteLength < 8 || new TextDecoder("ascii").decode(originalBytes.slice(0, 8)).indexOf("%PDF-") !== 0) {
        throw new Error("유효한 PDF 파일이 아닙니다.");
      }
      validatePdfByteLength(originalBytes.byteLength);
      let restored;
      try { restored = await window.SunriseEditState.restore(originalBytes, window.PDFLib); }
      catch (error) { throw new Error("PDF를 편집할 수 없습니다. 손상되었거나 암호로 보호된 파일인지 확인해 주세요."); }
      const bytes = restored.bytes;
      const info = await parsePageCountAndMeta(bytes);
      if (!info.pdfJsDoc) throw new Error("PDF 문서를 읽지 못했습니다. 손상되거나 암호로 보호된 파일일 수 있습니다.");

      const newDoc = {
        id: `doc_${docIdCounter++}`,
        name: fileName,
        bytes: bytes,
        pdfJsDoc: info.pdfJsDoc,
        pageCount: info.pageCount,
        pageSizes: info.pageSizes,
        pageTexts: info.pageTexts,
        currentPage: 0,
        selectedPages: new Set([0]),
        zoom: 1.0,
        fitMode: "page",
        dirty: false,
        metadata: info.metadata,
        bookmarks: [],
        attachments: info.attachments,
        attachmentsReadable: info.attachmentsReadable,
        overlays: restored.overlays.map((item) => ({ ...item, id: `ov_${overlayIdCounter++}` })),
        editRestorationBlocked: restored.warning,
        history: [`문서 열기: ${fileName} (${info.pageCount}쪽)`],
        undoStack: [],
        redoStack: [],
      };

      if (options && options.isSample) {
        newDoc.overlays.push({
          id: `ov_${overlayIdCounter++}`,
          pageIndex: 0,
          type: "Stamp",
          text: "검토완료 (APPROVED)",
          x: 380,
          y: 105,
          width: 155,
          height: 36,
          fontSize: 13,
          color: "#1F6F9F",
          bgColor: "rgba(220, 234, 245, 0.88)",
          opacity: 0.95,
        });
      }

      state.docs.push(newDoc);
      addRecentFile(fileName, info.pageCount, originalBytes);

      if (restored.warning) showToast("이 PDF의 저장된 편집 항목을 안전하게 복원하지 못했습니다. 원본 표시는 유지됩니다.", "fa-circle-exclamation");

      if (options.switchActive !== false) {
        await setActiveDocument(state.docs.length - 1);
      } else {
        renderDocTabs();
        updateCommandStates();
      }
      return newDoc;
    }

    function addRecentFile(name, pageCount, bytes) {
      state.recentFiles = state.recentFiles.filter((r) => r.name !== name);
      state.recentFiles.unshift({
        name,
        pageCount,
        openedAt: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
        bytes: bytes.slice(0),
      });
      if (state.recentFiles.length > 15) state.recentFiles.pop();
    }

    async function reloadDocPdfJs(doc, options = {}) {
      const info = options.info || await parsePageCountAndMeta(doc.bytes);
      const previous = doc.pdfJsDoc;
      if (activeDoc() === doc) clearSearchResults();
      doc.pdfJsDoc = info.pdfJsDoc;
      doc.pageCount = info.pageCount;
      doc.pageSizes = info.pageSizes;
      doc.pageTexts = info.pageTexts;
      if (doc.currentPage >= doc.pageCount) {
        doc.currentPage = Math.max(0, doc.pageCount - 1);
      }
      doc.selectedPages = options.selection
        ? new Set(options.selection.filter(index => index >= 0 && index < doc.pageCount))
        : new Set([doc.currentPage]);
      if (!doc.selectedPages.size) doc.selectedPages.add(doc.currentPage);
      if (previous) previous.destroy().catch((error) => console.warn("PDF cleanup failed", error));
    }

    function saveUndoSnapshot(doc, actionLabel) {
      if (!doc) return;
      doc.undoStack.push({
        bytes: doc.bytes,
        overlays: JSON.parse(JSON.stringify(doc.overlays)),
        bookmarks: JSON.parse(JSON.stringify(doc.bookmarks)),
        attachments: doc.attachments.map((item) => ({ ...item, bytes: item.bytes.slice(0) })),
        metadata: JSON.parse(JSON.stringify(doc.metadata)),
        currentPage: doc.currentPage,
        label: actionLabel,
      });
      if (doc.undoStack.length > 25) doc.undoStack.shift();
      doc.redoStack = [];
      doc.dirty = true;
      doc.history.unshift(`${new Date().toLocaleTimeString("ko-KR")} · ${actionLabel}`);
    }

    async function performUndo() {
      const doc = activeDoc();
      if (!doc || doc.operationBusy || doc.undoStack.length === 0) return;
      const snap = doc.undoStack.pop();
      doc.redoStack.push({
        bytes: doc.bytes,
        overlays: JSON.parse(JSON.stringify(doc.overlays)),
        bookmarks: JSON.parse(JSON.stringify(doc.bookmarks)),
        attachments: doc.attachments.map((item) => ({ ...item, bytes: item.bytes.slice(0) })),
        metadata: JSON.parse(JSON.stringify(doc.metadata)),
        currentPage: doc.currentPage,
        label: snap.label,
      });
      const contentUnchanged = doc.bytes === snap.bytes;
      doc.bytes = snap.bytes;
      doc.overlays = snap.overlays;
      doc.bookmarks = snap.bookmarks;
      doc.attachments = snap.attachments;
      doc.metadata = snap.metadata;
      doc.currentPage = snap.currentPage;
      doc.dirty = true;
      if (!contentUnchanged) await reloadDocPdfJs(doc);
      else doc.selectedPages = new Set([doc.currentPage]);
      doc.history.unshift(`실행 취소: ${snap.label}`);
      await refreshAllViews();
      showToast(`실행 취소: ${snap.label}`, "fa-rotate-left");
    }

    async function performRedo() {
      const doc = activeDoc();

      const snap = doc.redoStack.pop();
      doc.undoStack.push({
        bytes: doc.bytes,

    let pageJumpDraftDoc = null;
    function syncPageJumpInput(doc, input) {
      if (pageJumpDraftDoc !== doc) pageJumpDraftDoc = null;

    function applyPageJump(doc, input) {
      if (!doc || pageJumpDraftDoc && pageJumpDraftDoc !== doc) return false;
      const value = input.value.trim();
      if (!/^\d+$/.test(value)) { showToast("페이지 번호를 정수로 입력해 주세요.", "fa-triangle-exclamation"); input.focus(); return false; }
      const page = Number(value);
      if (!Number.isSafeInteger(page) || page < 1 || page > doc.pageCount) {
        showToast(`1부터 ${doc.pageCount}까지 페이지 번호를 입력해 주세요.`, "fa-triangle-exclamation"); input.focus(); return false;
      }
      pageJumpDraftDoc = null;
      doc.currentPage = page - 1;
      doc.selectedPages = new Set([doc.currentPage]);
      if (isMobileViewport()) toggleLeftPane(true);
      renderCurrentPageCanvas(); renderLeftPane();
      return true;

          flowEpoch++; flowQueue = []; flowVisibleSlots.clear(); flowObserver?.disconnect();
          stageEl.remove(); flowEl.replaceChildren(stageEl); flowDoc = null; flowBytes = null; flowKey = "";
        }
        statusBanner.textContent = "현재 페이지: - / 전체: -";

      document.getElementById("statusZoomSummary").textContent = `배율: ${Math.round(doc.zoom * 100)}%`;
      const selected = Array.from(doc.selectedPages).sort((a, b) => a - b);
      const selPages = selected.length > 10 ? `${selected.length}쪽` : selected.map((p) => `${p + 1}쪽`).join(", ");
      document.getElementById("statusSelectionSummary").textContent = `선택: ${selPages || (doc.currentPage + 1) + "쪽"}`;
