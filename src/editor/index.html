    function viewColumns() { return state.viewMode === "2" ? 2 : state.viewMode === "3" ? 3 : 1; }
    let flowDoc = null, flowBytes = null, flowKey = "", flowObserver = null, flowEpoch = 0;
    let displayReader = null;
    let flowQueue = [], flowRunning = 0, flowScrollFrame = 0, flowFromScroll = false;
    const flowVisibleSlots = new Set();
    function syncThumbnailSelection(doc) {
      const wrap = document.getElementById("thumbnailContainer");
      if (!wrap || wrap.dataset.docId !== doc.id) return;
      for (const card of wrap.children) {
        const i = Number(card.dataset.pageIndex);
        card.classList.toggle("selected", doc.selectedPages.has(i) || (doc.selectedPages.size <= 1 && i === doc.currentPage));
      }
      const selected = wrap.querySelector(`[data-page-index="${doc.currentPage}"]`);
      if (selected) {
        const pane = document.getElementById("leftPaneContent");
        const top = selected.offsetTop - pane.offsetTop;
        if (top < pane.scrollTop) pane.scrollTop = top;
        else if (top + selected.offsetHeight > pane.scrollTop + pane.clientHeight) pane.scrollTop = top + selected.offsetHeight - pane.clientHeight;
      }
    }
    function queuePagePreview(slot, doc, scale, epoch) {
      if (slot.dataset.previewQueued || slot.dataset.rendering || slot.querySelector("#pageStage")) return;
      slot.dataset.previewQueued = "1";
      flowQueue.push({slot, doc, scale, epoch}); pumpPagePreviews();
    }
    function pumpPagePreviews() {
      while (flowRunning < 2 && flowQueue.length) {
        const job = flowQueue.shift();
        if (job.epoch !== flowEpoch || !job.slot.isConnected || job.slot.querySelector("#pageStage")) { delete job.slot.dataset.previewQueued; continue; }
        flowRunning++; job.slot.dataset.rendering = "1";
        (async () => {
          const i = Number(job.slot.dataset.pageIndex);
          const page = await job.doc.pdfJsDoc.getPage(i + 1);
          if (job.epoch !== flowEpoch || !job.slot.isConnected || job.slot.querySelector("#pageStage")) return;
          const canvas = document.createElement("canvas"), dpr = Math.min(devicePixelRatio || 1, 1.25);
          const vp = page.getViewport({scale: job.scale * dpr});
          canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
          job.slot.replaceChildren(canvas);
          await page.render({canvas, canvasContext:canvas.getContext("2d"), viewport:vp}).promise;
          if (job.epoch !== flowEpoch || !job.slot.isConnected || !job.slot.dataset.visible || job.slot.querySelector("#pageStage")) { if (!job.slot.querySelector("#pageStage")) job.slot.replaceChildren(); return; }
          const layer = document.createElement("div"); layer.className = "page-preview-overlay";
          renderOverlayItems(job.doc, i, job.scale, layer);
          job.slot.appendChild(layer);
        })().catch(error => { if (error.name !== "RenderingCancelledException") console.warn("페이지 미리보기 실패", error); })
          .finally(() => {
            delete job.slot.dataset.rendering;
            if (!job.slot.dataset.visible && !job.slot.querySelector("#pageStage")) { job.slot.replaceChildren(); delete job.slot.dataset.previewQueued; }
            flowRunning--; pumpPagePreviews();
          });
      }
    }
    function preparePageFlow(doc, scale, pageIdx) {
      const flow = document.getElementById("pagesFlow"), stage = document.getElementById("pageStage");
      const vp = document.getElementById("canvasViewport");
      const key = `${state.viewMode}:${doc.pageCount}:${scale.toFixed(4)}`;
      if (flowDoc !== doc || flowBytes !== doc.bytes || flowKey !== key) {
        flowEpoch++; flowQueue = []; flowObserver?.disconnect(); flowVisibleSlots.clear();
        flowDoc = doc; flowBytes = doc.bytes; flowKey = key;
        stage.remove(); flow.replaceChildren();
        flow.style.gridTemplateColumns = `repeat(${viewColumns()}, max-content)`;
        const count = state.viewMode === "single" ? 1 : doc.pageCount;
        for (let n = 0; n < count; n++) {
          const i = state.viewMode === "single" ? pageIdx : n;
          const size = doc.pageSizes[i] || {width:595.28,height:841.89};
          const slot = document.createElement("div"); slot.className = "page-slot"; slot.dataset.pageIndex = String(i);
          slot.style.width = `${Math.round(size.width * scale)}px`; slot.style.height = `${Math.round(size.height * scale)}px`;
          slot.addEventListener("click", event => {
            if (event.target.closest("#pageStage") || activeDoc() !== doc || doc.currentPage === i) return;
            doc.currentPage = i; doc.selectedPages = new Set([i]); state.selectedInsertId = null;
            renderCurrentPageCanvas();
          });
          flow.appendChild(slot);
        }
        if (state.viewMode !== "single") {
          const epoch = flowEpoch;
          flowObserver = new IntersectionObserver(entries => {
            for (const entry of entries) {
              if (entry.isIntersecting) { flowVisibleSlots.add(entry.target); entry.target.dataset.visible = "1"; queuePagePreview(entry.target, doc, scale, epoch); }
              else { flowVisibleSlots.delete(entry.target); delete entry.target.dataset.visible; if (!entry.target.querySelector("#pageStage")) { entry.target.replaceChildren(); if (!entry.target.dataset.rendering) delete entry.target.dataset.previewQueued; } }
            }
            if (!flowScrollFrame) flowScrollFrame = requestAnimationFrame(syncPageFromScroll);
          }, {root:vp, rootMargin:"250px"});
          for (const slot of flow.children) flowObserver.observe(slot);
        }
      }
      if (state.viewMode === "single" && flow.firstElementChild?.dataset.pageIndex !== String(pageIdx)) {
        flowKey = ""; return preparePageFlow(doc, scale, pageIdx);
      }
      const slot = flow.querySelector(`[data-page-index="${pageIdx}"]`);
      if (!slot) return;
      const previous = stage.parentElement;
      if (previous !== slot) {
        const preview = slot.querySelector(":scope > canvas");
        const activeCanvas = stage.querySelector("#pdfRenderCanvas");
        if (preview && preview.width > 0 && preview.height > 0) {
          activeCanvas.width = preview.width; activeCanvas.height = preview.height;
          activeCanvas.getContext("2d").drawImage(preview, 0, 0);
          stage.dataset.displayPage = String(pageIdx); stage.dataset.displayDoc = doc.id; displayReader = doc.pdfJsDoc;
        } else {
          activeCanvas.width = 1; activeCanvas.height = 1;
          stage.dataset.displayPage = ""; stage.dataset.displayDoc = ""; displayReader = null;
        }
        stage.remove(); slot.replaceChildren(stage);
        if (previous?.classList.contains("page-slot") && previous.isConnected) {
          delete previous.dataset.previewQueued;
          queuePagePreview(previous, doc, scale, flowEpoch);
        }
        if (!flowFromScroll && state.viewMode !== "single") slot.scrollIntoView({block:"nearest", inline:"nearest"});
      }
    }
    function syncPageFromScroll() {
      flowScrollFrame = 0;
      const doc = activeDoc(), vp = document.getElementById("canvasViewport"), flow = document.getElementById("pagesFlow");
      if (!doc || doc.scrollSyncSuspended || state.viewMode === "single" || flowDoc !== doc) return;
      const viewportRect = vp.getBoundingClientRect();
      const visible = [...flowVisibleSlots].filter(slot => { const r=slot.getBoundingClientRect(); return r.bottom > viewportRect.top && r.top < viewportRect.bottom && r.right > viewportRect.left && r.left < viewportRect.right; });
      if (!visible.length) return;
      const current = flow.querySelector(`[data-page-index="${doc.currentPage}"]`);
      const currentRect = current?.getBoundingClientRect();
      const currentArea = currentRect ? Math.max(0, Math.min(currentRect.bottom, viewportRect.bottom) - Math.max(currentRect.top, viewportRect.top)) : 0;
      const target = visible.reduce((best, slot) => {
        const r = slot.getBoundingClientRect(), height = Math.max(0, Math.min(r.bottom, viewportRect.bottom) - Math.max(r.top, viewportRect.top));
        return height > best.height ? {slot,height} : best;
      }, {slot:visible[0],height:0});
      if (current && currentArea >= target.height * 0.85) return;
      const i = Number(target.slot.dataset.pageIndex);
      if (i === doc.currentPage) return;
      doc.currentPage = i;
      if (doc.selectedPages.size <= 1) doc.selectedPages = new Set([i]);
      state.selectedInsertId = null;
      flowFromScroll = true; renderCurrentPageCanvas().finally(() => { flowFromScroll = false; });
    }
    let currentRenderTask = null;
    let renderGeneration = 0;
    async function renderCurrentPageCanvas() {
      const generation = ++renderGeneration;
      document.getElementById("searchIndicator")?.replaceChildren();
      if (currentRenderTask) {
        currentRenderTask.cancel();
        try { await currentRenderTask.promise; } catch (error) {
          if (error.name !== "RenderingCancelledException") console.warn("Previous render failed", error);
        }
        currentRenderTask = null;
      }
      const doc = activeDoc();
      if (!doc) return;

      const viewportEl = document.getElementById("canvasViewport");
      const canvas = document.getElementById("pdfRenderCanvas");
      const stage = document.getElementById("pageStage");
      const pageIdx = Math.max(0, Math.min(doc.currentPage, doc.pageCount - 1));
      const baseSize = doc.pageSizes[pageIdx] || { width: 595.28, height: 841.89 };

      const padW = isMobileViewport() ? 28 : 58;
      const padH = isMobileViewport() ? 24 : 46;

      if (doc.fitSizeSource !== doc.pageSizes) {
        doc.fitSizeSource = doc.pageSizes;
        doc.fitReferenceSize = doc.pageSizes.reduce((max, size) => ({width: Math.max(max.width, size.width), height: Math.max(max.height, size.height)}), {width: 1, height: 1});
      }
      const fitSize = doc.fitReferenceSize;
      if (doc.fitMode === "width") {
        const availW = Math.max(120, (viewportEl.clientWidth - padW - 16 * (viewColumns() - 1)) / viewColumns());
        doc.zoom = Math.max(0.25, Math.min(3.0, availW / fitSize.width));
      } else if (doc.fitMode === "page") {
        const availW = Math.max(120, (viewportEl.clientWidth - padW - 16 * (viewColumns() - 1)) / viewColumns());
        const availH = Math.max(240, viewportEl.clientHeight - padH);
        doc.zoom = Math.max(0.25, Math.min(3.0, Math.min(availW / fitSize.width, availH / fitSize.height)));
      }

      const scale = doc.zoom;
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      const cssW = Math.round(baseSize.width * scale);
      const cssH = Math.round(baseSize.height * scale);

      preparePageFlow(doc, scale, pageIdx);
      stage.style.width = `${cssW}px`;
      stage.style.height = `${cssH}px`;
      canvas.style.width = `${cssW}px`;
      canvas.style.height = `${cssH}px`;
      const displayMatches = stage.dataset.displayDoc === doc.id && stage.dataset.displayPage === String(pageIdx) && displayReader === doc.pdfJsDoc;
      stage.dataset.loading = String(!displayMatches);
      if (!displayMatches) { canvas.width = 1; canvas.height = 1; }

      if (doc.pdfJsDoc) {
        try {
          const reader = doc.pdfJsDoc;
          const pdfPage = await reader.getPage(pageIdx + 1);
          if (generation !== renderGeneration || activeDoc() !== doc || reader !== doc.pdfJsDoc) return;
          const viewport = pdfPage.getViewport({ scale: scale * dpr });
          const buffer = document.createElement("canvas");
          buffer.width = Math.round(viewport.width); buffer.height = Math.round(viewport.height);
          const task = pdfPage.render({canvas: buffer, canvasContext: buffer.getContext("2d"), viewport});
          currentRenderTask = task;
          await task.promise;
          if (currentRenderTask === task) currentRenderTask = null;
          if (generation !== renderGeneration || activeDoc() !== doc || reader !== doc.pdfJsDoc) return;
          canvas.width = buffer.width; canvas.height = buffer.height;
          canvas.getContext("2d").drawImage(buffer, 0, 0);
          stage.dataset.displayPage = String(pageIdx); stage.dataset.displayDoc = doc.id; displayReader = reader;
          stage.dataset.loading = "false";
        } catch (error) {
          if (error.name === "RenderingCancelledException" || generation !== renderGeneration) return;
          stage.dataset.loading = "false";
          showToast(`PDF 페이지 표시 실패: ${error.message || error}`, "fa-circle-exclamation");
        }
      } else {
        stage.dataset.loading = "false";
        showToast("PDF 렌더러를 사용할 수 없습니다.", "fa-circle-exclamation");
      }

      renderOverlayItems(doc, pageIdx, scale);
      renderSearchIndicator(doc, pageIdx, scale, generation);
      updateCommandStates();
      syncThumbnailSelection(doc);
    }

    function renderOverlayItems(doc, pageIdx, scale, previewContainer = null) {
      const container = previewContainer || document.getElementById("annotationOverlay");
      container.innerHTML = "";

      const items = doc.overlays.filter((it) => it.pageIndex === pageIdx);
      items.forEach((item) => {
        const el = document.createElement("div");
        el.className =
          "overlay-item" +
          (state.selectedInsertId === item.id ? " selected" : "") +
          (state.insertMoveMode ? " move-mode" : "");
        el.dataset.overlayId = item.id;
        el.style.left = `${Math.round(item.x * scale)}px`;
        el.style.top = `${Math.round(item.y * scale)}px`;
        if (item.width) el.style.width = `${Math.round(item.width * scale)}px`;
        if (item.height) el.style.height = `${Math.round(item.height * scale)}px`;
        el.style.fontSize = `${Math.max(9, Math.round((item.fontSize || 13) * scale))}px`;
        el.style.color = item.color || "#1B2631";
        el.style.background = item.bgColor || "transparent";
        el.style.opacity = String(item.opacity ?? 1);
        const itemRotation = item.rotation || 0;
        el.style.transformOrigin = "0 0";
        if (itemRotation) el.style.transform = `rotate(${itemRotation}deg)`;

        if (item.type === "Watermark") {
          el.style.fontWeight = "800";
          el.style.transform = `rotate(${itemRotation}deg) translate(50%, 50%) rotate(-24deg) translate(-50%, -50%)`;
          el.style.letterSpacing = "2px";
          el.textContent = item.text;
        } else if (item.type === "Stamp") {
          el.style.border = `2px solid ${item.color || "#1F6F9F"}`;
          el.style.fontWeight = "700";
          el.style.display = "flex";
          el.style.alignItems = "center";
          el.style.justifyContent = "center";
          el.textContent = item.text;
        } else if (item.type === "Note") {
          el.style.borderLeft = "4px solid #E58A18";
          el.style.boxShadow = "0 2px 6px rgba(0,0,0,0.12)";
          el.textContent = `💬 ${item.text}`;
        } else if (item.type === "Table" && Array.isArray(item.cells)) {
          const tbl = document.createElement("table");
          tbl.className = "overlay-table";
          item.cells.forEach((row, rIdx) => {
            const tr = document.createElement("tr");
            row.forEach((cellText) => {
              const cell = document.createElement(rIdx === 0 ? "th" : "td");
              if (rIdx === 0) cell.style.background = "#EAF2F8";
              cell.textContent = cellText;
              tr.appendChild(cell);
            });
            tbl.appendChild(tr);
          });
          el.appendChild(tbl);
        } else {
          el.textContent = item.text;
        }

        if (previewContainer) { container.appendChild(el); return; }

        // Unified Mouse + Touch Drag Handler for Desktop & Mobile
        const startDrag = (clientX, clientY) => {
          state.selectedInsertId = item.id;
          el.classList.add("selected");
          updateCommandStates();

          const origX = item.x;
          const origY = item.y;
          let moved = false;

          const applyMove = (cx, cy) => {
            const dx = (cx - clientX) / scale;
            const dy = (cy - clientY) / scale;
            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
              if (!moved) {
                saveUndoSnapshot(doc, `항목 이동 (${item.type})`);
                moved = true;
              }
              const pageSz = doc.pageSizes[pageIdx] || { width: 595, height: 842 };
              item.x = Math.max(0, Math.min(pageSz.width - 40, Math.round(origX + dx)));
              item.y = Math.max(0, Math.min(pageSz.height - 24, Math.round(origY + dy)));
              el.style.left = `${Math.round(item.x * scale)}px`;
              el.style.top = `${Math.round(item.y * scale)}px`;
            }
          };

          return { applyMove, wasMoved: () => moved };
        };

        el.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          const drag = startDrag(e.clientX, e.clientY);
          const onMove = (me) => drag.applyMove(me.clientX, me.clientY);
          const onUp = () => {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            if (drag.wasMoved()) renderRightPane();
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });

        el.addEventListener(
          "touchstart",
          (e) => {
            e.stopPropagation();
            const t = e.touches[0];
            if (!t) return;
            const drag = startDrag(t.clientX, t.clientY);
            const onTouchMove = (te) => {
              const tm = te.touches[0];
              if (!tm) return;
              te.preventDefault();
              drag.applyMove(tm.clientX, tm.clientY);
            };
            const onTouchEnd = () => {
              window.removeEventListener("touchmove", onTouchMove);
              window.removeEventListener("touchend", onTouchEnd);
              if (drag.wasMoved()) renderRightPane();
            };
            window.addEventListener("touchmove", onTouchMove, { passive: false });
            window.addEventListener("touchend", onTouchEnd);
          },
          { passive: true }
        );

        el.addEventListener("dblclick", (e) => {
          e.stopPropagation();
          state.selectedInsertId = item.id;
          openEditInsertItemModal();
        });

        // Bottom-right Resize Handle for commercial-grade direct manipulation
        const resizeHandle = document.createElement("div");
        resizeHandle.className = "overlay-resize-handle";
        resizeHandle.title = "드래그하여 크기 조절";
        const startResize = (startX, startY) => {
          const initW = item.width || Math.max(80, Math.round(el.offsetWidth / scale));
          const initH = item.height || Math.max(26, Math.round(el.offsetHeight / scale));
          const initFont = item.fontSize || 13;
          let resized = false;
          return {
            applyResize: (cx, cy) => {
              const dx = (cx - startX) / scale, dy = (cy - startY) / scale;
              const rad = (item.rotation || 0) * Math.PI / 180;
              const dw = dx * Math.cos(rad) + dy * Math.sin(rad);
              const dh = -dx * Math.sin(rad) + dy * Math.cos(rad);
              if (Math.abs(dw) > 2 || Math.abs(dh) > 2) {
                if (!resized) {
                  saveUndoSnapshot(doc, `항목 크기 조절 (${item.type})`);
                  resized = true;
                }
                item.width = Math.max(48, Math.round(initW + dw));
                item.height = Math.max(22, Math.round(initH + dh));
                if (item.type !== "Table") {
                  item.fontSize = Math.max(8, Math.min(72, Math.round(initFont * (item.height / initH))));
                  el.style.fontSize = `${Math.max(9, Math.round(item.fontSize * scale))}px`;
                }
                el.style.width = `${Math.round(item.width * scale)}px`;
                el.style.height = `${Math.round(item.height * scale)}px`;
              }
            },
            wasResized: () => resized,
          };
        };

        resizeHandle.addEventListener("mousedown", (re) => {
          re.stopPropagation();
          const rs = startResize(re.clientX, re.clientY);
          const onMove = (me) => rs.applyResize(me.clientX, me.clientY);
          const onUp = () => {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            if (rs.wasResized()) renderRightPane();
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });

        resizeHandle.addEventListener(
          "touchstart",
          (re) => {
            re.stopPropagation();
            const t = re.touches[0];
            if (!t) return;
            const rs = startResize(t.clientX, t.clientY);
            const onMove = (te) => {
              const tm = te.touches[0];
              if (!tm) return;
              te.preventDefault();
              rs.applyResize(tm.clientX, tm.clientY);
            };
            const onEnd = () => {
              window.removeEventListener("touchmove", onMove);
              window.removeEventListener("touchend", onEnd);
              if (rs.wasResized()) renderRightPane();
            };
            window.addEventListener("touchmove", onMove, { passive: false });
            window.addEventListener("touchend", onEnd);
          },
          { passive: true }
        );

        el.appendChild(resizeHandle);
        container.appendChild(el);
      });
    }

    // =========================================================================

    // =========================================================================
    // Left Navigation Pane Content
    // =========================================================================
    let thumbDoc = null, thumbBytes = null, thumbSignature = "", thumbObserver = null;
    async function renderLeftPane() {
      renderLeftTabBar();
      const container = document.getElementById("leftPaneContent");
      const doc = activeDoc();

      if (state.leftPanels.length === 0) {
        container.innerHTML = `
          <div style="padding:18px;text-align:center;color:var(--text-muted)">
            <p style="margin-bottom:8px">열려 있는 좌측 패널이 없습니다.</p>
            <button type="button" class="compact-btn" id="emptyLeftAddBtn"><i class="fa-solid fa-plus"></i> 패널 추가</button>
          </div>
        `;
        document.getElementById("emptyLeftAddBtn")?.addEventListener("click", () => openPanelManagerModal("left"));
        return;
      }

      if (!state.leftPanels.includes(state.activeLeftTab)) {
        state.activeLeftTab = state.leftPanels[0];
      }

      if (state.activeLeftTab === "pages") {
        const signature = doc ? `${doc.pageCount}:${doc.overlays.map(x => x.pageIndex).join(",")}` : "";
        if (doc && thumbDoc === doc && thumbBytes === doc.bytes && thumbSignature === signature && container.querySelector("#thumbnailContainer")) { syncThumbnailSelection(doc); return; }
        thumbObserver?.disconnect(); thumbDoc = doc; thumbBytes = doc?.bytes; thumbSignature = signature;
        container.innerHTML = `<div id="thumbnailContainer"></div>`;
        const thumbWrap = document.getElementById("thumbnailContainer");
        if (!doc) {
          thumbWrap.innerHTML = `<div style="padding:16px;text-align:center;color:var(--text-muted)">열려 있는 PDF가 없습니다.</div>`;
          return;
        }
        thumbWrap.dataset.docId = doc.id;
        const thumbReader = doc.pdfJsDoc;
        thumbObserver = new IntersectionObserver(entries => {
          for (const entry of entries) {
            const card = entry.target, canvas = card.querySelector("canvas");
            if (!entry.isIntersecting) {
              delete card.dataset.visible;
              if (!card.dataset.rendering) { canvas.width = 1; canvas.height = 1; delete card.dataset.rendered; }
              continue;
            }
            card.dataset.visible = "1";
            if (card.dataset.rendered || card.dataset.rendering) continue;
            card.dataset.rendering = "1";
            const index = Number(card.dataset.pageIndex);
            let retry = false;
            thumbReader.getPage(index + 1).then(async page => {
              if (!canvas.isConnected || doc.pdfJsDoc !== thumbReader) return;
              if (!card.dataset.visible) { retry = true; return; }
              const vp = page.getViewport({scale:0.22});
              const buffer = document.createElement("canvas");
              buffer.width = Math.round(vp.width); buffer.height = Math.round(vp.height);
              await page.render({canvas:buffer,canvasContext:buffer.getContext("2d"),viewport:vp}).promise;
              if (!canvas.isConnected || !card.dataset.visible || doc.pdfJsDoc !== thumbReader) return;
              canvas.width = buffer.width; canvas.height = buffer.height;
              canvas.getContext("2d").drawImage(buffer,0,0);
              card.dataset.rendered = "1";
            }).catch(error => console.warn("축소판 표시 실패",error)).finally(() => {
              delete card.dataset.rendering;
              if (!card.dataset.visible) { canvas.width=1; canvas.height=1; delete card.dataset.rendered; }
              // A card can leave and re-enter while a render is running.
              if (retry && card.isConnected && card.dataset.visible && !card.dataset.rendered && doc.pdfJsDoc === thumbReader) {
                thumbObserver?.unobserve(card); thumbObserver?.observe(card);
              }
            });
          }
        }, {root:container, rootMargin:"200px"});
        for (let i = 0; i < doc.pageCount; i++) {
          const card = document.createElement("div");
          card.dataset.pageIndex = String(i);
          card.className = "thumb-card" + (doc.selectedPages.has(i) || (doc.selectedPages.size <= 1 && doc.currentPage === i) ? " selected" : "");
          const cWrap = document.createElement("div");
          cWrap.className = "thumb-canvas-wrap";
          const tCanvas = document.createElement("canvas");
          const thumbSize = doc.pageSizes[i] || {width:595,height:842};
          tCanvas.style.width = `${Math.round(thumbSize.width * 0.22)}px`;
          tCanvas.style.height = `${Math.round(thumbSize.height * 0.22)}px`;
          tCanvas.width = 1;
          tCanvas.height = 1;
          cWrap.appendChild(tCanvas);

          const lbl = document.createElement("div");
          lbl.className = "thumb-label";
          const ovCount = doc.overlays.filter((o) => o.pageIndex === i).length;
          lbl.textContent = `${i + 1}쪽` + (ovCount > 0 ? ` · 항목 ${ovCount}` : "");

          card.appendChild(cWrap);
          card.appendChild(lbl);
          card.addEventListener("click", (e) => {
            if (e.ctrlKey || e.metaKey) {
              if (doc.selectedPages.has(i) && doc.selectedPages.size > 1) {
                doc.selectedPages.delete(i);
              } else {
                doc.selectedPages.add(i);
              }
            } else if (e.shiftKey) {
              const start = Math.min(doc.currentPage, i);
              const end = Math.max(doc.currentPage, i);
              doc.selectedPages.clear();
              for (let p = start; p <= end; p++) doc.selectedPages.add(p);
            } else {
              doc.selectedPages.clear();
              doc.selectedPages.add(i);
            }
            doc.currentPage = i;
            if (isMobileViewport()) toggleLeftPane(true);
            renderCurrentPageCanvas();
            renderLeftPane();
          });
          thumbWrap.appendChild(card);

          if (doc.pdfJsDoc) thumbObserver.observe(card);
        }
        return;
      }

      if (state.activeLeftTab === "bookmarks") {
        if (!doc) {
          container.innerHTML = `<div style="padding:14px;color:var(--text-muted)">문서를 먼저 열어주세요.</div>`;
          return;
        }
        const reader = doc.pdfJsDoc;
        if (!doc.outlineCache || doc.outlineCache.reader !== reader) {
          const cache = {reader, status: "loading", rows: []};
          doc.outlineCache = cache;
          readPdfOutline(reader).then(rows => { cache.rows = rows; cache.status = "ready"; }, error => {
            console.warn("Unable to read PDF outline", error); cache.status = "error";
          }).finally(() => {
            if (doc.outlineCache === cache && activeDoc() === doc && state.activeLeftTab === "bookmarks") renderLeftPane();
          });
        }
        const cache = doc.outlineCache;
        let html = `
          <div style="padding:6px;color:var(--text-muted);font-size:11px">북마크 이름·페이지 변경과 삭제는 PDF 저장 시 반영됩니다. 연쇄 동작은 페이지와 순번을 입력해 변경할 수 있습니다(예: 3,2). 다른 이동은 유지됩니다. 페이지는 전체 맞춤으로 엽니다. 상위 북마크를 삭제하면 하위 북마크도 함께 삭제됩니다.</div>
          <div style="display:flex;gap:6px;margin-bottom:8px">
            <button type="button" class="compact-btn" id="bmAddNowBtn" style="flex:1"><i class="fa-solid fa-plus"></i> 현재 쪽 북마크</button>
            <button type="button" class="compact-btn" id="bmAutoGenBtn"><i class="fa-solid fa-wand-magic-sparkles"></i> 전체 표시</button>
            <button type="button" class="compact-btn" id="bmTextTitleBtn"><i class="fa-solid fa-list-check"></i> 제목 자동</button>
          </div>`;
        if (cache.status === "loading") html += `<div style="padding:8px">기존 북마크를 읽는 중...</div>`;
        else if (cache.status === "error") html += `<div style="padding:8px">기존 북마크를 읽지 못했습니다. 원본 북마크는 유지됩니다.</div>`;
        else cache.rows.forEach((bm, idx) => {
          html += `<div class="list-row-item" data-outline-idx="${idx}" style="padding-left:${Math.min(bm.depth, 8) * 12 + 8}px" title="기존 북마크">
            <span><i class="fa-solid fa-bookmark" style="margin-right:6px"></i>${escapeHtml(bm.title)}</span><span><button type="button" class="compact-btn" data-outline-edit="${idx}" aria-label="기존 북마크 이름 변경">이름</button> <button type="button" class="compact-btn" data-outline-page="${idx}" aria-label="기존 북마크 페이지 변경">쪽</button> <button type="button" class="compact-btn" data-outline-delete="${idx}" aria-label="기존 북마크 삭제">삭제</button></span></div>`;
        });
        if (cache.status === "ready" && !cache.rows.length && !doc.bookmarks.length)
          html += `<div style="padding:12px;color:var(--text-muted)">등록된 북마크가 없습니다.</div>`;
        doc.bookmarks.forEach((bm, idx) => {
          html += `<div class="list-row-item" data-bm-idx="${idx}">
            <span><i class="fa-solid fa-bookmark" style="color:var(--primary);margin-right:6px"></i>${escapeHtml(bm.title)} <small>${bm.page + 1}쪽</small></span>
            <span><button type="button" class="compact-btn" data-bm-edit="${idx}" aria-label="북마크 이름 변경">이름</button>
            <button type="button" class="compact-btn" data-bm-page="${idx}" aria-label="북마크 페이지 변경">쪽</button>
            <button type="button" class="compact-btn" data-bm-delete="${idx}" aria-label="북마크 삭제">삭제</button></span></div>`;
        });
        container.innerHTML = html;
        document.getElementById("bmAddNowBtn")?.addEventListener("click", () => executeCommand("addBookmark"));
        document.getElementById("bmAutoGenBtn")?.addEventListener("click", () => executeCommand("autoBookmarks"));
        document.getElementById("bmTextTitleBtn")?.addEventListener("click", () => executeCommand("tocPageBookmarks"));
        const goToBookmark = (page) => {
          doc.currentPage = page; doc.selectedPages = new Set([page]);
          if (isMobileViewport()) toggleLeftPane(true);
          renderCurrentPageCanvas();
        };
        container.querySelectorAll("[data-outline-idx]").forEach(row => row.addEventListener("click", async () => {
          try {
            const page = await outlinePage(reader, cache.rows[Number(row.dataset.outlineIdx)].dest);
            if (doc.pdfJsDoc !== reader || activeDoc() !== doc) return;
            if (page === null) showToast("이 북마크의 페이지 위치를 열 수 없습니다.", "fa-circle-info");
            else goToBookmark(page);
          } catch (error) { console.warn("Unable to resolve bookmark", error); showToast("북마크 위치를 찾을 수 없습니다.", "fa-circle-exclamation"); }
        }));
        container.querySelectorAll("[data-outline-edit]").forEach(button => button.addEventListener("click", async event => {
          event.stopPropagation();
          const bm = cache.rows[Number(button.dataset.outlineEdit)];
          if (!bm || doc.operationBusy) return;
          const title = window.prompt("북마크 이름", bm.title);
          if (title === null || title.trim() === bm.title) return;
          if (!title.trim()) { showToast("북마크 이름을 입력해 주세요.", "fa-circle-info"); return; }
          await renameExistingBookmark(doc, reader, bm, title, cache.rows);
        }));
        const askBookmarkPage = (initial) => {
          const text = window.prompt(`이동할 페이지 (1~${doc.pageCount})`, String(initial + 1));
          if (text === null) return null;
          if (!/^\d+$/.test(text.trim())) { showToast("유효한 페이지 번호를 입력해 주세요.", "fa-circle-info"); return null; }
          const page = Number(text.trim()) - 1;
          if (!Number.isSafeInteger(page) || page < 0 || page >= doc.pageCount) { showToast("유효한 페이지 번호를 입력해 주세요.", "fa-circle-info"); return null; }
          return page;
        };
        container.querySelectorAll("[data-outline-page]").forEach(button => button.addEventListener("click", async event => {
          event.stopPropagation();
          const bm = cache.rows[Number(button.dataset.outlinePage)];
          if (!bm || doc.operationBusy) return;
          const text = window.prompt(`이동할 페이지, 동작 순번 (1~${doc.pageCount}쪽; 예: 3 또는 3,2)`, String(doc.currentPage + 1));
          if (text === null) return;
          const match = text.trim().match(/^(\d+)\s*(?:,\s*(\d+))?$/);
          const page = match ? Number(match[1]) - 1 : -1, actionIndex = match ? Number(match[2] || "1") - 1 : -1;
          if (!Number.isSafeInteger(page) || page < 0 || page >= doc.pageCount || !Number.isSafeInteger(actionIndex) || actionIndex < 0) {
            showToast("페이지 번호와 동작 순번을 확인해 주세요.", "fa-circle-info"); return;
          }
          await renameExistingBookmark(doc, reader, bm, "", cache.rows, false, page, actionIndex);
        }));
        container.querySelectorAll("[data-bm-page]").forEach(button => button.addEventListener("click", event => {
          event.stopPropagation();
          const bm = doc.bookmarks[Number(button.dataset.bmPage)];
          if (!bm || doc.operationBusy) return;
          const page = askBookmarkPage(bm.page);
          if (page === null || page === bm.page) return;
          saveUndoSnapshot(doc, "북마크 페이지 변경"); bm.page = page; renderLeftPane();
        }));
        container.querySelectorAll("[data-outline-delete]").forEach(button => button.addEventListener("click", async event => {
          event.stopPropagation();
          const bm = cache.rows[Number(button.dataset.outlineDelete)];
          if (!bm || doc.operationBusy) return;
          const descendants = cache.rows.filter(row => row.path.length > bm.path.length &&
            bm.path.every((part, i) => row.path[i] === part)).length;
          const message = descendants ? `"${bm.title}" 및 하위 북마크 ${descendants}개를 삭제하시겠습니까?` : `"${bm.title}" 북마크를 삭제하시겠습니까?`;
          if (!window.confirm(message)) return;
          await renameExistingBookmark(doc, reader, bm, "", cache.rows, true);
        }));
        container.querySelectorAll("[data-bm-idx]").forEach(row => row.addEventListener("click", () => {
          const bm = doc.bookmarks[Number(row.dataset.bmIdx)];
          if (bm) goToBookmark(bm.page);
        }));
        container.querySelectorAll("[data-bm-edit]").forEach(button => button.addEventListener("click", event => {
          event.stopPropagation();
          const bm = doc.bookmarks[Number(button.dataset.bmEdit)];
          if (!bm) return;
          const title = window.prompt("북마크 이름", bm.title);
          if (title === null || title.trim() === bm.title) return;
          if (!title.trim()) { showToast("북마크 이름을 입력해 주세요.", "fa-circle-info"); return; }
          saveUndoSnapshot(doc, "북마크 이름 변경"); bm.title = title.trim(); renderLeftPane();
        }));
        container.querySelectorAll("[data-bm-delete]").forEach(button => button.addEventListener("click", event => {
          event.stopPropagation();
          const index = Number(button.dataset.bmDelete);
          if (!doc.bookmarks[index]) return;
          saveUndoSnapshot(doc, "북마크 삭제"); doc.bookmarks.splice(index, 1); renderLeftPane();
        }));
        return;
      }

      if (state.activeLeftTab === "comments") {
        if (!doc) {
          container.innerHTML = `<div style="padding:14px;color:var(--text-muted)">문서를 먼저 열어주세요.</div>`;
          return;
        }
        let html = `
          <div style="display:flex;gap:6px;margin-bottom:8px">
            <button type="button" class="compact-btn" id="cmAddNoteBtn" style="flex:1"><i class="fa-solid fa-comment-medical"></i> 주석 추가</button>
            <button type="button" class="compact-btn" id="cmExportCsvBtn"><i class="fa-solid fa-file-csv"></i> CSV 저장</button>
          </div>
        `;
        if (doc.overlays.length === 0) {
          html += `<div style="padding:12px;color:var(--text-muted)">현재 문서에 삽입된 주석·항목이 없습니다.</div>`;
        } else {
          doc.overlays.forEach((ov) => {
            html += `
              <div class="list-row-item" data-ov-id="${ov.id}">
                <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <strong style="color:var(--primary)">[${escapeHtml(ov.type)}]</strong> ${escapeHtml(ov.text || "표 항목")}
                </div>
                <span style="font-size:11px;color:var(--text-muted);flex-shrink:0">${ov.pageIndex + 1}쪽</span>
              </div>
            `;
          });
        }
        container.innerHTML = html;
        document.getElementById("cmAddNoteBtn")?.addEventListener("click", () => executeCommand("insertNote"));
        document.getElementById("cmExportCsvBtn")?.addEventListener("click", () => exportOverlaysToCsv(doc));
        container.querySelectorAll("[data-ov-id]").forEach((row) => {
          row.addEventListener("click", () => {
            const target = doc.overlays.find((o) => o.id === row.dataset.ovId);
            if (target) {
              doc.currentPage = target.pageIndex;
              state.selectedInsertId = target.id;
              if (isMobileViewport()) toggleLeftPane(true);
              renderCurrentPageCanvas();
            }
          });
        });
        return;
      }

      if (state.activeLeftTab === "search") {
        let html = `
          <div style="display:flex;gap:5px;margin-bottom:8px">
            <input type="text" id="leftSearchInput" class="compact-input" placeholder="검색어 입력..." value="${escapeHtml(state.lastSearchTerm)}" />
            <button type="button" class="compact-btn" id="leftSearchRunBtn">검색</button>
          </div>
        `;
        if (state.searchResults.length === 0) {
          html += `<div style="padding:12px;color:var(--text-muted)">검색 결과가 없습니다.</div>`;
        } else {
          state.searchResults.forEach((res, idx) => {
            html += `
              <div class="list-row-item" data-search-idx="${idx}">
                <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <strong style="color:var(--primary)">${res.pageIndex + 1}쪽${res.kind === "page" ? " · 페이지 위치" : ""}:</strong> ${escapeHtml(res.snippet)}
                </div>
              </div>
            `;
          });
        }
        container.innerHTML = html;
        document.getElementById("leftSearchRunBtn")?.addEventListener("click", () => {
          const val = document.getElementById("leftSearchInput")?.value || "";
          runDocumentSearch(val);
        });
        container.querySelectorAll("[data-search-idx]").forEach((row) => {
          row.addEventListener("click", () => {
            const index = Number(row.dataset.searchIdx);
            const hit = state.searchResults[index];
            if (hit && doc && hit.docId === doc.id && hit.reader === doc.pdfJsDoc) {
              state.activeSearchHitIndex = index;
              state.searchScrollHit = hit;
              document.getElementById("inlineSearchCount").textContent = `${index + 1}/${state.searchResults.length}`;
              doc.currentPage = hit.pageIndex;
              doc.selectedPages = new Set([hit.pageIndex]);
              if (isMobileViewport()) toggleLeftPane(true);
              renderCurrentPageCanvas();
              if (hit.kind === "page") showToast("이 결과는 페이지 위치만 표시됩니다.", "fa-circle-info");
            }
          });
        });
        return;
      }

      if (state.activeLeftTab === "attachments") {
        if (!doc) {
          container.innerHTML = `<div style="padding:14px;color:var(--text-muted)">문서를 먼저 열어주세요.</div>`;
          return;
        }
        let html = `
          <div style="display:flex;gap:6px;margin-bottom:8px">
            <button type="button" class="compact-btn" id="attAddBtn" style="flex:1"><i class="fa-solid fa-plus"></i> 첨부 추가</button>
            <button type="button" class="compact-btn" id="attSaveAllBtn"><i class="fa-solid fa-download"></i> 일괄 저장</button>
          </div>
        `;
        if (!doc.attachmentsReadable) {
          html += `<div style="padding:12px;color:var(--text-muted)">기존 첨부파일 목록을 읽을 수 없습니다.</div>`;
        } else if (doc.attachments.length === 0) {
          html += `<div style="padding:12px;color:var(--text-muted)">등록된 첨부파일이 없습니다.</div>`;
        } else {
          doc.attachments.forEach((att, idx) => {
            html += `
              <div class="list-row-item" data-att-idx="${idx}">
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><i class="fa-solid fa-paperclip" style="color:var(--primary);margin-right:5px"></i>${escapeHtml(att.name)}</span>
                <span style="font-size:11px;color:var(--text-muted)">${(att.bytes.byteLength / 1024).toFixed(1)}KB</span>
              </div>
            `;
          });
        }
        container.innerHTML = html;
        document.getElementById("attAddBtn")?.addEventListener("click", () => executeCommand("addAttachment"));
        document.getElementById("attSaveAllBtn")?.addEventListener("click", () => executeCommand("saveAllAttachments"));
        container.querySelectorAll("[data-att-idx]").forEach((row) => {
          row.addEventListener("click", () => {
            const att = doc.attachments[Number(row.dataset.attIdx)];
            if (att) downloadBytes(att.bytes, att.name, att.type || "application/octet-stream");
          });

      }

      if (state.activeLeftTab === "recent") {
        let html = ``;
        if (state.recentFiles.length === 0) {
          html = `<div style="padding:12px;color:var(--text-muted)">최근 열었던 파일이 없습니다.</div>`;
        } else {
          state.recentFiles.forEach((rf, idx) => {
            html += `
              <div class="list-row-item" data-recent-idx="${idx}">
                <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <i class="fa-regular fa-file-pdf" style="color:var(--primary);margin-right:5px"></i>${escapeHtml(rf.name)}
                </div>
                <span style="font-size:11px;color:var(--text-muted);flex-shrink:0">${rf.pageCount}쪽</span>
              </div>
            `;
          });
        }
        container.innerHTML = html;
        container.querySelectorAll("[data-recent-idx]").forEach((row) => {
          row.addEventListener("click", async () => {
            const rf = state.recentFiles[Number(row.dataset.recentIdx)];
            if (!rf) return;
            const existingIdx = state.docs.findIndex((d) => d.name === rf.name);
            if (existingIdx >= 0) {
              await setActiveDocument(existingIdx);
            } else if (rf.bytes) {
              await openPdfFromBytes(rf.name, rf.bytes);
            }
            if (isMobileViewport()) toggleLeftPane(true);
          });
        });
      }
    }

    // =========================================================================
    // Right Inspector Pane Content
    // =========================================================================
    function renderRightPane() {
      renderRightTabBar();
      const container = document.getElementById("rightPaneContent");
      const doc = activeDoc();

      if (state.rightPanels.length === 0) {
        container.innerHTML = `
          <div style="padding:18px;text-align:center;color:var(--text-muted)">
            <p style="margin-bottom:8px">열려 있는 우측 패널이 없습니다.</p>
            <button type="button" class="compact-btn" id="emptyRightAddBtn"><i class="fa-solid fa-plus"></i> 패널 추가</button>
          </div>
        `;
        document.getElementById("emptyRightAddBtn")?.addEventListener("click", () => openPanelManagerModal("right"));
        return;
      }

      if (!state.rightPanels.includes(state.activeRightTab)) {
        state.activeRightTab = state.rightPanels[0];
      }

      if (state.activeRightTab === "properties") {
        if (!doc) {
          container.innerHTML = `<div style="padding:14px;color:var(--text-muted)">열려 있는 PDF가 없습니다.</div>`;
          return;
        }
        const sz = doc.pageSizes[doc.currentPage] || { width: 595.28, height: 841.89 };

          <div class="inspector-card">
            <div class="inspector-card-title">문서 기본 정보</div>
            <div style="font-size:12px;line-height:1.7">
              <div><strong>파일명:</strong> ${escapeHtml(doc.name)}</div>
              <div><strong>전체 페이지:</strong> ${doc.pageCount}쪽</div>
              <div><strong>현재 페이지:</strong> ${doc.currentPage + 1}쪽 (${Math.round(sz.width)} × ${Math.round(sz.height)} pt)</div>
              <div><strong>배율 / 맞춤:</strong> ${Math.round(doc.zoom * 100)}% (${doc.fitMode})</div>
              <div><strong>용량:</strong> ${(doc.bytes.byteLength / 1024).toFixed(1)} KB</div>

            </div>

              <div><strong>제목:</strong> ${escapeHtml(doc.metadata.title || "-")}</div>
              <div><strong>작성자:</strong> ${escapeHtml(doc.metadata.author || "-")}</div>
              <div><strong>주제:</strong> ${escapeHtml(doc.metadata.subject || "-")}</div>
              <div><strong>키워드:</strong> ${escapeHtml(doc.metadata.keywords || "-")}</div>
            </div>
          </div>
        `;
        document.getElementById("inspEditMetaBtn")?.addEventListener("click", () => executeCommand("editMetadata"));

      }

      if (state.activeRightTab === "history") {
        if (!doc) {
          container.innerHTML = `<div style="padding:14px;color:var(--text-muted)">열려 있는 PDF가 없습니다.</div>`;
          return;
        }
        let html = `
          <div style="display:flex;gap:5px;margin-bottom:8px">
            <button type="button" class="compact-btn" id="histUndoBtn" style="flex:1" ${doc.undoStack.length ? "" : "disabled"}><i class="fa-solid fa-rotate-left"></i> 실행 취소</button>
            <button type="button" class="compact-btn" id="histRedoBtn" style="flex:1" ${doc.redoStack.length ? "" : "disabled"}><i class="fa-solid fa-rotate-right"></i> 다시 실행</button>
          </div>
        `;
        doc.history.forEach((entry) => {
          html += `<div class="list-row-item" style="cursor:default"><span>${escapeHtml(entry)}</span></div>`;
        });
        container.innerHTML = html;
        document.getElementById("histUndoBtn")?.addEventListener("click", performUndo);
        document.getElementById("histRedoBtn")?.addEventListener("click", performRedo);
        return;
      }

      if (state.activeRightTab === "quick") {
        const sections = [
          {
            title: "삽입",
            items: [
              { id: "insertText", label: "텍스트 삽입", icon: "fa-font" },
              { id: "insertTable", label: "표 삽입", icon: "fa-table" },
              { id: "insertNote", label: "주석 삽입", icon: "fa-comment-dots" },
              { id: "insertWatermark", label: "워터마크", icon: "fa-droplet" },
              { id: "insertStamp", label: "스탬프", icon: "fa-stamp" },
            ],
          },
          {
            title: "선택 항목",
            items: [
              { id: "editInsertItem", label: "삽입 항목 수정", icon: "fa-pen-to-square" },
              { id: "moveInsertItem", label: "삽입 항목 이동", icon: "fa-up-down-left-right" },
              { id: "deleteInsertItem", label: "삽입 항목 삭제", icon: "fa-eraser" },
            ],
          },
          {
            title: "검토 및 병합",
            items: [
              { id: "mergePdf", label: "PDF 병합", icon: "fa-object-group" },
              { id: "highlightText", label: "강조 상자 삽입", icon: "fa-highlighter" },
              { id: "comparePdf", label: "PDF 기본 정보 비교", icon: "fa-scale-balanced" },
            ],
          },
        ];

        container.innerHTML = sections
          .map(
            (sec) => `
            <div class="inspector-card">
              <div class="inspector-card-title">${escapeHtml(sec.title)}</div>
              ${sec.items
                .map(
                  (it) => `
                  <button type="button" class="quick-action-btn" data-quick-cmd="${it.id}">
                    <i class="fa-solid ${it.icon}"></i>
                    <span>${escapeHtml(it.label)}</span>
                  </button>
                `
                )
                .join("")}
            </div>
          `
          )
          .join("");

        container.querySelectorAll("[data-quick-cmd]").forEach((btn) => {
          btn.addEventListener("click", () => {
            if (isMobileViewport()) toggleRightPane(true);
            executeCommand(btn.dataset.quickCmd);
          });

      }
    }

    // =========================================================================
    // PDF Binary Manipulation Helpers (pdf-lib + Canvas Bake)
    // =========================================================================
    // Append new top-level destinations without rewriting the original outline tree.
    function appendPdfBookmarks(pdfDoc, bookmarks) {
      if (!bookmarks?.length) return;
      const { PDFName, PDFDict, PDFNumber, PDFHexString, PDFRef } = window.PDFLib;
      const name = PDFName.of, ctx = pdfDoc.context, pages = pdfDoc.getPages();
      for (const bm of bookmarks) {
        if (!Number.isInteger(bm.page) || bm.page < 0 || bm.page >= pages.length || !String(bm.title || '').trim())
          throw new Error("북마크 제목 또는 페이지가 올바르지 않습니다.");
      }
      let rootRef = pdfDoc.catalog.get(name('Outlines')), root, priorRef;
      if (rootRef) {
        if (!(rootRef instanceof PDFRef)) throw new Error("기존 PDF 북마크 구조를 안전하게 수정할 수 없습니다.");
        root = ctx.lookup(rootRef);
        if (!(root instanceof PDFDict)) throw new Error("기존 PDF 북마크를 안전하게 보존할 수 없습니다.");
        priorRef = root.get(name('Last'));
        const first = root.get(name('First'));
        if (Boolean(first) !== Boolean(priorRef)) throw new Error("기존 PDF 북마크 구조가 올바르지 않습니다.");
        if (priorRef && (!(priorRef instanceof PDFRef) || !(first instanceof PDFRef) ||
            !(ctx.lookup(priorRef) instanceof PDFDict) || ctx.lookup(priorRef).get(name('Next'))))
          throw new Error("기존 PDF 북마크 구조가 올바르지 않습니다.");
      } else {
        root = ctx.obj({Type:'Outlines'}); rootRef = ctx.register(root);
        pdfDoc.catalog.set(name('Outlines'), rootRef);
      }
      const countObject = root.lookupMaybe(name('Count'), PDFNumber);
      if (priorRef && !countObject) throw new Error("기존 PDF 북마크 개수를 확인할 수 없습니다.");
      const oldCount = countObject?.asNumber() || 0;
      if (oldCount < 0 || !Number.isSafeInteger(oldCount)) throw new Error("기존 PDF 북마크 개수를 확인할 수 없습니다.");
      const entries = bookmarks.map(bm => {
        const item = ctx.obj({Title: PDFHexString.fromText(String(bm.title)), Parent:rootRef,
          Dest:[pages[bm.page].ref, name('Fit')]});
        return {item, ref:ctx.register(item)};
      });
      entries.forEach((entry, i) => {
        const prev = i ? entries[i-1].ref : priorRef;
        if (prev) entry.item.set(name('Prev'), prev);
        if (i+1 < entries.length) entry.item.set(name('Next'), entries[i+1].ref);
      });
      if (priorRef) ctx.lookup(priorRef).set(name('Next'), entries[0].ref);
      else root.set(name('First'), entries[0].ref);
      root.set(name('Last'), entries[entries.length-1].ref);
      root.set(name('Count'), PDFNumber.of(oldCount + entries.length));
    }

    async function compileDocumentWithOverlays(doc) {
      if (!window.PDFLib) throw new Error("PDF 편집 엔진을 사용할 수 없습니다.");
      if (!window.SunriseEditState || !window.SunriseKoreanFont) throw new Error("PDF 편집 구성요소를 불러오지 못했습니다.");
      const { PDFDocument, degrees, rgb } = window.PDFLib;
      const pdfDoc = await PDFDocument.load(doc.bytes);
      if (doc.metadata.title) pdfDoc.setTitle(doc.metadata.title);
      if (doc.metadata.author) pdfDoc.setAuthor(doc.metadata.author);
      if (doc.metadata.subject) pdfDoc.setSubject(doc.metadata.subject);
      if (doc.metadata.keywords) pdfDoc.setKeywords([doc.metadata.keywords]);
      for (const attachment of doc.attachments.filter((item) => item.isNew)) {
        await pdfDoc.attach(attachment.bytes, attachment.name, attachment.type ? { mimeType: attachment.type } : {});
      }

      const pages = pdfDoc.getPages();
      const overlayPoint = (item, x, y) => {
        const radians = (item.rotation || 0) * Math.PI / 180;
        return [item.x + x * Math.cos(radians) - y * Math.sin(radians),
          item.y + x * Math.sin(radians) + y * Math.cos(radians)];
      };
      appendPdfBookmarks(pdfDoc, doc.bookmarks);
      const textTypes = new Set(["Text", "Header", "Footer", "PageNumber"]);
      const textItems = doc.overlays.filter((item) => textTypes.has(item.type));
      const textFont = textItems.length
        ? await window.SunriseKoreanFont.embed(pdfDoc, textItems.map((item) => item.text || "")) : null;
      const pageStreams = new Map();

      for (const item of doc.overlays) {
        if (item.pageIndex < 0 || item.pageIndex >= pages.length) throw new Error("삽입 항목의 페이지 위치가 잘못되어 저장을 중단했습니다.");
        const page = pages[item.pageIndex];
        if (!pageStreams.has(item.pageIndex)) {
          const stream = page.getContentStream(false);
          pageStreams.set(item.pageIndex, { stream, ref: page.contentStreamRef });
        }

        if (textTypes.has(item.type)) {
          const fontSize = item.fontSize || 13;
          const text = String(item.text || "").normalize("NFC").replace(/\t/g, " ");
          const lineHeight = fontSize * 1.3;
          const maxWidth = item.width ? Math.max(1, item.width - 14) : Infinity;
          const lines = [];
          for (const paragraph of text.split(/\r?\n/)) {
            let line = "";
            for (const char of paragraph) {
              const candidate = line + char;
              if (line && textFont.widthOfTextAtSize(candidate, fontSize) > maxWidth) {
                lines.push(line);
                line = char;
              } else line = candidate;
            }
            lines.push(line);
          }
          const viewPage = await doc.pdfJsDoc.getPage(item.pageIndex + 1);
          const viewport = viewPage.getViewport({ scale: 1 });
          const colorValue = /^#[0-9a-f]{6}$/i.test(item.color || "") ? item.color.slice(1) : "1B2631";
          const color = rgb(parseInt(colorValue.slice(0, 2), 16) / 255,
            parseInt(colorValue.slice(2, 4), 16) / 255, parseInt(colorValue.slice(4, 6), 16) / 255);
          for (const [lineIndex, line] of lines.entries()) {
            if (!line) continue;
            const [viewX,viewY] = overlayPoint(item, 7, 4 + fontSize * 1.05 + lineIndex * lineHeight);
            const [x,y] = viewport.convertToPdfPoint(viewX, viewY);
            page.drawText(line, { x, y, font: textFont, size: fontSize, color,
              rotate: degrees((viewPage.rotate || 0) - (item.rotation || 0)), opacity: item.opacity ?? 1 });
          }
          continue;
        }

        const offCanvas = document.createElement("canvas");
        const octx = offCanvas.getContext("2d");
        const fontSize = item.fontSize || 13;
        const rawText = item.type === "Note" ? `💬 ${item.text || ""}` : String(item.text || "");
        const lines = rawText.split(/\r?\n/);

        octx.font = `bold ${fontSize}px "Inter", "Noto Sans KR", "Malgun Gothic", sans-serif`;
        let measuredMaxW = 40;
        lines.forEach((ln) => {
          const m = octx.measureText(ln).width;
          if (m > measuredMaxW) measuredMaxW = m;
        });

        const defaultW = item.type === "Table" ? 240 : Math.ceil(measuredMaxW + 20);
        const lineH = Math.ceil(fontSize * 1.35);
        const defaultH = item.type === "Table" ? 64 : Math.max(26, lines.length * lineH + 12);

        const w = Math.max(40, item.width || defaultW);
        const h = Math.max(22, item.height || defaultH);
        const dpr = 3;
        offCanvas.width = Math.round(w * dpr);
        offCanvas.height = Math.round(h * dpr);
        octx.scale(dpr, dpr);

        if (item.bgColor && item.bgColor !== "transparent") {
          octx.fillStyle = item.bgColor;
          octx.fillRect(0, 0, w, h);
        }

        if (item.type === "Stamp") {
          octx.strokeStyle = item.color || "#1F6F9F";
          octx.lineWidth = 2;
          octx.strokeRect(1.5, 1.5, w - 3, h - 3);
        } else if (item.type === "Note") {
          octx.fillStyle = "#E58A18";
          octx.fillRect(0, 0, 4, h);
        }

        if (item.type === "Table" && Array.isArray(item.cells) && item.cells.length > 0) {
          const rows = item.cells.length;
          const cols = Math.max(1, item.cells[0]?.length || 1);
          const cw = w / cols;
          const ch = h / rows;
          octx.font = `11.5px "Inter", "Noto Sans KR", "Malgun Gothic", sans-serif`;
          item.cells.forEach((r, ri) => {
            r.forEach((c, ci) => {
              octx.fillStyle = ri === 0 ? "#EAF2F8" : "#FFFFFF";
              octx.fillRect(ci * cw, ri * ch, cw, ch);
              octx.strokeStyle = "#263746";
              octx.lineWidth = 1;
              octx.strokeRect(ci * cw, ri * ch, cw, ch);
              octx.fillStyle = "#1B2631";
              octx.fillText(String(c), ci * cw + 5, ri * ch + ch / 2 + 4);
            });
          });
        } else {
          octx.fillStyle = item.color || "#1B2631";
          octx.font = `bold ${fontSize}px "Inter", "Noto Sans KR", "Malgun Gothic", sans-serif`;
          if (item.type === "Stamp") {
            octx.textAlign = "center";
            octx.textBaseline = "middle";
            octx.fillText(lines[0] || "", w / 2, h / 2);
          } else {
            octx.textAlign = "left";
            octx.textBaseline = "top";
            lines.forEach((ln, idx) => {
              octx.fillText(ln, item.type === "Note" ? 8 : 5, 5 + idx * lineH);
            });
          }
        }

        const pngImage = await pdfDoc.embedPng(offCanvas.toDataURL("image/png"));
        const viewPage = await doc.pdfJsDoc.getPage(item.pageIndex + 1);
        const viewport = viewPage.getViewport({ scale: 1 });
        const [baseX, baseY] = overlayPoint(item, 0, h);
        let [x, y] = viewport.convertToPdfPoint(baseX, baseY);
        let angle = (viewPage.rotate || 0) - (item.rotation || 0);
        if (item.type === "Watermark") {
          angle += 24;
          const [viewCenterX, viewCenterY] = overlayPoint(item, w / 2, h / 2);
          const [centerX, centerY] = viewport.convertToPdfPoint(viewCenterX, viewCenterY);
          const radians = angle * Math.PI / 180;
          x = centerX - (w * Math.cos(radians) - h * Math.sin(radians)) / 2;
          y = centerY - (w * Math.sin(radians) + h * Math.cos(radians)) / 2;
        }
        page.drawImage(pngImage, {
          x, y, width: w, height: h, rotate: degrees(angle),
          opacity: item.opacity ?? 1,
        });
      }

      if (doc.overlays.length) window.SunriseEditState.record(pdfDoc, pageStreams, doc.overlays, window.PDFLib);
      return await pdfDoc.save();
    }

    // =========================================================================
    // Feature 1: PDF Merge Dialog
    // =========================================================================
    async function openMergePdfModal() {
      try {
        const queued = [];
        for (const [idx, d] of state.docs.entries()) {
          queued.push({ id: `mq_${Date.now()}_${idx}`, name: d.name,
            pages: d.pageCount, bytes: await compileDocumentWithOverlays(d) });
        }
        state.mergeQueue = queued;
      } catch (error) {

        return;
      }
      state.mergeSelectedIdx = state.mergeQueue.length > 0 ? 0 : -1;

      const defaultOutName =
        state.mergeQueue.length > 0
          ? state.mergeQueue[0].name.replace(/\.pdf$/i, "") + "_merged.pdf"

          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px">
            <strong id="mergeSummaryLabel" style="color:var(--primary);font-size:13px">병합 대상: 0개 파일 (총 0쪽)</strong>
            <span style="font-size:11.5px;color:var(--text-muted)">원본 파일은 변경되지 않으며 새 PDF로 병합됩니다.</span>
          </div>
          <div class="merge-layout">
            <div class="merge-file-list" id="mergeFileListBox"></div>
            <div class="merge-btn-col" style="display:flex;flex-direction:column;gap:5px">
              <button type="button" class="dialog-btn primary" id="mergeAddFilesBtn"><i class="fa-solid fa-plus"></i> 파일 추가</button>
              <button type="button" class="dialog-btn" id="mergeAddOpenDocsBtn"><i class="fa-solid fa-book-open"></i> 열린 문서 추가</button>
              <button type="button" class="dialog-btn" id="mergeMoveUpBtn"><i class="fa-solid fa-arrow-up"></i> 위로</button>
              <button type="button" class="dialog-btn" id="mergeMoveDownBtn"><i class="fa-solid fa-arrow-down"></i> 아래로</button>
              <button type="button" class="dialog-btn" id="mergeSortNameBtn"><i class="fa-solid fa-arrow-down-a-z"></i> 이름순 정렬</button>
              <button type="button" class="dialog-btn" id="mergeDuplicateItemBtn"><i class="fa-solid fa-clone"></i> 선택 복제</button>
              <button type="button" class="dialog-btn" id="mergeRemoveBtn"><i class="fa-solid fa-trash"></i> 선택 제거</button>
              <button type="button" class="dialog-btn" id="mergeClearBtn">전체 비우기</button>
            </div>
          </div>
          <div class="dialog-form-grid" style="margin-top:4px">
            <label for="mergeOutputNameInput">결과 파일명:</label>
            <input type="text" id="mergeOutputNameInput" class="dialog-input" value="${escapeHtml(defaultOutName)}" placeholder="병합 결과 PDF 파일명 (.pdf)" />
          </div>
        `,
        footerHtml: `
          <div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px">
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
              <input type="checkbox" id="mergeOpenAfterCheck" checked />
              <span>병합 완료 후 편집기 탭에서 바로 열기</span>
            </label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
              <input type="checkbox" id="mergeDownloadCheck" checked />
              <span>내 기기로 즉시 다운로드</span>
            </label>
          </div>
          <div class="modal-footer-right">
            <button type="button" class="dialog-btn primary" id="mergeExecuteBtn"><i class="fa-solid fa-object-group"></i> 병합 실행</button>
            <button type="button" class="dialog-btn" id="mergeCancelBtn">취소</button>
          </div>
        `,
        onMount: () => {
          renderMergeQueueList();

          document.getElementById("mergeAddFilesBtn").addEventListener("click", () => {
            document.getElementById("mergePdfInput").click();
          });

          document.getElementById("mergeAddOpenDocsBtn").addEventListener("click", async () => {
            if (state.docs.length === 0) {
              showToast("현재 열려 있는 문서가 없습니다.", "fa-circle-info");
              return;
            }
            try {
              const queued = [];
              for (const [idx, d] of state.docs.entries()) {
                queued.push({ id: `mq_${Date.now()}_open_${idx}`, name: d.name,
                  pages: d.pageCount, bytes: await compileDocumentWithOverlays(d) });
              }
              state.mergeQueue.push(...queued);
              state.mergeSelectedIdx = state.mergeQueue.length - 1;
              renderMergeQueueList();
            } catch (error) {
              showToast(`열린 문서를 병합 목록에 추가하지 못했습니다: ${error.message || error}`, "fa-circle-exclamation");
            }
          });

          document.getElementById("mergeMoveUpBtn").addEventListener("click", () => {
            const idx = state.mergeSelectedIdx;
            if (idx > 0 && idx < state.mergeQueue.length) {
              const tmp = state.mergeQueue[idx - 1];
              state.mergeQueue[idx - 1] = state.mergeQueue[idx];
              state.mergeQueue[idx] = tmp;
              state.mergeSelectedIdx = idx - 1;
              renderMergeQueueList();
            }
          });

          document.getElementById("mergeMoveDownBtn").addEventListener("click", () => {
            const idx = state.mergeSelectedIdx;
            if (idx >= 0 && idx < state.mergeQueue.length - 1) {
              const tmp = state.mergeQueue[idx + 1];
              state.mergeQueue[idx + 1] = state.mergeQueue[idx];
              state.mergeQueue[idx] = tmp;
              state.mergeSelectedIdx = idx + 1;
              renderMergeQueueList();
            }
          });

          document.getElementById("mergeSortNameBtn").addEventListener("click", () => {
            state.mergeQueue.sort((a, b) => a.name.localeCompare(b.name, "ko"));
            renderMergeQueueList();
          });

          document.getElementById("mergeDuplicateItemBtn").addEventListener("click", () => {
            const idx = state.mergeSelectedIdx;
            if (idx >= 0 && idx < state.mergeQueue.length) {
              const src = state.mergeQueue[idx];
              state.mergeQueue.splice(idx + 1, 0, {
                id: `mq_${Date.now()}_dup`,
                name: src.name,
                pages: src.pages,
                bytes: src.bytes.slice(0),
              });
              state.mergeSelectedIdx = idx + 1;
              renderMergeQueueList();
            }
          });

          document.getElementById("mergeRemoveBtn").addEventListener("click", () => {
            const idx = state.mergeSelectedIdx;
            if (idx >= 0 && idx < state.mergeQueue.length) {
              state.mergeQueue.splice(idx, 1);
              state.mergeSelectedIdx = Math.min(idx, state.mergeQueue.length - 1);
              renderMergeQueueList();
            }
          });

          document.getElementById("mergeClearBtn").addEventListener("click", () => {
            state.mergeQueue = [];
            state.mergeSelectedIdx = -1;
            renderMergeQueueList();
          });

          const listBox = document.getElementById("mergeFileListBox");
          listBox.addEventListener("dragover", (e) => {
            e.preventDefault();
          });
          listBox.addEventListener("drop", async (e) => {
            e.preventDefault();
            if (e.dataTransfer?.files?.length) {
              await addFilesToMergeQueue(e.dataTransfer.files);
            }
          });

          document.getElementById("mergeCancelBtn").addEventListener("click", closeModal);
          document.getElementById("mergeExecuteBtn").addEventListener("click", executePdfMergeFromModal);
        },
      });
    }

    function renderMergeQueueList() {
      const box = document.getElementById("mergeFileListBox");
      const summary = document.getElementById("mergeSummaryLabel");
      if (!box || !summary) return;

      const totalPages = state.mergeQueue.reduce((acc, item) => acc + (item.pages || 0), 0);
      summary.textContent = `병합 대상: ${state.mergeQueue.length}개 파일 (총 ${totalPages}쪽)`;

      if (state.mergeQueue.length === 0) {
        box.innerHTML = `
          <div style="margin:auto;text-align:center;padding:30px;color:var(--text-muted)">
            <i class="fa-solid fa-file-circle-plus" style="font-size:26px;margin-bottom:8px;color:var(--primary)"></i>
            <div><strong>[파일 추가]</strong> 또는 <strong>[열린 문서 추가]</strong>를 누르거나<br/>PDF 파일을 이곳으로 드래그하세요.</div>
          </div>
        `;
        return;
      }

      box.innerHTML = "";
      let dragSrcIndex = null;

      state.mergeQueue.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "merge-item" + (idx === state.mergeSelectedIdx ? " selected" : "");
        row.draggable = true;
        row.innerHTML = `
          <span style="display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden">
            <i class="fa-solid fa-grip-vertical" style="color:var(--text-muted)"></i>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${String(idx + 1).padStart(2, "0")}. ${escapeHtml(item.name)}</span>
          </span>
          <span style="font-size:11.5px;color:var(--primary);font-weight:700;flex-shrink:0">${item.pages}쪽</span>
        `;
        row.addEventListener("click", () => {
          state.mergeSelectedIdx = idx;
          renderMergeQueueList();
        });
        row.addEventListener("dragstart", (e) => {
          dragSrcIndex = idx;
          e.dataTransfer.effectAllowed = "move";
        });
        row.addEventListener("dragover", (e) => {
          e.preventDefault();
          row.classList.add("drag-over");
        });
        row.addEventListener("dragleave", () => {
          row.classList.remove("drag-over");
        });
        row.addEventListener("drop", (e) => {
          e.preventDefault();
          row.classList.remove("drag-over");
          if (dragSrcIndex !== null && dragSrcIndex !== idx) {
            const moved = state.mergeQueue.splice(dragSrcIndex, 1)[0];
            state.mergeQueue.splice(idx, 0, moved);
            state.mergeSelectedIdx = idx;
            renderMergeQueueList();
          }
        });
        box.appendChild(row);
      });
    }

    async function addFilesToMergeQueue(fileList) {
      for (const file of Array.from(fileList)) {
        if (!file.name.toLowerCase().endsWith(".pdf")) continue;
        try {
          const bytes = await readPdfInputFile(file);
          const info = await parsePageCountAndMeta(bytes);
          state.mergeQueue.push({ id: `mq_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            name: file.name, pages: info.pageCount, bytes });
          await info.pdfJsDoc.destroy();
        } catch (error) {
          showToast(`${file.name}: ${error.message || error}`, "fa-circle-exclamation");
        }
      }
      if (state.mergeSelectedIdx < 0 && state.mergeQueue.length > 0) {
        state.mergeSelectedIdx = 0;
      }
      renderMergeQueueList();
    }

    async function executePdfMergeFromModal() {
      if (state.mergeQueue.length < 2) {
        showToast("병합할 PDF를 2개 이상 목록에 추가하세요.", "fa-triangle-exclamation");
        return;
      }
      const outInput = document.getElementById("mergeOutputNameInput");
      let outName = (outInput?.value || "merged.pdf").trim();
      if (!outName.toLowerCase().endsWith(".pdf")) outName += ".pdf";

      const openAfter = Boolean(document.getElementById("mergeOpenAfterCheck")?.checked);
      const downloadNow = Boolean(document.getElementById("mergeDownloadCheck")?.checked);

      try {
        const { PDFDocument } = window.PDFLib;
        const mergedPdf = await PDFDocument.create();
        let totalMergedPages = 0;

        for (const item of state.mergeQueue) {
          const srcPdf = await PDFDocument.load(item.bytes);
          if (!allowPageFormStructure(srcPdf)) return;
          const indices = srcPdf.getPageIndices();
          const copiedPages = await mergedPdf.copyPages(srcPdf, indices);
          copiedPages.forEach((p) => mergedPdf.addPage(p));
          totalMergedPages += copiedPages.length;
        }

        const mergedBytes = await mergedPdf.save();
        closeModal();

        if (openAfter) {
          await openPdfFromBytes(outName, mergedBytes, { switchActive: true });
        }
        if (downloadNow) {
          downloadBytes(mergedBytes, outName);
        }
        showToast(`PDF 병합 완료: ${outName} (${state.mergeQueue.length}개 문서, 총 ${totalMergedPages}쪽)`, "fa-object-group");
      } catch (err) {
        showToast(`PDF 병합 중 오류 발생: ${err.message || err}`, "fa-circle-exclamation");
      }
    }

    // =========================================================================
    // Command Dispatcher
    // =========================================================================
    async function executeCommand(cmdId) {
      const doc = activeDoc();
      if (doc?.operationBusy) { showToast("페이지 작업을 처리하고 있습니다. 잠시 기다려 주세요.", "fa-hourglass-half"); return; }

      switch (cmdId) {
        case "openPdf":
          document.getElementById("openPdfInput").click();
          break;

        case "newBlankDoc":
          await createNewBlankDocument();
          break;

        case "saveAs":
          if (!doc) return;
          openSaveAsModal(doc);
