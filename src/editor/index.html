<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Sunrise PDF Editor — Web Edition (Chrome / Edge / Mobile)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="/assets/pdf-lib/pdf-lib.min.js"></script>
  <script src="/assets/korean-font.js"></script>
  <script src="/assets/sunrise-edit-state.js"></script>
  <script type="module">
    try {
      window.pdfjsLib = await import("/assets/pdfjs/pdf.min.mjs");
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "/assets/pdfjs/pdf.worker.min.mjs";
    } catch (error) {
      console.error("PDF renderer failed to load", error);
    }
  </script>
  <style>
    :root, html[data-theme="light"] {
      --workspace-bg: #F2F5F8;
      --surface: #FFFFFF;
      --surface-alt: #EAF0F5;
      --surface-soft: #F7F9FB;
      --group-alt: #FBFCFD;
      --border: #C7D1DA;
      --border-soft: #DCE3E9;
      --text: #263746;
      --text-muted: #647687;
      --primary: #1F6F9F;
      --primary-hover: #2B7FAF;
      --primary-soft: #DCEAF5;
      --primary-selected: #CFE3F2;
      --brand: #E58A18;
      --brand-soft: #FFF2DF;
      --success: #2F7D5A;
      --success-soft: #E7F5EE;
      --warning: #C97820;
      --danger: #C94B48;
      --danger-soft: #FDEDEC;
      --disabled: #9AA6B2;
      --canvas-bg: #D9E0E6;
      --shadow-sm: 0 2px 6px rgba(23, 61, 90, 0.08);
      --shadow-lg: 0 14px 36px rgba(15, 35, 52, 0.22);
      --modal-backdrop: rgba(15, 28, 40, 0.45);
      --info-box-bg: #EAF2F8;
      --info-box-border: #C5D7E5;
      --info-box-text: #234156;
    }

    html[data-theme="dark"] {
      --workspace-bg: #141C24;
      --surface: #1B2631;
      --surface-alt: #212F3D;
      --surface-soft: #17212B;
      --group-alt: #1E2936;
      --border: #314355;
      --border-soft: #283747;
      --text: #E6EEF6;
      --text-muted: #9FB0C2;
      --primary: #4BA8DF;
      --primary-hover: #62B8EB;
      --primary-soft: #1E3A52;
      --primary-selected: #244763;
      --brand: #F09B2D;
      --brand-soft: #3B2B16;
      --success: #48B884;
      --success-soft: #19382B;
      --warning: #E69938;
      --danger: #E56B67;
      --danger-soft: #3F1F21;
      --disabled: #5A6B7C;
      --canvas-bg: #0F151C;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 42px rgba(0, 0, 0, 0.58);
      --modal-backdrop: rgba(5, 10, 15, 0.68);
      --info-box-bg: #1C2B3A;
      --info-box-border: #324C63;
      --info-box-text: #D4E6F5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", "Noto Sans KR", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--workspace-bg);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    /* App Shell */
    #appShell {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--workspace-bg);
      overflow: hidden;
    }

    /* Top Command Bar */
    #workspaceCommandBar {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 44px;
      padding: 0 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #workspaceCommandBar::-webkit-scrollbar {
      display: none;
    }

    .brand-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 8px;
      line-height: 1.05;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--primary);
    }

    .brand-sub {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: 0.5px;
    }

    .cmd-divider {
      width: 1px;
      height: 22px;
      background: var(--border-soft);
      margin: 0 3px;
      flex-shrink: 0;
    }

    .quick-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background 0.14s, border-color 0.14s, color 0.14s;
      flex-shrink: 0;
    }

    .quick-icon-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .quick-icon-btn:disabled {
      color: var(--disabled);
      cursor: not-allowed;
      opacity: 0.55;
    }

    .doc-title-area {
      flex: 1;
      min-width: 160px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      overflow: hidden;
    }

    #workspaceDocumentTitle {
      font-weight: 600;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    #workspaceDocumentMeta {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid var(--border-soft);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .top-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .top-pill-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Ribbon Bar */
    #mainRibbon {
      display: flex;
      flex-direction: column;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #mainRibbon.hidden {
      display: none;
    }

    .ribbon-tabs {
      display: flex;
      align-items: stretch;
      height: 32px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      padding-left: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .ribbon-tabs::-webkit-scrollbar {
      display: none;
    }

    .ribbon-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 14px;
      border: none;
      border-right: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      font-size: 12.2px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s;
      flex-shrink: 0;
    }

    .ribbon-tab-btn:hover {
      background: var(--surface-soft);
      color: var(--primary);
    }

    .ribbon-tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      border-top: 2px solid var(--primary);
      font-weight: 700;
    }

    .ribbon-surface {
      display: flex;
      align-items: stretch;
      gap: 5px;
      padding: 5px 8px;
      min-height: 98px;
      background: var(--surface-soft);
      overflow-x: auto;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .ribbon-group {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 3px 4px 0 4px;
      flex-shrink: 0;
    }

    .ribbon-group:nth-child(even) {
      background: var(--group-alt);
    }

    .ribbon-group-body {
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 1px 2px;
      min-height: 66px;
    }

    .ribbon-group-title {
      height: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.8px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-alt);
      border-top: 1px solid var(--border-soft);
      margin: 2px -4px 0 -4px;
      border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;
      padding: 0 6px;
      white-space: nowrap;
    }

    .cmd-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 88px;
      min-width: 84px;
      max-width: 105px;
      min-height: 64px;
      height: auto;
      padding: 5px 3px 3px 3px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.13s;
      text-align: center;
      position: relative;
      flex-shrink: 0;
    }

    .cmd-btn i {
      font-size: 16px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      margin-bottom: 3px;
      transition: transform 0.12s;
    }

    .cmd-btn span {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      word-break: keep-all;
      overflow-wrap: break-word;
      display: block;
      overflow: visible;
    }

    .cmd-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .cmd-btn:hover:not(:disabled) i {
      transform: translateY(-1px);
    }

    .cmd-btn.active {
      background: var(--primary-selected);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    .cmd-btn.active::after {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 10px;
      right: 10px;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
    }

    .cmd-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .cmd-btn:disabled i {
      color: var(--disabled);
    }

    /* Main Workspace Flex Layout with Collapsible Left & Right Panels */
    #mainWorkspace {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      background: var(--workspace-bg);
      position: relative;
      overflow: hidden;
    }

    /* Left & Right Side Panels */
    .side-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      transition: width 0.18s ease, min-width 0.18s ease, transform 0.22s ease;
      flex-shrink: 0;
      position: relative;
      z-index: 20;
    }

    #leftNavigationPane {
      width: 245px;
      min-width: 245px;
    }

    #leftNavigationPane.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      border-right: none;
      overflow: hidden;
    }

    #rightInspectorPane {
      width: 280px;
      min-width: 280px;
      border-right: none;
      border-left: 1px solid var(--border);
    }

    #rightInspectorPane.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      border-left: none;
      overflow: hidden;
    }

    /* Center Edge Handle Toggle Buttons (Left & Right Vertical Middle Handles) */
    .panel-edge-handle {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 35;
      width: 18px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      color: var(--primary);
      border: 1px solid var(--border);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 0.15s, color 0.15s, width 0.15s, border-color 0.15s;
    }

    .panel-edge-handle:hover {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
      width: 22px;
    }

    #leftPanelEdgeToggle {
      left: 0;
      border-left: none;
      border-radius: 0 7px 7px 0;
    }

    #rightPanelEdgeToggle {
      right: 0;
      border-right: none;
      border-radius: 7px 0 0 7px;
    }

    /* Customizable Pane Tab Bar with Close (x) & Add (+) */
    .pane-tab-bar {
      display: flex;
      align-items: center;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      min-height: 33px;
    }

    .pane-tab-bar::-webkit-scrollbar {
      display: none;
    }

    .pane-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 8px 6px 10px;
      border: none;
      border-right: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s;
      flex-shrink: 0;
    }

    .pane-tab-btn:hover {
      background: var(--surface-soft);
      color: var(--primary);
    }

    .pane-tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      border-top: 2px solid var(--primary);
      font-weight: 700;
    }

    .pane-tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      font-size: 9.5px;
      color: var(--text-muted);
      transition: background 0.12s, color 0.12s;
    }

    .pane-tab-close:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .pane-tab-add-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 0 3px;
      border-radius: 4px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--primary);
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.14s;
    }

    .pane-tab-add-btn:hover {
      background: var(--primary-soft);
      border-style: solid;
      border-color: var(--primary);
    }

    .pane-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      -webkit-overflow-scrolling: touch;
    }

    /* Thumbnail List */
    #thumbnailContainer {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .thumb-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      border-radius: 6px;
      border: 1.5px solid var(--border-soft);
      background: var(--surface-soft);
      cursor: pointer;
      transition: all 0.14s;
      position: relative;
    }

    .thumb-card:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .thumb-card.selected {
      border-color: var(--primary);
      background: var(--primary-selected);
      box-shadow: var(--shadow-sm);
    }

    .thumb-canvas-wrap {
      background: #FFFFFF;
      border: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      overflow: hidden;
    }

    .thumb-canvas-wrap canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .thumb-label {
      margin-top: 5px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
    }

    /* Page Nav Control Card (bottom of left panel) */
    #pageNavControlCard {
      padding: 8px 10px;
      background: var(--surface-soft);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    #pageStatusBanner {
      text-align: center;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 4px 6px;
      border-radius: 4px;
    }

    .nav-grid-row {
      display: grid;
      grid-template-columns: 46px 1fr 48px;
      align-items: center;
      gap: 5px;
    }

    .nav-grid-row label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .compact-input {
      width: 100%;
      height: 26px;
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
    }

    .compact-btn {
      height: 26px;
      padding: 0 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .compact-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Center Viewer Column */
    #centerViewerColumn {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--canvas-bg);
      position: relative;
    }

    /* Document Tab Bar */
    #docTabBar {
      display: flex;
      align-items: center;
      height: 34px;
      padding: 0 8px;
      gap: 4px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }

    #docTabBar::-webkit-scrollbar {
      display: none;
    }

    .doc-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 10px;
      border-radius: 5px 5px 0 0;
      border: 1px solid var(--border-soft);
      border-bottom: none;
      background: var(--surface-soft);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      margin-top: 5px;
      transition: all 0.14s;
      flex-shrink: 0;
    }

    .doc-tab.active {
      background: var(--surface);
      color: var(--primary);
      font-weight: 700;
      border-top: 2px solid var(--primary);
    }

    .doc-tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
    }

    .doc-tab-close:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* Context Tool Palette (Floating bar when an insert item is selected) */
    #contextToolPalette {
      position: absolute;
      top: 44px;
      right: 24px;
      z-index: 30;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1.5px solid var(--primary);
      border-radius: 7px;
      box-shadow: var(--shadow-lg);
      flex-wrap: wrap;
    }

    #contextToolPalette.visible {
      display: flex;
    }

    /* Canvas Viewport */
    #canvasViewport {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 26px;
      position: relative;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    #swipePageIndicator {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 38;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--primary);
      border: 1.5px solid var(--primary);
      box-shadow: var(--shadow-lg);
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    #swipePageIndicator.visible {
      opacity: 0.96;
      transform: translateX(-50%) translateY(-4px);
    }

    #pagesFlow { display: grid; gap: 16px; align-items: start; flex: none; padding-bottom: 20px; }
    .page-slot { position: relative; background: white; box-shadow: 0 6px 24px rgba(0,0,0,.18); flex: none; }
    .page-slot > canvas { display: block; width: 100%; height: 100%; }
    .page-preview-overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .page-preview-overlay * { pointer-events: none !important; }
    #pageViewMode { max-width: 112px; font-size: 11px; padding: 4px; border: 1px solid var(--border-soft); border-radius: 4px; background: var(--surface); color: var(--text); }
    #pageStage {
      position: relative;
      background: #FFFFFF;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
      border: 1px solid var(--border);
      transition: width 0.1s, height 0.1s;
    }

    #pdfRenderCanvas {
      display: block;
    }
    #pageStage[data-loading="true"]::after {
      content: "페이지 표시 중…"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: #687582; font-size: 12px; pointer-events: none;
    }

    #annotationOverlay {
      position: absolute;
      inset: 0;
      pointer-events: auto;
      overflow: hidden;
    }

    @font-face {
      font-family: "Sunrise Korean";
      src: url("/assets/fonts/DroidSansFallback.ttf") format("truetype");
      font-display: swap;
    }

    .overlay-item {
      font-family: "Sunrise Korean", "Noto Sans KR", sans-serif;
      position: absolute;
      cursor: pointer;
      padding: 4px 7px;
      border: 1.5px dashed transparent;
      border-radius: 3px;
      transition: border-color 0.12s, box-shadow 0.12s;
      user-select: none;
      white-space: pre-wrap;
      line-height: 1.3;
      touch-action: none;
    }

    .overlay-item:hover {
      border-color: var(--primary);
    }

    .overlay-item.selected {
      border: 2px solid var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 159, 0.22);
    }

    .overlay-item.move-mode {
      cursor: move;
    }

    .overlay-resize-handle {
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 11px;
      height: 11px;
      border-radius: 2px;
      background: var(--primary);
      border: 1.5px solid #FFFFFF;
      cursor: nwse-resize;
      display: none;
      z-index: 5;
    }

    .overlay-item.selected .overlay-resize-handle {
      display: block;
    }

    .inline-search-box {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 30px;
      padding: 0 6px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      flex-shrink: 0;
    }

    .inline-search-box:focus-within {
      border-color: var(--primary);
      background: var(--surface);
    }

    .inline-search-input {
      width: 115px;
      border: none;
      background: transparent;
      font-size: 12px;
      color: var(--text);
      outline: none;
    }

    .inline-search-count {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 32px;
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      .inline-search-box {
        display: none;
      }
    }

    .overlay-table {
      border-collapse: collapse;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.92);
    }

    .overlay-table td, .overlay-table th {
      border: 1px solid #263746;
      padding: 3px 6px;
      font-size: 11px;
      color: #1B2631;
    }

    /* Empty Workspace Dropzone */
    #emptyDropState {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 480px;
      margin: auto;
      padding: 32px 24px;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    /* Right Inspector Cards */
    .inspector-card {
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .inspector-card-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .quick-action-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      margin-bottom: 5px;
      border-radius: 5px;
      border: 1px solid var(--border-soft);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.14s;
      text-align: left;
    }

    .quick-action-btn i {
      width: 18px;
      text-align: center;
      color: var(--primary);
    }

    .quick-action-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .list-row-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 8px;
      border-radius: 5px;
      border: 1px solid var(--border-soft);
      background: var(--surface);
      margin-bottom: 5px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.12s;
    }

    .list-row-item:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    /* Bottom Operational Bar */
    #bottomOperationalBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 30px;
      padding: 0 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-muted);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    /* Mobile Bottom Navigation Bar (Shown on Mobile/Tablet <= 820px) */
    #mobileBottomNav {
      display: none;
      align-items: stretch;
      justify-content: space-around;
      height: 52px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 45;
      padding: 2px 4px;
    }

    .mobile-nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 10.5px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .mobile-nav-btn i {
      font-size: 15px;
      color: var(--primary);
    }

    .mobile-nav-btn.active, .mobile-nav-btn:active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .mobile-page-stepper {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      background: var(--surface-soft);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      margin: 4px 2px;
    }

    #mobileDrawerBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 30, 0.45);
      z-index: 48;
      backdrop-filter: blur(1px);
    }

    #mobileDrawerBackdrop.open {
      display: block;
    }

    /* Unified Sunrise Modal System */
    #modalBackdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--modal-backdrop);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      backdrop-filter: blur(2px);
    }

    #modalBackdrop.open {
      display: flex;
    }

    .sunrise-modal {
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      background: var(--workspace-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: modalFadeIn 0.15s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .modal-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .dialog-info-box {
      padding: 9px 12px;
      border-radius: 6px;
      background: var(--info-box-bg);
      border: 1px solid var(--info-box-border);
      color: var(--info-box-text);
      font-size: 12px;
      line-height: 1.45;
    }

    .dialog-form-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      align-items: center;
      gap: 8px 10px;
    }

    .dialog-form-grid label {
      font-weight: 600;
      font-size: 12px;
      color: var(--text);
    }

    .dialog-input, .dialog-select, .dialog-textarea {
      width: 100%;
      padding: 6px 9px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12.5px;
    }

    .dialog-input:focus, .dialog-select:focus, .dialog-textarea:focus {
      outline: none;
      border: 2px solid var(--primary);
      padding: 5px 8px;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 11px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .modal-footer-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .dialog-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 32px;
      min-width: 74px;
      padding: 5px 14px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s;
    }

    .dialog-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .dialog-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .dialog-btn.primary:hover:not(:disabled) {
      background: var(--primary-hover);
      color: #FFFFFF;
    }

    .dialog-btn.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #FFFFFF;
    }

    /* Merge List Box inside Merge Modal */
    .merge-layout {
      display: grid;
      grid-template-columns: 1fr 140px;
      gap: 10px;
      min-height: 230px;
    }

    .merge-file-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      overflow-y: auto;
      max-height: 260px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .merge-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 5px;
      border: 1px solid var(--border-soft);
      background: var(--surface-soft);
      font-size: 12px;
      cursor: grab;
      transition: all 0.12s;
    }

    .merge-item.selected {
      background: var(--primary-selected);
      border-color: var(--primary);
      font-weight: 600;
    }

    .merge-item.drag-over {
      border-top: 2px solid var(--brand);
    }

    /* Toast Banner */
    #toastContainer {
      position: fixed;
      bottom: 58px;
      right: 16px;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      max-width: calc(100vw - 32px);
    }

    .sunrise-toast {
      padding: 9px 14px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      border-left: 4px solid var(--primary);
      box-shadow: var(--shadow-lg);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 1280px) {
      #workspacePanelMgrBtn span, #themeToggleLabel, #ribbonToggleLabel { display: none; }
      .top-pill-btn { padding: 0 8px; }
    }
    #placementHint { display: none; padding: 6px 10px; background: var(--primary-soft); color: var(--text); font-size: 12px; }
    #pageStage.placement-mode, #pageStage.placement-mode * { cursor: crosshair !important; }
    #zoomSlider { width: 90px; accent-color: var(--primary); }

    /* =====================================================================
       Mobile & Tablet Responsive Adjustments (<= 820px)
       ===================================================================== */
    @media (max-width: 820px) {
      #backendStatusBadge {
        display: none;
      }

      #themeToggleLabel, #ribbonToggleLabel {
        display: none;
      }

      .top-pill-btn {
        padding: 0 8px;
      }

      /* Side panes turn into slide-over drawers on mobile so the PDF canvas has 100% width */
      #leftNavigationPane, #rightInspectorPane {
        position: fixed;
        top: 44px;
        bottom: 52px;
        z-index: 60;
        width: min(84vw, 310px) !important;
        min-width: min(84vw, 310px) !important;
        box-shadow: var(--shadow-lg);
      }

      #leftNavigationPane {
        left: 0;
        transform: translateX(0);
      }

      #leftNavigationPane.collapsed {
        transform: translateX(-105%);
      }

      #rightInspectorPane {
        right: 0;
        transform: translateX(0);
      }

      #rightInspectorPane.collapsed {
        transform: translateX(105%);
      }

      #canvasViewport {
        padding: 10px 14px;
      }

      .panel-edge-handle {
        width: 20px;
        height: 58px;
        opacity: 0.92;
      }

      #bottomOperationalBar {
        display: none;
      }

      #mobileBottomNav {
        display: flex;
      }

      .ribbon-surface {
        min-height: 86px;
        padding: 4px 6px;
      }

      .cmd-btn {
        width: 80px;
        min-width: 80px;
        height: auto;
        min-height: 60px;
      }

      .dialog-form-grid {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .merge-layout {
        grid-template-columns: 1fr;
      }

      .merge-btn-col {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px !important;
      }

      #contextToolPalette {
        top: 40px;
        left: 10px;
        right: 10px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="appShell">
    <!-- Hidden File Inputs for Browser File Operations -->
    <input type="file" id="openPdfInput" accept=".pdf,application/pdf" multiple style="display:none" />
    <input type="file" id="mergePdfInput" accept=".pdf,application/pdf" multiple style="display:none" />
    <input type="file" id="insertPdfInput" accept=".pdf,application/pdf" style="display:none" />
    <input type="file" id="imageToPdfInput" accept="image/png,image/jpeg" multiple style="display:none" />
    <input type="file" id="attachmentInput" multiple style="display:none" />

    <!-- Top Persistent Workspace Command Bar -->
    <header id="workspaceCommandBar">
      <div class="brand-box">
        <span class="brand-title">SUNRISE</span>
        <span class="brand-sub">PDF EDITOR WEB</span>
      </div>

      <button type="button" class="quick-icon-btn" id="quickOpenBtn" title="PDF 열기 (Ctrl+O)">
        <i class="fa-solid fa-folder-open"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickSaveBtn" title="다른 이름으로 저장 (Ctrl+Shift+S)">
        <i class="fa-solid fa-floppy-disk"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickUndoBtn" title="실행 취소 (Ctrl+Z)">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickRedoBtn" title="다시 실행 (Ctrl+Y)">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickPrevBtn" title="이전 페이지 (PgUp)">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickNextBtn" title="다음 페이지 (PgDown)">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickZoomOutBtn" title="축소 (Ctrl+-)">
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickZoomInBtn" title="확대 (Ctrl+=)">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickFitWidthBtn" title="폭맞춤 (Ctrl+0)">
        <i class="fa-solid fa-arrows-left-right"></i>
      </button>
      <button type="button" class="quick-icon-btn" id="quickFitPageBtn" title="쪽맞춤 (Ctrl+1)">
        <i class="fa-solid fa-expand"></i>
      </button>
      <div class="cmd-divider"></div>

      <button type="button" class="quick-icon-btn" id="quickSearchBtn" title="문서 검색 대화상자 (Ctrl+F)">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <div class="inline-search-box" title="빠른 본문/주석 검색 (Enter: 다음 결과)">
        <input type="text" id="inlineSearchInput" class="inline-search-input" placeholder="빠른 검색 (Ctrl+F)" />
        <span id="inlineSearchCount" class="inline-search-count">-</span>
        <button type="button" class="quick-icon-btn" id="inlineSearchPrevBtn" style="width:22px;height:22px" title="이전 검색 결과">
          <i class="fa-solid fa-chevron-up" style="font-size:10px"></i>
        </button>
        <button type="button" class="quick-icon-btn" id="inlineSearchNextBtn" style="width:22px;height:22px" title="다음 검색 결과">
          <i class="fa-solid fa-chevron-down" style="font-size:10px"></i>
        </button>
      </div>

      <div class="doc-title-area">
        <span id="workspaceDocumentTitle">문서를 불러오는 중...</span>
        <span id="workspaceDocumentMeta"></span>
      </div>


      <button type="button" class="top-pill-btn" id="workspacePanelMgrBtn" title="좌/우측 패널 추가 및 삭제 관리">
        <i class="fa-solid fa-table-columns"></i>
        <span>패널 관리</span>
      </button>

      <button type="button" class="top-pill-btn" id="workspaceThemeToggle" title="라이트/다크 모드 전환 (Ctrl+Shift+L)">
        <i class="fa-solid fa-sun" id="themeToggleIcon"></i>
        <span id="themeToggleLabel">라이트 모드</span>
      </button>

      <button type="button" class="top-pill-btn" id="workspaceRibbonToggle" title="상단 리본 표시/숨기기 (Ctrl+F1)">
        <i class="fa-solid fa-chevron-up" id="ribbonToggleIcon"></i>
        <span id="ribbonToggleLabel">리본 숨기기</span>
      </button>
    </header>

      <!-- General PDF ribbon (specialized domain functions excluded) -->
    <nav id="mainRibbon" aria-label="주 기능 리본">
      <div class="ribbon-tabs" id="ribbonTabHeader"></div>
      <div class="ribbon-surface" id="ribbonCommandSurface"></div>
    </nav>

    <!-- Mobile Backdrop for Slide-Over Side Panels -->
    <div id="mobileDrawerBackdrop"></div>

    <!-- Main 3-Column Workspace -->
    <main id="mainWorkspace">
      <!-- Left Navigation Panel (Collapsible & Customizable Tabs) -->
      <aside class="side-pane" id="leftNavigationPane">
        <div class="pane-tab-bar" id="leftTabBar">
          <button type="button" class="pane-tab-btn active" data-left-tab="pages">페이지</button>
        </div>

        <div class="pane-body">
          <div class="pane-scroll" id="leftPaneContent">
            <div id="thumbnailContainer"></div>
          </div>

          <div id="pageNavControlCard">
            <div id="pageStatusBanner">현재 페이지: 1 / 전체: 1</div>
            <div class="nav-grid-row">
              <label for="pageJumpSpin">쪽 이동</label>
              <input type="number" id="pageJumpSpin" class="compact-input" min="1" value="1" />
              <button type="button" id="pageJumpBtn" class="compact-btn">이동</button>
            </div>
            <div class="nav-grid-row">
              <label for="zoomPercentSpin">배율(%)</label>
              <input type="number" id="zoomPercentSpin" class="compact-input" min="25" max="400" step="5" value="100" />
              <button type="button" id="zoomPercentBtn" class="compact-btn">적용</button>
            </div>
          </div>
        </div>
      </aside>

      <!-- Center PDF Viewer & Document Tabs -->
      <section id="centerViewerColumn">
        <!-- Left & Right Center Vertical Collapse/Expand Handle Buttons -->
        <button type="button" class="panel-edge-handle" id="leftPanelEdgeToggle" title="좌측 탐색 패널 열기/닫기">
          <i class="fa-solid fa-chevron-left" id="leftPanelEdgeIcon"></i>
        </button>

    function isMobileViewport() {
      return window.innerWidth <= 820;
    }

    function activeDoc() {
      if (state.activeDocIndex >= 0 && state.activeDocIndex < state.docs.length) {
        return state.docs[state.activeDocIndex];
      }
      return null;
    }

    function showToast(message, icon = "fa-circle-check") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "sunrise-toast";
      toast.innerHTML = `<i class="fa-solid ${icon}" style="color:var(--primary)"></i><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transition = "opacity 0.25s";
        setTimeout(() => toast.remove(), 260);
      }, 2600);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function openModal({ title, icon = "fa-layer-group", width = "640px", bodyHtml, footerHtml, onMount }) {
      const backdrop = document.getElementById("modalBackdrop");
      const box = document.getElementById("modalBox");
      const titleEl = document.getElementById("modalTitle");
      const bodyEl = document.getElementById("modalBody");
      const footerEl = document.getElementById("modalFooter");

      box.style.maxWidth = width;
      titleEl.innerHTML = `<i class="fa-solid ${icon}"></i><span>${escapeHtml(title)}</span>`;
      bodyEl.innerHTML = bodyHtml;
      footerEl.innerHTML = footerHtml || `
        <div></div>
        <div class="modal-footer-right">
          <button type="button" class="dialog-btn primary" id="modalDefaultOkBtn">확인</button>
        </div>
      `;
      backdrop.classList.add("open");

      const defaultOk = document.getElementById("modalDefaultOkBtn");
      if (defaultOk) {
        defaultOk.addEventListener("click", closeModal);
      }
      if (typeof onMount === "function") {
        onMount(bodyEl, footerEl);
      }
    }

    let pendingSaveUrl = null;
    function closeModal() {
      if (pendingSaveUrl) {
        const url = pendingSaveUrl;
        pendingSaveUrl = null;
        // Downloads may start asynchronously after the user clicks the link.
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    function downloadBytes(bytes, filename, mime = "application/pdf") {
      const blob = new Blob([bytes], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    function syncSidePaneDomState() {
      const leftPane = document.getElementById("leftNavigationPane");
      const rightPane = document.getElementById("rightInspectorPane");
      const leftIcon = document.getElementById("leftPanelEdgeIcon");
      const rightIcon = document.getElementById("rightPanelEdgeIcon");
      const leftHandle = document.getElementById("leftPanelEdgeToggle");
      const rightHandle = document.getElementById("rightPanelEdgeToggle");
      const backdrop = document.getElementById("mobileDrawerBackdrop");

      const leftCollapsed = state.leftPaneCollapsed || state.leftPanels.length === 0;
      const rightCollapsed = state.rightPaneCollapsed || state.rightPanels.length === 0;

      leftPane.classList.toggle("collapsed", leftCollapsed);
      rightPane.classList.toggle("collapsed", rightCollapsed);

      leftIcon.className = leftCollapsed ? "fa-solid fa-chevron-right" : "fa-solid fa-chevron-left";
      rightIcon.className = rightCollapsed ? "fa-solid fa-chevron-left" : "fa-solid fa-chevron-right";

      rightHandle.title = rightCollapsed ? "우측 작업 패널 열기" : "우측 작업 패널 닫기";

      const mobRightBtn = document.getElementById("mobRightPaneBtn");

      if (mobRightBtn) mobRightBtn.classList.toggle("active", !rightCollapsed);

        backdrop.classList.add("open");

        typeof forceCollapsed === "boolean" ? forceCollapsed : !state.leftPaneCollapsed;

    // =========================================================================
    // Document Model & PDF Loading
    // =========================================================================
    let docIdCounter = 1;
    let overlayIdCounter = 1;

    function pdfJsLoadOptions(bytes) {
      return { data: bytes.slice(0), cMapUrl: "/assets/pdfjs/cmaps/", cMapPacked: true,
        standardFontDataUrl: "/assets/pdfjs/standard_fonts/", wasmUrl: "/assets/pdfjs/wasm/",
        iccUrl: "/assets/pdfjs/iccs/", isEvalSupported: false };
    }

    async function parsePageCountAndMeta(bytes) {
      if (!window.PDFLib || !window.pdfjsLib) throw new Error("PDF 엔진을 불러오지 못했습니다.");
      let pdfDoc;
      try {
        // Encrypted documents cannot safely be edited by pdf-lib.
        pdfDoc = await window.PDFLib.PDFDocument.load(bytes);
      } catch (error) {
        throw new Error("PDF를 편집할 수 없습니다. 손상되었거나 암호로 보호된 파일인지 확인해 주세요.");
      }
      if (pdfDoc.getPageCount() < 1) throw new Error("페이지가 없는 PDF입니다.");
      const metadata = {
        title: pdfDoc.getTitle() || "", author: pdfDoc.getAuthor() || "",
        subject: pdfDoc.getSubject() || "", keywords: pdfDoc.getKeywords() || "",
      };
      const loadingTask = window.pdfjsLib.getDocument(pdfJsLoadOptions(bytes));
      let pdfJsDoc;
      try { pdfJsDoc = await loadingTask.promise; }
      catch (error) { throw new Error("PDF를 표시할 수 없습니다. 손상되었거나 지원하지 않는 파일입니다."); }
      const pageCount = pdfJsDoc.numPages;
      const pageSizes = [];
      const pageTexts = [];
      let attachments = [];
      let attachmentsReadable = true;
      try {
        const embedded = await pdfJsDoc.getAttachments();
        attachments = Object.values(embedded || {}).map((item) => ({
          name: item.filename, bytes: new Uint8Array(item.content), type: "", isNew: false,
        }));
      } catch (error) {
        attachmentsReadable = false;
        console.warn("Unable to read PDF attachments", error);
      }
      for (let p = 1; p <= pageCount; p++) {
        const page = await pdfJsDoc.getPage(p);
        const viewport = page.getViewport({ scale: 1 });
        pageSizes.push({ width: viewport.width, height: viewport.height });
        pageTexts.push(null);
      }
      return { pageCount, pageSizes, metadata, pdfJsDoc, pageTexts, attachments, attachmentsReadable };
    }

    async function ensurePageTexts(doc) {
      if (doc.pageTexts.every(text => text !== null)) return true;
      const reader = doc.pdfJsDoc, texts = doc.pageTexts;
      if (doc.textExtraction?.reader === reader) return doc.textExtraction.promise;
      const promise = (async () => {
        for (let i = 0; i < texts.length; i++) {
          if (doc.pdfJsDoc !== reader) return false;
          if (texts[i] !== null) continue;
          try {
            const page = await reader.getPage(i + 1);
            const content = await page.getTextContent();
            if (doc.pdfJsDoc !== reader) return false;
            texts[i] = content.items.map(item => item.str || "").join(" ");
          } catch (error) {
            if (doc.pdfJsDoc !== reader) return false;
            console.warn(`Unable to extract text from page ${i + 1}`, error);
            texts[i] = "";
          }
        }
        return true;
      })();
      doc.textExtraction = { reader, promise };
      try { return await promise; }
      finally { if (doc.textExtraction?.promise === promise) doc.textExtraction = null; }
    }

    async function openPdfFromBytes(fileName, uint8Bytes, options = { switchActive: true }) {
      const originalBytes = uint8Bytes instanceof Uint8Array ? uint8Bytes : new Uint8Array(uint8Bytes);
      if (!window.PDFLib || !window.pdfjsLib) throw new Error("PDF 편집 엔진을 불러오지 못했습니다. 페이지를 새로고침해 주세요.");
      if (originalBytes.byteLength < 8 || new TextDecoder("ascii").decode(originalBytes.slice(0, 8)).indexOf("%PDF-") !== 0) {
        throw new Error("유효한 PDF 파일이 아닙니다.");
      }
      if (originalBytes.byteLength > 50 * 1024 * 1024) throw new Error("50MB 이하 PDF를 선택해 주세요.");
      let restored;
      try { restored = await window.SunriseEditState.restore(originalBytes, window.PDFLib); }
      catch (error) { throw new Error("PDF를 편집할 수 없습니다. 손상되었거나 암호로 보호된 파일인지 확인해 주세요."); }
      const bytes = restored.bytes;
      const info = await parsePageCountAndMeta(bytes);
      if (!info.pdfJsDoc) throw new Error("PDF 문서를 읽지 못했습니다. 손상되거나 암호로 보호된 파일일 수 있습니다.");

      const newDoc = {
        id: `doc_${docIdCounter++}`,
        name: fileName,
        bytes: bytes,
        pdfJsDoc: info.pdfJsDoc,
        pageCount: info.pageCount,
        pageSizes: info.pageSizes,
        pageTexts: info.pageTexts,
        currentPage: 0,
        selectedPages: new Set([0]),
        zoom: 1.0,
        fitMode: "page",
        dirty: false,
        metadata: info.metadata,
        bookmarks: [],
        attachments: info.attachments,
        attachmentsReadable: info.attachmentsReadable,
        overlays: restored.overlays.map((item) => ({ ...item, id: `ov_${overlayIdCounter++}` })),
        editRestorationBlocked: restored.warning,
        history: [`문서 열기: ${fileName} (${info.pageCount}쪽)`],
        undoStack: [],
        redoStack: [],
      };

      if (options && options.isSample) {
        newDoc.overlays.push({
          id: `ov_${overlayIdCounter++}`,
          pageIndex: 0,
          type: "Stamp",
          text: "검토완료 (APPROVED)",
          x: 380,
          y: 105,
          width: 155,
          height: 36,
          fontSize: 13,
          color: "#1F6F9F",
          bgColor: "rgba(220, 234, 245, 0.88)",
          opacity: 0.95,
        });
      }

      state.docs.push(newDoc);
      addRecentFile(fileName, info.pageCount, originalBytes);

      if (restored.warning) showToast("이 PDF의 저장된 편집 항목을 안전하게 복원하지 못했습니다. 원본 표시는 유지됩니다.", "fa-circle-exclamation");

      if (options.switchActive !== false) {
        await setActiveDocument(state.docs.length - 1);
      } else {
        renderDocTabs();
        updateCommandStates();
      }
      return newDoc;
    }

    function addRecentFile(name, pageCount, bytes) {
      state.recentFiles = state.recentFiles.filter((r) => r.name !== name);
      state.recentFiles.unshift({
        name,
        pageCount,
        openedAt: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
        bytes: bytes.slice(0),
      });
      if (state.recentFiles.length > 15) state.recentFiles.pop();
    }

    async function reloadDocPdfJs(doc, options = {}) {
      const info = options.info || await parsePageCountAndMeta(doc.bytes);
      const previous = doc.pdfJsDoc;
      doc.pdfJsDoc = info.pdfJsDoc;
      doc.pageCount = info.pageCount;
      doc.pageSizes = info.pageSizes;
      doc.pageTexts = info.pageTexts;
      if (doc.currentPage >= doc.pageCount) {
        doc.currentPage = Math.max(0, doc.pageCount - 1);
      }
      doc.selectedPages = options.selection
        ? new Set(options.selection.filter(index => index >= 0 && index < doc.pageCount))
        : new Set([doc.currentPage]);
      if (!doc.selectedPages.size) doc.selectedPages.add(doc.currentPage);
      if (previous) previous.destroy().catch((error) => console.warn("PDF cleanup failed", error));
    }

    function saveUndoSnapshot(doc, actionLabel) {
      if (!doc) return;
      doc.undoStack.push({
        bytes: doc.bytes,
        overlays: JSON.parse(JSON.stringify(doc.overlays)),
        bookmarks: JSON.parse(JSON.stringify(doc.bookmarks)),
        attachments: doc.attachments.map((item) => ({ ...item, bytes: item.bytes.slice(0) })),
        metadata: JSON.parse(JSON.stringify(doc.metadata)),
        currentPage: doc.currentPage,
        label: actionLabel,
      });
      if (doc.undoStack.length > 25) doc.undoStack.shift();
      doc.redoStack = [];
      doc.dirty = true;
      doc.history.unshift(`${new Date().toLocaleTimeString("ko-KR")} · ${actionLabel}`);
    }

    async function performUndo() {
      const doc = activeDoc();
      if (!doc || doc.operationBusy || doc.undoStack.length === 0) return;
      const snap = doc.undoStack.pop();
      doc.redoStack.push({
        bytes: doc.bytes,
        overlays: JSON.parse(JSON.stringify(doc.overlays)),
        bookmarks: JSON.parse(JSON.stringify(doc.bookmarks)),

        metadata: JSON.parse(JSON.stringify(doc.metadata)),

      doc.bytes = snap.bytes;
      doc.overlays = snap.overlays;
      doc.bookmarks = snap.bookmarks;

      doc.metadata = snap.metadata;

      await refreshAllViews();

    }

    async function performRedo() {
      const doc = activeDoc();

      const snap = doc.redoStack.pop();
      doc.undoStack.push({
        bytes: doc.bytes,

    async function setActiveDocument(index) {

    function updateCommandStates() {

        stageEl.style.display = "none";
        flowEl.style.display = "none";
        if (flowDoc) {
          flowEpoch++; flowQueue = []; flowVisibleSlots.clear(); flowObserver?.disconnect();
          stageEl.remove(); flowEl.replaceChildren(stageEl); flowDoc = null; flowBytes = null; flowKey = "";
        }
        statusBanner.textContent = "현재 페이지: - / 전체: -";

      metaEl.textContent = `· ${doc.pageCount}쪽 · 현재 ${doc.currentPage + 1}쪽`;
      statusBanner.textContent = `현재 페이지: ${doc.currentPage + 1} / 전체: ${doc.pageCount}`;
      jumpSpin.max = String(doc.pageCount);
      jumpSpin.value = String(doc.currentPage + 1);
      zoomSpin.value = String(Math.round(doc.zoom * 100));

      document.getElementById("statusDocSummary").textContent = `${doc.name} (${doc.currentPage + 1}/${doc.pageCount}쪽)`;
      document.getElementById("statusZoomSummary").textContent = `배율: ${Math.round(doc.zoom * 100)}%`;
      const selPages = Array.from(doc.selectedPages).sort((a, b) => a - b).map((p) => `${p + 1}쪽`).join(", ");
      document.getElementById("statusSelectionSummary").textContent = `선택: ${selPages || (doc.currentPage + 1) + "쪽"}`;

      const palette = document.getElementById("contextToolPalette");

        palette.classList.remove("visible");
      }
    }

    function viewColumns() { return state.viewMode === "2" ? 2 : state.viewMode === "3" ? 3 : 1; }
    let flowDoc = null, flowBytes = null, flowKey = "", flowObserver = null, flowEpoch = 0;
    let displayReader = null;
    let flowQueue = [], flowRunning = 0, flowScrollFrame = 0, flowFromScroll = false;
    const flowVisibleSlots = new Set();
    function syncThumbnailSelection(doc) {
      const wrap = document.getElementById("thumbnailContainer");
      if (!wrap || wrap.dataset.docId !== doc.id) return;
      for (const card of wrap.children) {
        const i = Number(card.dataset.pageIndex);
        card.classList.toggle("selected", doc.selectedPages.has(i) || (doc.selectedPages.size <= 1 && i === doc.currentPage));
      }
      const selected = wrap.querySelector(`[data-page-index="${doc.currentPage}"]`);
      if (selected) {
        const pane = document.getElementById("leftPaneContent");
        const top = selected.offsetTop - pane.offsetTop;
        if (top < pane.scrollTop) pane.scrollTop = top;
        else if (top + selected.offsetHeight > pane.scrollTop + pane.clientHeight) pane.scrollTop = top + selected.offsetHeight - pane.clientHeight;
      }
    }
    function queuePagePreview(slot, doc, scale, epoch) {
      if (slot.dataset.previewQueued || slot.dataset.rendering || slot.querySelector("#pageStage")) return;
      slot.dataset.previewQueued = "1";
      flowQueue.push({slot, doc, scale, epoch}); pumpPagePreviews();
    }
    function pumpPagePreviews() {
      while (flowRunning < 2 && flowQueue.length) {
        const job = flowQueue.shift();
        if (job.epoch !== flowEpoch || !job.slot.isConnected || job.slot.querySelector("#pageStage")) { delete job.slot.dataset.previewQueued; continue; }
        flowRunning++; job.slot.dataset.rendering = "1";
        (async () => {
          const i = Number(job.slot.dataset.pageIndex);
          const page = await job.doc.pdfJsDoc.getPage(i + 1);
          if (job.epoch !== flowEpoch || !job.slot.isConnected || job.slot.querySelector("#pageStage")) return;
          const canvas = document.createElement("canvas"), dpr = Math.min(devicePixelRatio || 1, 1.25);
          const vp = page.getViewport({scale: job.scale * dpr});
          canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
          job.slot.replaceChildren(canvas);
          await page.render({canvas, canvasContext:canvas.getContext("2d"), viewport:vp}).promise;
          if (job.epoch !== flowEpoch || !job.slot.isConnected || !job.slot.dataset.visible || job.slot.querySelector("#pageStage")) { if (!job.slot.querySelector("#pageStage")) job.slot.replaceChildren(); return; }
          const layer = document.createElement("div"); layer.className = "page-preview-overlay";
          renderOverlayItems(job.doc, i, job.scale, layer);
          job.slot.appendChild(layer);
        })().catch(error => { if (error.name !== "RenderingCancelledException") console.warn("페이지 미리보기 실패", error); })
          .finally(() => {
            delete job.slot.dataset.rendering;
            if (!job.slot.dataset.visible && !job.slot.querySelector("#pageStage")) { job.slot.replaceChildren(); delete job.slot.dataset.previewQueued; }
            flowRunning--; pumpPagePreviews();
          });
      }
    }
    function preparePageFlow(doc, scale, pageIdx) {
      const flow = document.getElementById("pagesFlow"), stage = document.getElementById("pageStage");
      const vp = document.getElementById("canvasViewport");
      const key = `${state.viewMode}:${doc.pageCount}:${scale.toFixed(4)}`;
      if (flowDoc !== doc || flowBytes !== doc.bytes || flowKey !== key) {
        flowEpoch++; flowQueue = []; flowObserver?.disconnect(); flowVisibleSlots.clear();
        flowDoc = doc; flowBytes = doc.bytes; flowKey = key;
        stage.remove(); flow.replaceChildren();
        flow.style.gridTemplateColumns = `repeat(${viewColumns()}, max-content)`;
        const count = state.viewMode === "single" ? 1 : doc.pageCount;
        for (let n = 0; n < count; n++) {
          const i = state.viewMode === "single" ? pageIdx : n;
          const size = doc.pageSizes[i] || {width:595.28,height:841.89};
          const slot = document.createElement("div"); slot.className = "page-slot"; slot.dataset.pageIndex = String(i);
          slot.style.width = `${Math.round(size.width * scale)}px`; slot.style.height = `${Math.round(size.height * scale)}px`;
          slot.addEventListener("click", event => {
            if (event.target.closest("#pageStage") || activeDoc() !== doc || doc.currentPage === i) return;
            doc.currentPage = i; doc.selectedPages = new Set([i]); state.selectedInsertId = null;
            renderCurrentPageCanvas();
          });
          flow.appendChild(slot);
        }
        if (state.viewMode !== "single") {
          const epoch = flowEpoch;
          flowObserver = new IntersectionObserver(entries => {
            for (const entry of entries) {
              if (entry.isIntersecting) { flowVisibleSlots.add(entry.target); entry.target.dataset.visible = "1"; queuePagePreview(entry.target, doc, scale, epoch); }
              else { flowVisibleSlots.delete(entry.target); delete entry.target.dataset.visible; if (!entry.target.querySelector("#pageStage")) { entry.target.replaceChildren(); if (!entry.target.dataset.rendering) delete entry.target.dataset.previewQueued; } }
            }
            if (!flowScrollFrame) flowScrollFrame = requestAnimationFrame(syncPageFromScroll);
          }, {root:vp, rootMargin:"250px"});
          for (const slot of flow.children) flowObserver.observe(slot);
        }
      }
      if (state.viewMode === "single" && flow.firstElementChild?.dataset.pageIndex !== String(pageIdx)) {
        flowKey = ""; return preparePageFlow(doc, scale, pageIdx);
      }
      const slot = flow.querySelector(`[data-page-index="${pageIdx}"]`);
      if (!slot) return;
      const previous = stage.parentElement;
      if (previous !== slot) {
        const preview = slot.querySelector(":scope > canvas");
        const activeCanvas = stage.querySelector("#pdfRenderCanvas");
        if (preview && preview.width > 0 && preview.height > 0) {
          activeCanvas.width = preview.width; activeCanvas.height = preview.height;
          activeCanvas.getContext("2d").drawImage(preview, 0, 0);
          stage.dataset.displayPage = String(pageIdx); stage.dataset.displayDoc = doc.id; displayReader = doc.pdfJsDoc;
        } else {
          activeCanvas.width = 1; activeCanvas.height = 1;
          stage.dataset.displayPage = ""; stage.dataset.displayDoc = ""; displayReader = null;
        }
        stage.remove(); slot.replaceChildren(stage);
        if (previous?.classList.contains("page-slot") && previous.isConnected) {
          delete previous.dataset.previewQueued;
          queuePagePreview(previous, doc, scale, flowEpoch);
        }
        if (!flowFromScroll && state.viewMode !== "single") slot.scrollIntoView({block:"nearest", inline:"nearest"});
      }
    }
    function syncPageFromScroll() {
      flowScrollFrame = 0;
      const doc = activeDoc(), vp = document.getElementById("canvasViewport"), flow = document.getElementById("pagesFlow");
      if (!doc || doc.scrollSyncSuspended || state.viewMode === "single" || flowDoc !== doc) return;
      const viewportRect = vp.getBoundingClientRect();
      const visible = [...flowVisibleSlots].filter(slot => { const r=slot.getBoundingClientRect(); return r.bottom > viewportRect.top && r.top < viewportRect.bottom && r.right > viewportRect.left && r.left < viewportRect.right; });
      if (!visible.length) return;
      const current = flow.querySelector(`[data-page-index="${doc.currentPage}"]`);
      const currentRect = current?.getBoundingClientRect();
      const currentArea = currentRect ? Math.max(0, Math.min(currentRect.bottom, viewportRect.bottom) - Math.max(currentRect.top, viewportRect.top)) : 0;
      const target = visible.reduce((best, slot) => {
        const r = slot.getBoundingClientRect(), height = Math.max(0, Math.min(r.bottom, viewportRect.bottom) - Math.max(r.top, viewportRect.top));
        return height > best.height ? {slot,height} : best;
      }, {slot:visible[0],height:0});
      if (current && currentArea >= target.height * 0.85) return;
      const i = Number(target.slot.dataset.pageIndex);
      if (i === doc.currentPage) return;
      doc.currentPage = i;
      if (doc.selectedPages.size <= 1) doc.selectedPages = new Set([i]);
      state.selectedInsertId = null;
      flowFromScroll = true; renderCurrentPageCanvas().finally(() => { flowFromScroll = false; });
    }
    let currentRenderTask = null;
    let renderGeneration = 0;
    async function renderCurrentPageCanvas() {
      const generation = ++renderGeneration;
      if (currentRenderTask) {
        currentRenderTask.cancel();
        try { await currentRenderTask.promise; } catch (error) {
          if (error.name !== "RenderingCancelledException") console.warn("Previous render failed", error);
        }
        currentRenderTask = null;
      }
      const doc = activeDoc();
      if (!doc) return;

      const viewportEl = document.getElementById("canvasViewport");
      const canvas = document.getElementById("pdfRenderCanvas");
      const stage = document.getElementById("pageStage");
      const pageIdx = Math.max(0, Math.min(doc.currentPage, doc.pageCount - 1));
      const baseSize = doc.pageSizes[pageIdx] || { width: 595.28, height: 841.89 };

      const padW = isMobileViewport() ? 28 : 58;
      const padH = isMobileViewport() ? 24 : 46;

      if (doc.fitSizeSource !== doc.pageSizes) {
        doc.fitSizeSource = doc.pageSizes;
        doc.fitReferenceSize = doc.pageSizes.reduce((max, size) => ({width: Math.max(max.width, size.width), height: Math.max(max.height, size.height)}), {width: 1, height: 1});
      }
      const fitSize = doc.fitReferenceSize;
      if (doc.fitMode === "width") {
        const availW = Math.max(120, (viewportEl.clientWidth - padW - 16 * (viewColumns() - 1)) / viewColumns());
        doc.zoom = Math.max(0.25, Math.min(3.0, availW / fitSize.width));
      } else if (doc.fitMode === "page") {
        const availW = Math.max(120, (viewportEl.clientWidth - padW - 16 * (viewColumns() - 1)) / viewColumns());
        const availH = Math.max(240, viewportEl.clientHeight - padH);
        doc.zoom = Math.max(0.25, Math.min(3.0, Math.min(availW / fitSize.width, availH / fitSize.height)));
      }

      const scale = doc.zoom;
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      const cssW = Math.round(baseSize.width * scale);
      const cssH = Math.round(baseSize.height * scale);

      preparePageFlow(doc, scale, pageIdx);
      stage.style.width = `${cssW}px`;
      stage.style.height = `${cssH}px`;
      canvas.style.width = `${cssW}px`;
      canvas.style.height = `${cssH}px`;
      const displayMatches = stage.dataset.displayDoc === doc.id && stage.dataset.displayPage === String(pageIdx) && displayReader === doc.pdfJsDoc;
      stage.dataset.loading = String(!displayMatches);
      if (!displayMatches) { canvas.width = 1; canvas.height = 1; }

      if (doc.pdfJsDoc) {
        try {
          const reader = doc.pdfJsDoc;
          const pdfPage = await reader.getPage(pageIdx + 1);
          if (generation !== renderGeneration || activeDoc() !== doc || reader !== doc.pdfJsDoc) return;
          const viewport = pdfPage.getViewport({ scale: scale * dpr });
          const buffer = document.createElement("canvas");
          buffer.width = Math.round(viewport.width); buffer.height = Math.round(viewport.height);
          const task = pdfPage.render({canvas: buffer, canvasContext: buffer.getContext("2d"), viewport});
          currentRenderTask = task;
          await task.promise;
          if (currentRenderTask === task) currentRenderTask = null;
          if (generation !== renderGeneration || activeDoc() !== doc || reader !== doc.pdfJsDoc) return;
          canvas.width = buffer.width; canvas.height = buffer.height;
          canvas.getContext("2d").drawImage(buffer, 0, 0);
          stage.dataset.displayPage = String(pageIdx); stage.dataset.displayDoc = doc.id; displayReader = reader;
          stage.dataset.loading = "false";
        } catch (error) {
          if (error.name === "RenderingCancelledException" || generation !== renderGeneration) return;
          stage.dataset.loading = "false";
          showToast(`PDF 페이지 표시 실패: ${error.message || error}`, "fa-circle-exclamation");
        }
      } else {
        stage.dataset.loading = "false";
        showToast("PDF 렌더러를 사용할 수 없습니다.", "fa-circle-exclamation");
      }

      renderOverlayItems(doc, pageIdx, scale);
      updateCommandStates();
      syncThumbnailSelection(doc);
    }

    function renderOverlayItems(doc, pageIdx, scale, previewContainer = null) {
      const container = previewContainer || document.getElementById("annotationOverlay");
      container.innerHTML = "";

      const items = doc.overlays.filter((it) => it.pageIndex === pageIdx);
      items.forEach((item) => {
        const el = document.createElement("div");
        el.className =
          "overlay-item" +
          (state.selectedInsertId === item.id ? " selected" : "") +
          (state.insertMoveMode ? " move-mode" : "");
        el.style.left = `${Math.round(item.x * scale)}px`;
        el.style.top = `${Math.round(item.y * scale)}px`;
        if (item.width) el.style.width = `${Math.round(item.width * scale)}px`;
        if (item.height) el.style.height = `${Math.round(item.height * scale)}px`;
        el.style.fontSize = `${Math.max(9, Math.round((item.fontSize || 13) * scale))}px`;
        el.style.color = item.color || "#1B2631";
        el.style.background = item.bgColor || "transparent";
        el.style.opacity = String(item.opacity ?? 1);

        if (item.type === "Watermark") {
          el.style.fontWeight = "800";
          el.style.transform = "rotate(-24deg)";
          el.style.letterSpacing = "2px";
          el.textContent = item.text;
        } else if (item.type === "Stamp") {
          el.style.border = `2px solid ${item.color || "#1F6F9F"}`;
          el.style.fontWeight = "700";
          el.style.display = "flex";
          el.style.alignItems = "center";
          el.style.justifyContent = "center";
          el.textContent = item.text;
        } else if (item.type === "Note") {
          el.style.borderLeft = "4px solid #E58A18";
          el.style.boxShadow = "0 2px 6px rgba(0,0,0,0.12)";
          el.textContent = `💬 ${item.text}`;
        } else if (item.type === "Table" && Array.isArray(item.cells)) {
          const tbl = document.createElement("table");
          tbl.className = "overlay-table";
          item.cells.forEach((row, rIdx) => {
            const tr = document.createElement("tr");
            row.forEach((cellText) => {
              const cell = document.createElement(rIdx === 0 ? "th" : "td");
              if (rIdx === 0) cell.style.background = "#EAF2F8";
              cell.textContent = cellText;
              tr.appendChild(cell);
            });
            tbl.appendChild(tr);
          });
          el.appendChild(tbl);
        } else {
          el.textContent = item.text;
        }

        if (previewContainer) { container.appendChild(el); return; }

        // Unified Mouse + Touch Drag Handler for Desktop & Mobile
        const startDrag = (clientX, clientY) => {
          state.selectedInsertId = item.id;
          el.classList.add("selected");
          updateCommandStates();

          const origX = item.x;
          const origY = item.y;
          let moved = false;

          const applyMove = (cx, cy) => {
            const dx = (cx - clientX) / scale;
            const dy = (cy - clientY) / scale;
            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
              if (!moved) {
                saveUndoSnapshot(doc, `항목 이동 (${item.type})`);
                moved = true;
              }
              const pageSz = doc.pageSizes[pageIdx] || { width: 595, height: 842 };
              item.x = Math.max(0, Math.min(pageSz.width - 40, Math.round(origX + dx)));
              item.y = Math.max(0, Math.min(pageSz.height - 24, Math.round(origY + dy)));
              el.style.left = `${Math.round(item.x * scale)}px`;
              el.style.top = `${Math.round(item.y * scale)}px`;
            }
          };

          return { applyMove, wasMoved: () => moved };
        };

        el.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          const drag = startDrag(e.clientX, e.clientY);
          const onMove = (me) => drag.applyMove(me.clientX, me.clientY);
          const onUp = () => {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            if (drag.wasMoved()) renderRightPane();
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });

        el.addEventListener(
          "touchstart",
          (e) => {
            e.stopPropagation();
            const t = e.touches[0];
            if (!t) return;
            const drag = startDrag(t.clientX, t.clientY);
            const onTouchMove = (te) => {
              const tm = te.touches[0];
              if (!tm) return;
              te.preventDefault();
              drag.applyMove(tm.clientX, tm.clientY);
            };
            const onTouchEnd = () => {
              window.removeEventListener("touchmove", onTouchMove);
              window.removeEventListener("touchend", onTouchEnd);
              if (drag.wasMoved()) renderRightPane();
            };
            window.addEventListener("touchmove", onTouchMove, { passive: false });
            window.addEventListener("touchend", onTouchEnd);
          },
          { passive: true }
        );

        el.addEventListener("dblclick", (e) => {
          e.stopPropagation();
          state.selectedInsertId = item.id;
          openEditInsertItemModal();
        });

        // Bottom-right Resize Handle for commercial-grade direct manipulation
        const resizeHandle = document.createElement("div");
        resizeHandle.className = "overlay-resize-handle";
        resizeHandle.title = "드래그하여 크기 조절";
        const startResize = (startX, startY) => {
          const initW = item.width || Math.max(80, Math.round(el.offsetWidth / scale));
          const initH = item.height || Math.max(26, Math.round(el.offsetHeight / scale));
          const initFont = item.fontSize || 13;
          let resized = false;
          return {
            applyResize: (cx, cy) => {
              const dw = (cx - startX) / scale;
              const dh = (cy - startY) / scale;
              if (Math.abs(dw) > 2 || Math.abs(dh) > 2) {
                if (!resized) {
                  saveUndoSnapshot(doc, `항목 크기 조절 (${item.type})`);
                  resized = true;
                }
                item.width = Math.max(48, Math.round(initW + dw));
                item.height = Math.max(22, Math.round(initH + dh));
                if (item.type !== "Table") {
                  item.fontSize = Math.max(8, Math.min(72, Math.round(initFont * (item.height / initH))));
                  el.style.fontSize = `${Math.max(9, Math.round(item.fontSize * scale))}px`;
                }
                el.style.width = `${Math.round(item.width * scale)}px`;
                el.style.height = `${Math.round(item.height * scale)}px`;
              }
            },
            wasResized: () => resized,
          };
        };

        resizeHandle.addEventListener("mousedown", (re) => {
          re.stopPropagation();
          const rs = startResize(re.clientX, re.clientY);
          const onMove = (me) => rs.applyResize(me.clientX, me.clientY);
          const onUp = () => {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            if (rs.wasResized()) renderRightPane();
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });

        resizeHandle.addEventListener(
          "touchstart",
          (re) => {
            re.stopPropagation();
            const t = re.touches[0];
            if (!t) return;
            const rs = startResize(t.clientX, t.clientY);
            const onMove = (te) => {
              const tm = te.touches[0];
              if (!tm) return;
              te.preventDefault();
              rs.applyResize(tm.clientX, tm.clientY);
            };
            const onEnd = () => {
              window.removeEventListener("touchmove", onMove);
              window.removeEventListener("touchend", onEnd);
              if (rs.wasResized()) renderRightPane();
            };
            window.addEventListener("touchmove", onMove, { passive: false });
            window.addEventListener("touchend", onEnd);
          },
          { passive: true }
        );

        el.appendChild(resizeHandle);
        container.appendChild(el);
      });
    }
