name: Manual production release
on:
  workflow_dispatch:
    inputs:
      confirmed_release:
        description: Functional/browser review, backup and schema preparation are complete
        required: true
        type: boolean
        default: false
      validated_commit:
        description: Exact main commit SHA whose full CI passed
        required: true
        type: string
      private_backup_sha256:
        description: SHA-256 of the protected D1 backup stored outside GitHub
        required: true
        type: string
      isolated_restore_receipt:
        description: Verifiable receipt from isolated D1 restore rehearsal
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: sunrise-production-release
  cancel-in-progress: false
jobs:
  release:
    if: inputs.confirmed_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOYMENT_EVENT_SECRET: ${{ secrets.DEPLOYMENT_EVENT_SECRET }}
      DEPLOYMENT_ENVIRONMENT: production
      BACKUP_HASH: ${{ inputs.private_backup_sha256 }}
      RESTORE_RECEIPT: ${{ inputs.isolated_restore_receipt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact release commit and successful full main CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: node scripts/check-release-ci-gate.cjs
      - name: Require Cloudflare credentials and private D1 recovery evidence
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DEPLOYMENT_EVENT_SECRET"
          node - <<'NODE'
          const assert=require('node:assert/strict');
          assert(/^[a-f0-9]{64}$/i.test(process.env.BACKUP_HASH||''),
            'Private D1 backup SHA-256 evidence is required');
          const receipt=(process.env.RESTORE_RECEIPT||'').trim();
          assert(receipt.length>=12&&receipt.length<=256,
            'Verified isolated restoration receipt is required');
          console.log('Backup/restoration evidence format checked; operator must retain the private records');
          NODE
      - run: npm ci --ignore-scripts
      - name: Build reviewed source
        run: npm run build
      - name: Install pinned Wrangler for D1 preflight and release
        run: npm install --no-save --package-lock=false --ignore-scripts wrangler@4.156.0
      - name: Verify remote production D1 schema (read-only)
        env:
          WRANGLER_BIN: ./node_modules/.bin/wrangler
        run: npm run release:schema
      - name: Verify Worker bundle without publishing
        run: ./node_modules/.bin/wrangler deploy --dry-run
      - name: Deploy reviewed source
        id: deploy
        continue-on-error: true
        run: ./node_modules/.bin/wrangler deploy
      - name: Smoke-test public editor, D1 notices and protected admin API
        id: smoke
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base='https://sunrise-pdf-editor.ko-pg.workers.dev'
          curl --fail --silent --show-error --retry 4 --retry-delay 3 "${base}/editor/" -o /tmp/sunrise-editor.html
          grep -q 'Sunrise PDF Editor' /tmp/sunrise-editor.html
          curl --fail --silent --show-error --retry 4 --retry-delay 3 "${base}/api/site-updates" -o /tmp/sunrise-updates.json
          node -e "const d=require('/tmp/sunrise-updates.json');if(!Array.isArray(d.announcements)||!Array.isArray(d.releases))process.exit(1)"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base}/api/admin/health")"
          test "$status" = '401'
      - name: Report actual deployment and smoke outcome
        if: always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ] && [ "$SMOKE_OUTCOME" = "success" ]; then
            node scripts/report-deployment.cjs succeeded
          else
            node scripts/report-deployment.cjs failed
          fi
      - name: Preserve unsuccessful deployment or smoke outcome
        if: steps.deploy.outcome != 'success' || steps.smoke.outcome != 'success'
        run: exit 1
