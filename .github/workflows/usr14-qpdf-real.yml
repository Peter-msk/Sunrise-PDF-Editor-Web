name: USR-14 real AES-256 QPDF verification
on:
  workflow_dispatch:
  pull_request:
    # Encryption validation joins the batch-complete review gate.
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'scripts/protect-pdf-local.cjs'
      - 'tests/pdf-encrypt-*.cjs'
      - 'package.json'
      - '.github/workflows/usr14-qpdf-real.yml'
permissions:
  contents: read
jobs:
  encrypt:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install vetted qpdf from Ubuntu repositories
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qpdf
          qpdf --version
      - run: npm ci --ignore-scripts
      - name: Encrypt and reopen actual AES-256 PDF using qpdf
        run: npm run test:qpdf-real
