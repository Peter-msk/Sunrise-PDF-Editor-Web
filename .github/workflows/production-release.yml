name: Sunrise PDF Editor production release

# Explicit manual release only. Never deploy a draft branch or a passing PR by itself.
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact validated main commit SHA (40 hex characters)'
        required: true
        type: string
      private_backup_sha256:
        description: 'SHA-256 of the verified private D1 backup kept outside GitHub'
        required: true
        type: string
      isolated_restore_receipt:
        description: 'Private isolated D1 restoration verification receipt'
        required: true
        type: string

concurrency:
  group: sunrise-pdf-production-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPROVED_SHA: ${{ inputs.approved_sha }}
      PRIVATE_BACKUP_SHA256: ${{ inputs.private_backup_sha256 }}
      RESTORE_RECEIPT: ${{ inputs.isolated_restore_receipt }}
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@v4

      - name: Require exact SHA, private backup and isolated restoration evidence
        shell: bash
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const approved = process.env.APPROVED_SHA || '';
          const sha = process.env.GITHUB_SHA || '';
          const backup = process.env.PRIVATE_BACKUP_SHA256 || '';
          const restore = (process.env.RESTORE_RECEIPT || '').trim();
          assert(/^[a-f0-9]{40}$/i.test(approved) && approved === sha,
            'The release is not approved for this exact main commit');
          assert(/^[a-f0-9]{64}$/i.test(backup),
            'A valid private backup SHA-256 attestation is required');
          assert(restore.length >= 12 && restore.length <= 256,
            'Isolated restoration must have a recorded, verifiable receipt');
          assert(process.env.CLOUDFLARE_API_TOKEN && process.env.CLOUDFLARE_ACCOUNT_ID,
            'Cloudflare production credentials are not configured');
          console.log('Release evidence format checked; operator retains private backup/restore records');
          NODE

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned application dependencies
        run: npm ci --ignore-scripts

      - name: Require completed passing main push validation for exact SHA
        run: npm run release:check
        env:
          VALIDATED_COMMIT: ${{ inputs.approved_sha }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run complete application contracts and release build
        run: |
          npm test
          npm run progress:check
          npm run build

      - name: Install pinned Wrangler runtime
        run: npm install --no-save --package-lock=false --ignore-scripts wrangler@4.156.0

      - name: Verify remote production D1 schema without reading customer rows
        run: npm run release:schema
        env:
          WRANGLER_BIN: ./node_modules/.bin/wrangler

      - name: Check production Worker bundle before upload
        run: ./node_modules/.bin/wrangler deploy --dry-run

      - name: Deploy only the approved release to Cloudflare
        run: ./node_modules/.bin/wrangler deploy

      - name: Smoke-test public editor and D1-backed announcements
        shell: bash
        run: |
          set -euo pipefail
          base='https://sunrise-pdf-editor.ko-pg.workers.dev'
          curl --fail --silent --show-error --retry 4 --retry-delay 3 "${base}/editor/" -o /tmp/sunrise-editor.html
          grep -q 'Sunrise PDF Editor' /tmp/sunrise-editor.html
          curl --fail --silent --show-error --retry 4 --retry-delay 3 "${base}/api/site-updates" -o /tmp/sunrise-updates.json
          node -e "const d=require('/tmp/sunrise-updates.json');if(!Array.isArray(d.announcements)||!Array.isArray(d.releases))process.exit(1)"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' "${base}/api/admin/health")"
          test "$code" = '401'
          echo 'Production public editor/updates and private admin access gate checked'
