name: Sunrise PDF Editor validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'dist/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'dist/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  node-contracts:
    name: Node contracts and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Run the complete contract suite
        run: npm test
      - name: Validate feature-by-feature development progress
        run: npm run progress:check
      - name: Build release assets
        run: npm run build
      - name: Ensure repository files are not modified unexpectedly
        run: |
          git status --short
          test -z "$(git status --porcelain -- src scripts tests package.json package-lock.json)"

  browser-chromium:
    name: Real Chromium PDF save and reopen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install release dependencies
        run: npm ci --ignore-scripts
      - name: Build the editor as deployed
        run: npm run build
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: Chromium upload, Save As, download and reopen
        run: node tests/browser-save-reopen.cjs
      - name: Ensure browser test did not alter application sources
        run: |
          test -z "$(git status --porcelain -- src scripts tests package.json package-lock.json)"
