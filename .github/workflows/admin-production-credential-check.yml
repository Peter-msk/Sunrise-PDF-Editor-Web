name: Admin deploy credential readiness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/admin-production-credential-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credentials:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify required GitHub production secrets exist (without disclosing values)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_SECRET: ${{ secrets.DEPLOYMENT_EVENT_SECRET }}
        shell: bash
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "Cloudflare deployment credentials: present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cloudflare deployment credentials: missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "$DEPLOYMENT_SECRET" ]; then
            echo "Deployment reporting credentials: present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployment reporting credentials: absent; notification feature must be deferred" >> "$GITHUB_STEP_SUMMARY"
          fi
